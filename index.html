function Stars({n}){
  return <span aria-label={`${n} étoile${n>1?'s':''} sur 3`} style={{fontSize:34,letterSpacing:4}}>{[0,1,2].map(k=><span key={k} className="pop" style={{animationDelay:`${k*0.15}s`,display:'inline-block',color:k<n?'#f5a300':'rgba(22,18,29,0.18)'}}>★</span>)}</span>;
}

function QuiParle(){
  const N=10;
  const [phase,setPhase]=useState('intro');
  const [deck,setDeck]=useState([]);
  const [i,setI]=useState(0);
  const [ans,setAns]=useState(null);
  const [score,setScore]=useState(0);
  const [streak,setStreak]=useState(0);
  const [best,setBest]=useState(0);
  const [misses,setMisses]=useState([]);
  const q=deck[i];

  const start=()=>{
    setDeck([...QUI_PARLE].sort(()=>Math.random()-0.5).slice(0,N));
    setI(0);setAns(null);setScore(0);setStreak(0);setBest(0);setMisses([]);setPhase('play');
  };
  const answer=p=>{
    if(ans!==null||!q)return;
    setAns(p);
    if(p===q.p){const n=streak+1;setScore(x=>x+1);setStreak(n);setBest(b=>Math.max(b,n));}
    else{setStreak(0);setMisses(m=>[...m,q]);}
  };
  const next=()=>{if(i+1>=deck.length)setPhase('end');else{setI(i+1);setAns(null);}};

  useEffect(()=>{
    if(phase!=='play')return;
    const onKey=e=>{
      if(e.key==='1')answer(1);
      else if(e.key==='2')answer(2);
      else if(e.key==='Enter'&&ans!==null){e.preventDefault();next();}
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  });

  if(phase==='intro') return(
    <div className="b" style={{background:'var(--lilac)',textAlign:'center',padding:'2.25rem 1.25rem'}}>
      <div style={{fontSize:44}}>🎭</div>
      <h3 style={{fontSize:'clamp(28px,5vw,40px)',margin:'8px 0'}}>Qui parle ?</h3>
      <p style={{maxWidth:460,margin:'0 auto',fontSize:15,lineHeight:1.6}}>Une réplique de la pièce s'affiche. À toi de dire si c'est <strong>H1</strong> ou <strong>H2</strong> qui la prononce. {N} répliques, tirées au hasard à chaque partie.</p>
      <p style={{fontSize:12.5,marginTop:10,opacity:0.75}}>Astuce : touches 1 et 2 du clavier, Entrée pour continuer.</p>
      <button onClick={start} style={{...s.btn,marginTop:18,padding:'12px 26px',fontSize:15,background:'var(--ink)',color:'#fff'}}>Jouer →</button>
    </div>
  );

  if(phase==='end'){
    const stars=score>=9?3:score>=7?2:score>=5?1:0;
    const mot=stars===3?'Tu connais H1 et H2 par cœur !':stars===2?'Très bien, tu as l\'oreille !':stars===1?'Pas mal, relis les passages ratés.':'Relis la pièce et retente ta chance !';
    return(
      <div>
        <div className="b" style={{background:'var(--yellow)',textAlign:'center',padding:'2rem 1.25rem'}}>
          <Stars n={stars}/>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:56,lineHeight:1,margin:'10px 0 4px'}}>{score}/{deck.length}</p>
          <p style={{fontWeight:600}}>{mot}</p>
          {best>=3&&<p style={{fontSize:13,marginTop:6}}>🔥 Meilleure série : {best} bonnes réponses d'affilée</p>}
          <button onClick={start} style={{...s.btn,marginTop:16,background:'var(--ink)',color:'#fff'}}>🔄 Rejouer</button>
        </div>
        {misses.length>0&&(
          <div className="b" style={{background:'var(--surface)',marginTop:16}}>
            <span className="kicker" style={{background:'var(--pink)'}}>À revoir</span>
            <ul style={{listStyle:'none',marginTop:12,display:'flex',flexDirection:'column',gap:12}}>
              {misses.map((m,k)=>(
                <li key={k} style={{borderTop:k?'1px solid var(--line)':'none',paddingTop:k?12:0}}>
                  <p style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:16}}>« {m.t} » <strong style={{fontFamily:'var(--sans)',fontStyle:'normal'}}>: H{m.p}</strong></p>
                  <p style={{fontSize:13.5,color:'var(--muted)',marginTop:3,lineHeight:1.55}}>{m.ex}</p>
                </li>
              ))}
            </ul>
          </div>
        )}
      </div>
    );
  }

  const ok=ans!==null&&ans===q.p;
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,gap:8,flexWrap:'wrap'}}>
        <span className="chip">Réplique {i+1} / {deck.length}</span>
        <span style={{display:'flex',gap:8}}>
          {streak>=2&&<span className="chip pop" key={streak} style={{background:'var(--coral)'}}>🔥 {streak} d'affilée</span>}
          <span className="chip" style={{background:'var(--yellow)'}}>Score : {score}</span>
        </span>
      </div>
      <div style={{height:10,border:'2px solid var(--ink)',borderRadius:999,background:'#fff',overflow:'hidden',marginBottom:16}}>
        <div style={{height:'100%',width:`${((i+(ans!==null?1:0))/deck.length)*100}%`,background:'var(--violet)',transition:'width .3s'}}/>
      </div>
      <div className="b" style={{background:'var(--surface)',padding:'2rem 1.5rem',textAlign:'center'}}>
        <span className="kicker" style={{background:'var(--lilac)'}}>Qui parle ?</span>
        <p key={i} className="fade" style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:'clamp(21px,3.6vw,30px)',lineHeight:1.35,margin:'1rem auto 0',maxWidth:620}}>« {q.t} »</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:16}}>
        {[1,2].map(p=>{
          let bg=p===1?'var(--lilac)':'var(--pink)';
          if(ans!==null){bg=p===q.p?'var(--mint)':p===ans?'#ff9b8a':'#eeeaf2';}
          return(
            <button key={p} className="b" onClick={()=>answer(p)} disabled={ans!==null} style={{background:bg,textAlign:'center',padding:'1.1rem',cursor:ans===null?'pointer':'default'}}>
              <span style={{display:'block',fontFamily:'var(--display)',fontWeight:800,fontSize:40,lineHeight:1}}>H{p}</span>
              <span style={{fontSize:12,opacity:0.7}}>{ans!==null&&p===q.p?'✓ bonne réponse':`touche ${p}`}</span>
            </button>
          );
        })}
      </div>
      {ans!==null&&(
        <div className={'b fade'+(ok?'':' shake')} style={{marginTop:16,background:ok?'var(--mint)':'#ffd9d1'}}>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:20}}>{ok?'✓ Bien vu !':`✗ Raté : c'est H${q.p}.`}</p>
          <p style={{fontSize:14.5,marginTop:6,lineHeight:1.6}}>{q.ex}</p>
          <button onClick={next} style={{...s.btn,marginTop:14,background:'var(--ink)',color:'#fff'}}>{i+1>=deck.length?'Voir mon score →':'Réplique suivante →'}</button>
        </div>
      )}
    </div>
  );
}

/* ── JEU 2 : REMETS LA PIÈCE DANS L'ORDRE ───────────────────────────────── */
const ORDRE_PIECE=[
  {id:1,t:"H1 vient voir H2 pour lui demander ce qu'il a contre lui."},
  {id:2,t:"H2 finit par avouer : tout vient d'un « C'est bien… ça »."},
  {id:3,t:"H2 révèle qu'il a demandé l'autorisation de rompre : débouté, il est fiché comme « celui qui rompt pour un oui ou pour un non »."},
  {id:4,t:"H1 propose un mot pour nommer le grief : « condescendant »."},
  {id:5,t:"H2 va chercher ses voisins pour qu'ils jugent le différend."},
  {id:6,t:"Devant eux, H2 accuse H1 de lui avoir tendu une « souricière » avec une tournée de conférences."},
  {id:7,t:"Les voisins repartent, perplexes ; H2 reproche à H1 d'« étaler » son bonheur et nie être jaloux."},
  {id:8,t:"À la fenêtre, H2 dit « la vie est là » : H1 reconnaît Verlaine et l'accuse de se réfugier dans la « poésie »."},
  {id:9,t:"H1 rappelle l'ascension de la Barre des Écrins et sa moquerie sur les « cartes postales »."},
  {id:10,t:"H2 déclare qu'ils sont deux camps ennemis ; le mot « raté » est lâché."},
  {id:11,t:"Chacun décrit son malaise chez l'autre : sables mouvants pour H1, claustrophobie pour H2."},
  {id:12,t:"Ils envisagent une demande de rupture à deux… et la pièce s'achève sur « Oui » / « Non ! »."},
];
const ORDRE_COURT=[1,2,5,8,10,12];

function OrdrePiece(){
  const [niveau,setNiveau]=useState(null);
  const [pool,setPool]=useState([]);
  const [placed,setPlaced]=useState([]);
  const [checked,setChecked]=useState(false);
  const items=niveau?ORDRE_PIECE.filter(e=>niveau==='court'?ORDRE_COURT.includes(e.id):true):[];
  const expected=items.map(e=>e.id);

  const start=nv=>{
    const its=ORDRE_PIECE.filter(e=>nv==='court'?ORDRE_COURT.includes(e.id):true);
    let sh;
    do{sh=[...its].sort(()=>Math.random()-0.5);}while(sh.every((e,k)=>e.id===its[k].id));
    setNiveau(nv);setPool(sh);setPlaced([]);setChecked(false);
  };
  const place=e=>{if(checked)return;setPool(p=>p.filter(x=>x.id!==e.id));setPlaced(p=>[...p,e]);};
  const unplace=e=>{if(checked)return;setPlaced(p=>p.filter(x=>x.id!==e.id));setPool(p=>[...p,e]);};
  const nbOk=placed.filter((e,k)=>e.id===expected[k]).length;

  if(!niveau) return(
    <div className="b" style={{background:'var(--yellow)',textAlign:'center',padding:'2.25rem 1.25rem'}}>
      <div style={{fontSize:44}}>🧩</div>
      <h3 style={{fontSize:'clamp(28px,5vw,40px)',margin:'8px 0'}}>Remets la pièce dans l'ordre</h3>
      <p style={{maxWidth:480,margin:'0 auto',fontSize:15,lineHeight:1.6}}>Les étapes de la dispute sont mélangées. Clique-les dans l'ordre où elles arrivent dans la pièce. Clique sur une étape déjà placée pour la retirer.</p>
      <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginTop:18}}>
        <button onClick={()=>start('court')} style={{...s.btn,padding:'12px 20px',fontSize:14}}>Les grandes étapes ({ORDRE_COURT.length})</button>
        <button onClick={()=>start('long')} style={{...s.btn,padding:'12px 20px',fontSize:14,background:'var(--ink)',color:'#fff'}}>Toute la pièce ({ORDRE_PIECE.length})</button>
      </div>
    </div>
  );

  const complet=pool.length===0;
  const stars=checked?(nbOk===items.length?3:nbOk>=items.length*0.7?2:nbOk>=items.length*0.4?1:0):0;
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,gap:8,flexWrap:'wrap'}}>
        <span className="chip" style={{background:'var(--yellow)'}}>{niveau==='court'?'Les grandes étapes':'Toute la pièce'} · {placed.length}/{items.length} placées</span>
        <button onClick={()=>setNiveau(null)} style={{...s.btn,fontSize:12}}>Changer de niveau</button>
      </div>

      {checked&&(
        <div className={'b fade'+(nbOk===items.length?'':' shake')} style={{background:nbOk===items.length?'var(--mint)':'var(--pink)',textAlign:'center',marginBottom:16}}>
          <Stars n={stars}/>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:40,lineHeight:1,margin:'8px 0 4px'}}>{nbOk}/{items.length}</p>
          <p style={{fontWeight:600}}>{nbOk===items.length?'Parfait, tu connais la pièce sur le bout des doigts !':'Les étapes en rouge ne sont pas à leur place. Regarde l\'indication, puis réessaie.'}</p>
          <button onClick={()=>start(niveau)} style={{...s.btn,marginTop:14,background:'var(--ink)',color:'#fff'}}>🔄 Nouvelle partie</button>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,alignItems:'start'}}>
        {!checked&&(
          <div className="b" style={{background:'var(--sky)'}}>
            <span className="kicker">Étapes à placer</span>
            <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
              {pool.map(e=>(
                <button key={e.id} className="fade" onClick={()=>place(e)} style={{textAlign:'left',padding:'11px 13px',fontSize:14,lineHeight:1.45,border:'2px solid var(--ink)',borderRadius:14,background:'#fff',boxShadow:'2px 2px 0 var(--ink)'}}>{e.t}</button>
              ))}
              {complet&&<p style={{fontSize:14,fontWeight:600}}>Tout est placé ! Vérifie ta chronologie →</p>}
            </div>
          </div>
        )}
        <div className="b" style={{background:'var(--surface)',gridColumn:checked?'1 / -1':'auto'}}>
          <span className="kicker" style={{background:'var(--lilac)'}}>Ta chronologie</span>
          <ol style={{listStyle:'none',display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
            {items.map((_,k)=>{
              const e=placed[k];
              if(!e) return(
                <li key={'v'+k} style={{display:'flex',gap:10,alignItems:'center',padding:'11px 13px',border:'2px dashed rgba(22,18,29,0.3)',borderRadius:14,color:'var(--faint)',fontSize:13.5}}>
                  <span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:18,width:26,textAlign:'center'}}>{k+1}</span>{k===placed.length?'← clique une étape':''}
                </li>
              );
              const good=e.id===expected[k];
              const bg=checked?(good?'var(--mint)':'#ffd0c6'):'var(--paper)';
              return(
                <li key={e.id}>
                  <button onClick={()=>unplace(e)} disabled={checked} style={{width:'100%',display:'flex',gap:10,alignItems:'flex-start',textAlign:'left',padding:'11px 13px',fontSize:14,lineHeight:1.45,border:'2px solid var(--ink)',borderRadius:14,background:bg,cursor:checked?'default':'pointer'}}>
                    <span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:18,width:26,textAlign:'center',flexShrink:0}}>{k+1}</span>
                    <span style={{flex:1}}>
                      {e.t}
                      {checked&&!good&&<span style={{display:'block',fontSize:12.5,fontWeight:700,marginTop:4}}>↳ en réalité, étape n° {expected.indexOf(e.id)+1}</span>}
                    </span>
                    {checked&&<span aria-hidden="true">{good?'✅':'❌'}</span>}
                  </button>
                </li>
              );
            })}
          </ol>
          {complet&&!checked&&<button onClick={()=>setChecked(true)} style={{...s.btn,marginTop:16,width:'100%',padding:'12px',fontSize:15,background:'var(--violet)',color:'#fff'}}>Vérifier ma chronologie</button>}
        </div>
      </div>
    </div>
  );
}

function JeuxPiece({initial}){
  const [jeu,setJeu]=useState(initial||null);
  if(jeu) return(

/* ── RÉVISION DU JOUR ─────────────────────────────────────────────────────────
   5 questions par jour (les mêmes pour tout le monde le même jour), tirées des
   quiz du site. La série de jours est comptée en plumes ✒️, chaque jour ajoute un
   livre sur l'étagère, et la révision terminée débloque une citation. */
const CITATIONS_JOUR=[
  ["[Je ne puis faire autre chose que] prier les vertueuses Dames d'élever un peu leurs esprits par-dessus leurs quenouilles et fuseaux.","Louise Labé, Épître à Clémence de Bourges (1555)","Une poétesse de la Renaissance encourage les femmes à écrire : utile pour parler de la place des femmes en littérature."],
  ["Je suis moi-même la matière de mon livre.","Montaigne, Essais, « Au lecteur »","L'écriture de soi, de l'essai à l'autobiographie."],
  ["L'art n'est pas une étude de la réalité positive ; c'est une recherche de la vérité idéale.","George Sand, La Mare au diable","Pour opposer réalisme et idéalisme dans le roman."],
  ["Vingt fois sur le métier remettez votre ouvrage.","Boileau, L'Art poétique","L'écriture comme travail patient, idéal de l'écrivain classique."],
  ["Écrire ! pouvoir écrire ! cela signifie la longue rêverie devant la feuille blanche…","Colette, La Vagabonde","L'écriture entre rêverie, désir et difficulté."],
  ["Je voudrais bien savoir si la grande règle de toutes les règles n'est pas de plaire.","Molière, La Critique de L'École des femmes","Plaire au public, première règle du théâtre : utile pour toute réflexion sur le spectateur."],
  ["Une femme doit avoir de l'argent et une chambre à soi si elle veut écrire de la fiction.","Virginia Woolf, Une chambre à soi","Les conditions matérielles de l'écriture, et les obstacles faits aux femmes."],
  ["Il n'y a ni règles ni modèles.","Victor Hugo, Préface de Cromwell","Le romantisme contre les règles du théâtre classique."],
  ["Il faut que la femme s'écrive.","Hélène Cixous, Le Rire de la Méduse","Écrire, pour les femmes, c'est prendre la parole sur elles-mêmes."],
  ["Ce qui me semble beau, ce que je voudrais faire, c'est un livre sur rien.","Flaubert, Lettre à Louise Colet (1852)","Une œuvre tenue par le seul style… comme une pièce bâtie sur un « rien » chez Sarraute."],
  ["Écrire, c'est hurler sans bruit.","Marguerite Duras, Écrire","L'écriture comme cri silencieux : pense au non-dit et à la sous-conversation chez Sarraute."],
  ["Tu m'as donné ta boue et j'en ai fait de l'or.","Baudelaire, projet d'épilogue des Fleurs du mal","La poésie transforme le laid en beau."],
  ["J'écrirai pour venger ma race.","Annie Ernaux, Journal (cité dans son discours du prix Nobel)","Écrire pour son milieu social : la littérature comme revanche."],
  ["Le Poète se fait voyant par un long, immense et raisonné dérèglement de tous les sens.","Rimbaud, Lettre du voyant","Le poète qui invente une langue nouvelle pour voir autrement."],
  ["[Les tropismes sont] des mouvements indéfinissables, qui glissent très rapidement aux limites de notre conscience.","Nathalie Sarraute, préface de L'Ère du soupçon","La matière même de son œuvre, et de Pour un oui ou pour un non."],
  ["La vraie vie, la vie enfin découverte et éclaircie, […] c'est la littérature.","Proust, Le Temps retrouvé","La littérature, plus vraie que la vie : idéale pour conclure une dissertation."],
];
const RANGS=[[0,"Page blanche","Tout commence ici."],[1,"Premier chapitre","L'histoire est lancée."],[3,"Lecture assidue","Tu prends le pli !"],[7,"Plume affûtée","Une semaine d'affilée, bravo."],[14,"Grand roman","Deux semaines : quelle constance !"],[30,"Bibliothèque de Babel","Un mois entier : ta bibliothèque devient infinie."]];
const rangDe=n=>[...RANGS].reverse().find(r=>n>=r[0]);
const CATS_REV={oeuvre:["🎭","L'œuvre"],grammaire:["📌","Grammaire"],figure:["🎨","Figure de style"],quiparle:["🗣","Qui parle ?"],methode:["📐","Méthode"]};

function cleJour(d){d=d||new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function jourAvant(k,n){const [y,m,d]=k.split('-').map(Number);return cleJour(new Date(y,m-1,d-n));}
function rngDe(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function melanger(arr,rnd){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function questionsDuJour(cle){
  const rnd=rngDe('revision-'+cle);
  const lv=d=>Object.values(d).flatMap(n=>n.questions);
  const pool={
    oeuvre:lv(QUIZ_OBJETS.theatre).filter(q=>q.o),
    grammaire:lv(QUIZ_GRAM).filter(q=>q.o),
    methode:[...lv(QUIZ_METHODE),...lv(QUIZ_COMMENTAIRE),...lv(QUIZ_DISSERTATION)].filter(q=>q.o),
    figure:FIGURES.map(f=>({q:`Quelle figure de style dans : « ${f.ex} » ?`,o:[f.nom,...melanger(FIGURES.filter(x=>x.nom!==f.nom),rnd).slice(0,3).map(x=>x.nom)],r:0,ex:`${f.nom} : ${f.def} Effet : ${f.effet}`})),
    quiparle:QUI_PARLE.map(x=>({q:`Qui prononce cette réplique ? « ${x.t} »`,o:['H1','H2'],r:x.p-1,ex:x.ex})),
  };
  return ['oeuvre','figure','grammaire','quiparle','methode'].map(cat=>{
    const src=pool[cat][Math.floor(rnd()*pool[cat].length)];
    const idx=src.o.map((_,i)=>i);
    const ord=cat==='quiparle'?idx:melanger(idx,rnd);
    return {cat,q:src.q,o:ord.map(i=>src.o[i]),r:ord.indexOf(src.r),ex:src.ex};
  });
}

function lireRevision(){try{return JSON.parse(localStorage.getItem('revision_jour')||'{}');}catch(e){return {};}}
function ecrireRevision(d){try{localStorage.setItem('revision_jour',JSON.stringify(d));}catch(e){}}
function serieDe(jours,auj){
  let k=jours[auj]!==undefined?auj:jourAvant(auj,1);
  let n=0;while(jours[k]!==undefined){n++;k=jourAvant(k,1);}
  return n;
}

function Etagere({jours,auj,nb=14,taille=1}){
  const couleurs=['#6c4ce0','#ff7a59','#ffd23f','#9ee6b8','#ffb3d1','#8fc4ff','#d9ccff'];
  return(
    <div aria-label="Ton étagère : un livre par jour de révision" style={{display:'flex',alignItems:'flex-end',gap:3*taille,padding:`0 ${6*taille}px`,borderBottom:`${4*taille}px solid var(--ink)`,minHeight:62*taille}}>
      {Array.from({length:nb},(_,i)=>{
        const k=jourAvant(auj,nb-1-i);
        const fait=jours[k]!==undefined;
        const h=(38+((k.charCodeAt(9)*7+k.charCodeAt(6)*3)%20))*taille;
        return <div key={k} title={`${k}${fait?` · ${jours[k]}/5`:''}`} style={{width:13*taille,height:fait?h:h*0.55,borderRadius:`${3*taille}px ${3*taille}px 0 0`,background:fait?couleurs[(k.charCodeAt(9)+k.charCodeAt(8))%couleurs.length]:'transparent',border:fait?'2px solid var(--ink)':`2px dashed ${k===auj?'var(--ink)':'rgba(22,18,29,0.2)'}`,borderBottom:'none',position:'relative'}}>
          {fait&&<span style={{position:'absolute',left:'50%',top:'22%',width:'60%',height:2,background:'rgba(22,18,29,0.5)',transform:'translateX(-50%)'}}/>}
        </div>;

    </div>
  );
}

    </button>

function BibliothequeBac({jours,auj}){
  const couleurs=['#6c4ce0','#ff7a59','#ffd23f','#9ee6b8','#ffb3d1','#8fc4ff','#d9ccff'];

  const mois=[];
  for(let d=new Date(ay,am-1,1);d<=fin;d=new Date(d.getFullYear(),d.getMonth()+1,1)) mois.push(new Date(d));
  const total=mois.reduce((a,m)=>{const last=(m.getFullYear()===fin.getFullYear()&&m.getMonth()===fin.getMonth())?fin.getDate():new Date(m.getFullYear(),m.getMonth()+1,0).getDate();return a+last;},0);

        {mois.map(m=>{
          const y=m.getFullYear(),mo=m.getMonth();
          const dernier=(y===fin.getFullYear()&&mo===fin.getMonth())?fin.getDate():new Date(y,mo+1,0).getDate();
          return(
            <div key={`${y}-${mo}`} style={{display:'flex',alignItems:'flex-end',gap:8}}>
              <span style={{width:38,fontSize:11,fontWeight:700,textTransform:'uppercase',flexShrink:0,paddingBottom:4}}>{m.toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</span>
              <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:2,borderBottom:'4px solid #7a4a22',paddingBottom:0,minHeight:30}}>
                {Array.from({length:dernier},(_,i)=>{
                  const k=`${y}-${String(mo+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;
                  const fait=jours[k]!==undefined;
                  const futur=k>auj;
                  const hh=22+((i*7+mo*3)%9);
                  return <div key={k} title={`${i+1} ${m.toLocaleDateString('fr-FR',{month:'long'})}${fait?` · ${jours[k]}/5`:''}`}
                    style={{flex:'1 1 0',minWidth:3,maxWidth:24,height:fait?hh:hh*0.5,borderRadius:'2px 2px 0 0',
                      background:fait?couleurs[(i+mo)%couleurs.length]:'transparent',
                      border:fait?'1.5px solid var(--ink)':k===auj?'1.5px solid var(--ink)':`1px dashed ${futur?'rgba(22,18,29,0.18)':'rgba(22,18,29,0.35)'}`,borderBottom:'none'}}/>;
                })}
                {y===fin.getFullYear()&&mo===fin.getMonth()&&<span title="Le bac de français" style={{fontSize:16,marginLeft:4,lineHeight:1}}>🎓</span>}
              </div>
            </div>

      <p style={{fontSize:12,marginTop:10,color:'var(--muted)'}}>Un emplacement par jour jusqu'à l'écrit du bac ({LABEL_ECRIT}) : {total} livres possibles. Chaque révision du jour terminée en ajoute un.</p>
    </div>
  );
}

function RevisionDuJour({onBack}){
  const auj=cleJour();
  const [data,setData]=useState(lireRevision);
  const jours=data.jours||{};
  const dejaFait=jours[auj]!==undefined;
  const qs=useMemo(()=>questionsDuJour(auj),[auj]);
  const [phase,setPhase]=useState(dejaFait?'fini':'intro');
  const [i,setI]=useState(0);
  const [ans,setAns]=useState(null);
  const [score,setScore]=useState(0);
  const [bonus,setBonus]=useState(false);
  const [anim,setAnim]=useState(false);
  const n=serieDe(jours,auj);
  const rang=rangDe(n);
  const prochain=RANGS.find(r=>r[0]>n);
  const citation=CITATIONS_JOUR[Math.floor(rngDe('citation-'+auj)()*CITATIONS_JOUR.length)];
  const q=qs[i];

  const terminer=sc=>{
    if(!dejaFait&&!bonus){
      const nouvJours={...jours,[auj]:sc};
      const nd={...data,jours:nouvJours,meilleure:Math.max(data.meilleure||0,serieDe(nouvJours,auj))};
      setData(nd);ecrireRevision(nd);setAnim(true);
    }
    setPhase('fini');
  };
  const choisir=k=>{if(ans!==null)return;setAns(k);if(k===q.r)setScore(s=>s+1);};
  const suivant=()=>{if(i+1>=qs.length)terminer(score);else{setI(i+1);setAns(null);}};

  const entete=(
    <div className="b" style={{background:'var(--yellow)',marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div>
          <span className="kicker">📅 Révision du jour · {new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</span>
          <h2 style={{fontSize:'clamp(26px,4.5vw,36px)',lineHeight:1.05,margin:'10px 0 4px'}}>✒️ {n} jour{n>1?'s':''} d'affilée</h2>
          <p style={{fontSize:14.5,fontWeight:700}}>{rang[1]} <span style={{fontWeight:400}}>· {rang[2]}</span></p>
          {prochain&&<p style={{fontSize:12.5,marginTop:2}}>Encore {prochain[0]-n} jour{prochain[0]-n>1?'s':''} pour devenir « {prochain[1]} ».</p>}
          {(data.meilleure||0)>n&&<p style={{fontSize:12.5}}>Ta meilleure série : {data.meilleure} jours.</p>}
        </div>
      </div>
    </div>
  );
  const biblio=<BibliothequeBac jours={jours} auj={auj}/>;

  if(phase==='intro') return(
    <div>
      {entete}{biblio}
      <div className="b" style={{background:'var(--surface)',textAlign:'center',padding:'2rem 1.25rem'}}>
        <p style={{fontSize:15,lineHeight:1.6,maxWidth:520,margin:'0 auto'}}>Chaque jour, 5 nouvelles questions : l'œuvre, une figure de style, la grammaire, « qui parle ? » et la méthode. Termine-les pour ajouter un livre à ton étagère et débloquer la citation du jour.</p>
        <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',margin:'14px 0'}}>{qs.map((x,k)=><span key={k} className="chip">{CATS_REV[x.cat][0]} {CATS_REV[x.cat][1]}</span>)}</div>
        <button onClick={()=>setPhase('jeu')} style={{...s.btn,padding:'12px 26px',fontSize:15,background:'var(--ink)',color:'#fff'}}>C'est parti →</button>
      </div>
    </div>
  );

  if(phase==='fini'){
    const sc=bonus?score:(jours[auj]??score);
    return(
      <div>
        {anim&&<AnimLivre jours={jours} auj={auj} serie={n} score={sc} onDone={()=>setAnim(false)}/>}

        <div className="b pop" style={{background:'var(--surface)',textAlign:'center',padding:'1.75rem 1.25rem'}}>
          <p style={{fontSize:40}}>📚</p>

          <p style={{fontSize:14.5,marginTop:4}}>{bonus?"Cette partie ne change pas ta série.":"Un nouveau livre rejoint ta bibliothèque. Reviens demain pour 5 nouvelles questions !"}</p>
          <div style={{margin:'18px auto 0',maxWidth:560,padding:'16px 18px',background:'var(--lilac)',border:'2px solid var(--ink)',borderRadius:16}}>
            <span className="kicker">🔓 La citation du jour</span>
            <p style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:'clamp(18px,2.8vw,22px)',lineHeight:1.4,marginTop:10}}>« {citation[0]} »</p>
            <p style={{fontSize:13,fontWeight:600,marginTop:6}}>{citation[1]}</p>
            {citation[2]&&<p style={{fontSize:13,marginTop:8,paddingTop:8,borderTop:'1px dashed rgba(22,18,29,0.3)'}}>💡 {citation[2]}</p>}
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap',marginTop:16}}>
            <button onClick={()=>{setBonus(true);setI(0);setAns(null);setScore(0);setPhase('jeu');}} style={s.btn}>🔁 Refaire les questions</button>
            <button onClick={onBack} style={{...s.btn,background:'var(--ink)',color:'#fff'}}>← Accueil</button>
          </div>
        </div>
        <div style={{marginTop:16}}>{biblio}</div>
      </div>
    );
  }

  const ok=ans!==null&&ans===q.r;
  return(
    <div>
      {entete}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:10}}>
        <span className="chip">{CATS_REV[q.cat][0]} {CATS_REV[q.cat][1]} · {i+1}/5</span>
        <span className="chip" style={{background:'var(--mint)'}}>Score : {score}</span>
      </div>
      <div style={{display:'flex',gap:4,marginBottom:14}}>{qs.map((_,k)=><div key={k} style={{flex:1,height:10,border:'2px solid var(--ink)',borderRadius:999,background:k<i||(k===i&&ans!==null)?'var(--violet)':'#fff'}}/>)}</div>
      <div className="b" style={{background:'var(--surface)'}}>
        <p key={i} className="fade" style={{fontSize:17,fontWeight:700,lineHeight:1.45}}>{q.q}</p>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:14}}>
          {q.o.map((o,k)=>{
            let bg='#fff';
            if(ans!==null){if(k===q.r)bg='var(--mint)';else if(k===ans)bg='#ffd0c6';}
            return <button key={k} onClick={()=>choisir(k)} disabled={ans!==null} style={{textAlign:'left',padding:'11px 14px',fontSize:14.5,lineHeight:1.45,border:'2px solid var(--ink)',borderRadius:14,background:bg,boxShadow:ans===null?'2px 2px 0 var(--ink)':'none',cursor:ans===null?'pointer':'default'}}>{o}</button>;
          })}
        </div>
        {ans!==null&&(
          <div className={'fade'+(ok?'':' shake')} style={{marginTop:14,padding:'12px 14px',borderRadius:14,border:'2px solid var(--ink)',background:ok?'var(--mint)':'#ffd9d1'}}>
            <p style={{fontWeight:800}}>{ok?'✓ Bravo !':`✗ La bonne réponse : ${q.o[q.r]}`}</p>
            {q.ex&&<p style={{fontSize:14,marginTop:4,lineHeight:1.55}}>{q.ex}</p>}
            <button onClick={suivant} style={{...s.btn,marginTop:10,background:'var(--ink)',color:'#fff'}}>{i+1>=qs.length?'Terminer ✒️':'Question suivante →'}</button>
          </div>
        )}
      </div>
    </div>
  );
}

function Beckett({compact}){

      <figcaption style={{fontSize:12,color:'var(--muted)'}}>Beckett, <em>Cap au pire</em></figcaption>
    </figure>
  );
  return(
    <figure className="b span-3" style={{background:'var(--mint)',display:'flex',flexDirection:'column',justifyContent:'center'}}>
      <span aria-hidden="true" style={{fontFamily:'var(--serif)',fontSize:80,lineHeight:0.6,height:36}}>“</span>

      </blockquote>
      <figcaption style={{fontSize:13,fontWeight:600,marginTop:12}}>Samuel Beckett, <em>Cap au pire</em></figcaption>
    </figure>
  );
}
