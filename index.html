      [{t:"txt",c:"Le mouvement du classicisme s'est développé principalement"},{t:"b",sa:false,o:["au XVIème siècle","au XVIIème siècle","au XVIIIème siècle"],a:"au XVIIème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du classicisme sont"},{t:"b",sa:false,o:["Jean Racine et Nicolas Boileau","Victor Hugo et Alfred de Musset","Samuel Beckett et Eugène Ionesco"],a:"Jean Racine et Nicolas Boileau"}],
      [{t:"txt",c:"Les deux grands principes du classicisme sont"},{t:"b",sa:false,o:["convaincre et persuader","oser et agir","plaire et instruire"],a:"plaire et instruire"}],
      [{t:"txt",c:"Les principes plus précis du classicisme sont"},{t:"b",sa:false,o:["la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'importance accordée à l'individu et à la sensibilité"],a:"la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité"}],
      [{t:"txt",c:"Les auteurs classiques ont écrit"},{t:"b",sa:false,o:["des œuvres dans tous les genres","uniquement des pièces de théâtre","uniquement de la poésie"],a:"des œuvres dans tous les genres"}],
      [{t:"txt",c:"Un peintre classique porte le nom de"},{t:"b",sa:false,o:["le Caravage","Nicolas Poussin","Caspar David Friedrich"],a:"Nicolas Poussin"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Les dates du classicisme correspondent à peu près aux dates du règne du roi"},{t:"b",sa:true,o:["Louis XIV"],a:"Louis XIV"},{t:"txt",c:"qui régna de la deuxième moitié du"},{t:"b",sa:true,o:["XVII"],a:"XVII"},{t:"txt",c:"ème siècle à l'année"},{t:"b",sa:true,o:["1715"],a:"1715"},{t:"txt",c:"."}],
      [{t:"txt",c:"L’esthétique classique servira l’image de puissance et d’autorité soit en pleine monarchie"},{t:"b",sa:false,o:["constitutionnelle","absolue"],a:"absolue"},{t:"txt",c:"avec un pouvoir centralisé qui cherche à imposer l'ordre et son autorité."}],
      [{t:"txt",c:"La centralisation monarchique dépasse le cadre politique pour toucher le domaine culturel."}],
      [{t:"txt",c:"« La querelle des Anciens et des"},{t:"b",sa:true,o:["Modernes"],a:"Modernes"},{t:"txt",c:"», à partir de 1687, préfigure la fin de ce courant."}],
    ]},
    {h:"LES GRANDS PRINCIPES DU CLASSICISME",parts:[
      [{t:"txt",c:"Comme les écrivains de la Renaissance, les classiques se donnent pour modèles, les auteurs"},{t:"b",sa:true,o:["grecs"],a:"grecs"},{t:"txt",c:"et"},{t:"b",sa:true,o:["latins"],a:"latins"},{t:"txt",c:"comme Esope et Phèdre par exemple pour les fables."}],
      [{t:"txt",c:"L'imitation n’est pas un plagiat : il s’agit de s’inspirer d’un auteur antique connu pour atteindre l'universel."}],
      [{t:"txt",c:"Le mouvement classique voue un véritable culte à la raison."}],
      [{t:"txt",c:"Sous l’autorité de la raison, s’érige un système très strict de règles dans chaque genre respectant la recherche de la clarté, de la logique et de la vraisemblance."}],
      [{t:"txt",c:"Au théâtre la règle des trois"},{t:"b",sa:true,o:["unités"],a:"unités"},{t:"txt",c:"est primordiale."}],
      [{t:"txt",c:"La règle de"},{t:"b",sa:true,o:["vraisemblance"],a:"vraisemblance"},{t:"txt",c:"rend compte du souci classique de rendre compte du réel et la règle de"},{t:"b",sa:true,o:["bienséance"],a:"bienséance"},{t:"txt",c:"révèle la volonté classique de ne pas choquer le lecteur ou le spectateur."}],
      [{t:"txt",c:"Le souci de clarté se traduit en littérature, par le recours à un langage simple et précis, principe résumé par Nicolas"},{t:"b",sa:true,o:["Boileau"],a:"Boileau"},{t:"txt",c:"dans son Art poétique : « Ce qui se conçoit bien s’énonce clairement / Et les mots pour le dire viennent aisément. »"}],
      [{t:"txt",c:"Les productions classiques se donnent pour finalité d'élever les hommes."}],
      [{t:"txt",c:"L'"},{t:"b",sa:true,o:["honnête"],a:"honnête"},{t:"txt",c:"homme incarne la perfection classique de mesure et d'élégance."}],
    ]},
    {h:"LES GRANDS AUTEURS CLASSIQUES",parts:[
      [{t:"txt",c:"Dans ses célèbres fables, Jean de La Fontaine s'inspire du fabuliste grec"},{t:"b",sa:true,o:["Esope"],a:"Esope"},{t:"txt",c:"et du fabuliste latin"},{t:"b",sa:true,o:["Phèdre"],a:"Phèdre"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur des Caractères s'appelle Jean"},{t:"b",sa:true,o:["La Bruyère"],a:"La Bruyère"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur de La Princesse de Clèves s'appelle Mme de"},{t:"b",sa:true,o:["La Fayette"],a:"La Fayette"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur de Phèdre et de Britannicus s'appelle Jean"},{t:"b",sa:true,o:["Racine"],a:"Racine"},{t:"txt",c:"."}],
      [{t:"txt",c:"Le plus célèbre auteur de comédies classiques est"},{t:"b",sa:true,o:["Molière"],a:"Molière"},{t:"txt",c:"."}],
      [{t:"txt",c:"Un moyen mnémotechnique pour retenir le nom des grands auteurs classiques :"}],
      [{t:"txt",c:"« Sur la racine de la bruyère, la corneille boit l’eau de la fontaine Molière »"}],
    ]},
  ]},
  {key:"LUMIERES",label:"Lumières",periode:"XVIIIe siècle",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LES LUMIERES"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mouvement des Lumières s'appelle ainsi car il souhaite"},{t:"b",sa:false,o:["éclairer le peuple et le sortir de l'obscurantisme","mettre le roi en valeur","faire la lumière sur les textes antiques"],a:"éclairer le peuple et le sortir de l'obscurantisme"}],
      [{t:"txt",c:"Le mouvement des Lumières s'est développé principalement"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au XIXème siècle"],a:"au XVIIIème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques des Lumières sont"},{t:"b",sa:false,o:["Racine et Boileau","Victor Hugo et Alfred de Musset","Voltaire et Diderot"],a:"Voltaire et Diderot"}],
      [{t:"txt",c:"Les grands principes du mouvement des Lumières sont"},{t:"b",sa:false,o:["la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'importance accordée à l'individu et à la sensibilité"],a:"la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté"}],
      [{t:"txt",c:"Les auteurs des Lumières ont principalement écrit"},{t:"b",sa:false,o:["de la poésie","des romans","des essais, des discours et des contes philosophiques"],a:"des essais, des discours et des contes philosophiques"}],
      [{t:"txt",c:"Les auteurs ayant présidé à la rédaction de l'Encyclopédie, œuvre phare des Lumières, sont"},{t:"b",sa:false,o:["Rousseau et l'abbé Prévost","Choderlos de Laclos et Olympe de Gouges","Diderot et d'Alembert"],a:"Diderot et d'Alembert"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Les Lumières sont un vaste mouvement philosophique, littéraire et scientifique qui domine le monde des idées en Europe au XVIIIème siècle."}],
      [{t:"txt",c:"La mort du roi"},{t:"b",sa:true,o:["Louis XIV"],a:"Louis XIV"},{t:"txt",c:"en 1715 fait souffler un vent de liberté sur la France. La vie intellectuelle se libère et se diffuse dans les Cafés et les"},{t:"b",sa:true,o:["Salons"],a:"Salons"},{t:"txt",c:"lieux où se réunissent les lettrés. Les conversations trouvent un écho dans la littérature dans les dialogues philosophiques comme le Neveu de"},{t:"b",sa:true,o:["Rameau"],a:"Rameau"},{t:"txt",c:"de Denis Diderot."}],
      [{t:"txt",c:"Le livre se diffuse et apparaît le premier quotidien français appelé le Journal de"},{t:"b",sa:true,o:["Paris"],a:"Paris"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les auteurs des Lumières sont impliqués dans les affaires politiques et sociales de leur temps : ce sont des auteurs engagés. On peut citer par exemple l'implication de Voltaire dans l'affaire Jean"},{t:"b",sa:true,o:["Calas"],a:"Calas"},{t:"txt",c:"."}],
    ]},
    {h:"LES PRINCIPES DES LUMIERES",parts:[
      [{t:"txt",c:"La devise en latin des Lumières proposée par Emmanuel Kant dans son célèbre Qu'est-ce que les Lumières est la formule latine \"sapere"},{t:"b",sa:true,o:["aude"],a:"aude"},{t:"txt",c:", \"aie le courage de te servir de ton propre entendement\" ou \"ose savoir\"."}],
      [{t:"txt",c:"Le grand combat des Lumières est résumé en ces termes de Voltaire : \"écrasez"},{t:"b",sa:true,o:["l'infâme"],a:"l'infâme"},{t:"txt",c:"\". Il s'agit de lutter contre le fanatisme, l'ignorance, les préjugés, le dogme religieux et tous les ennemis de la raison."}],
      [{t:"txt",c:"Les Lumières luttent contre la superstition et le fanatisme religieux. Certains auteurs, comme Diderot, sont même athées voire anticléricaux. Voltaire quant à lui croit en un être supérieur mais rejette les rites religieux : il est"},{t:"b",sa:true,o:["déiste"],a:"déiste"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les auteurs des Lumières rejettent la monarchie absolue et prônent au contraire, pour certains, un nouveau modèle dirigé par un \"despote"},{t:"b",sa:true,o:["éclairé"],a:"éclairé"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les auteurs des Lumières s'engagent enfin sur des questions de société, notamment contre l'esclavage comme dans De l'esclavage des nègres de"},{t:"b",sa:true,o:["Montesquieu"],a:"Montesquieu"},{t:"txt",c:"."}],
      [{t:"txt",c:"Comme Montaigne et les auteurs du mouvement"},{t:"b",sa:true,o:["humaniste"],a:"humaniste"},{t:"txt",c:"deux siècles avant eux, les auteurs des Lumières ont foi en l'homme et en l'humanité."}],
      [{t:"txt",c:"Ils utilisent par ailleurs des formes originales pour diffuser le savoir comme les dictionnaires ou l'"},{t:"b",sa:true,o:["Encyclopédie"],a:"Encyclopédie"},{t:"txt",c:"grande oeuvre collaborative des Lumières ou encore des contes"},{t:"b",sa:true,o:["philosophiques"],a:"philosophiques"},{t:"txt",c:"comme Candide de Voltaire."}],
    ]},
    {h:"LES GRANDS AUTEURS DES LUMIERES",parts:[
      [{t:"txt",c:"L'auteur du Dictionnaire philosophique, de Candide et du Traité sur la tolérance est"},{t:"b",sa:true,o:["Voltaire"],a:"Voltaire"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur de De l'Esprit des"},{t:"b",sa:true,o:["lois"],a:"lois"},{t:"txt",c:"et des Lettres"},{t:"b",sa:true,o:["persanes"],a:"persanes"},{t:"txt",c:"est Montesquieu."}],
      [{t:"txt",c:"L'auteur du Discours sur l'origine de l'inégalité parmi les hommes est Jean-Jacques"},{t:"b",sa:true,o:["Rousseau"],a:"Rousseau"}],
    ]},
  ]},
  {key:"ROMANTISME",label:"Romantisme",periode:"1ère moitié XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE ROMANTISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mot « romantisme » vient"},{t:"b",sa:false,o:["de l'ancien français « roman » qui signifie « en langue vulgaire »","du mot grec « romanos » qui signifie « inconnu »","d'une langue inconnue"],a:"de l'ancien français « roman » qui signifie « en langue vulgaire »"}],
      [{t:"txt",c:"Le mouvement du romantisme s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au XIXème siècle"],a:"au XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du romantisme sont"},{t:"b",sa:false,o:["Racine et Boileau","Victor Hugo et Alfred de Musset","Samuel Beckett et Eugène Ionesco"],a:"Victor Hugo et Alfred de Musset"}],
      [{t:"txt",c:"Le romantisme est en rupture avec"},{t:"b",sa:false,o:["les règles, le goût et le Beau classiques","la volonté de mettre le moi au centre","le goût pour la nature"],a:"les règles, le goût et le Beau classiques"}],
      [{t:"txt",c:"Les grands principes du romantisme sont"},{t:"b",sa:false,o:["la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté","l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité"],a:"l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme"}],
      [{t:"txt",c:"Les auteurs romantiques ont écrit"},{t:"b",sa:false,o:["des œuvres dans tous les genres","uniquement des romans","uniquement des pièces de théâtre"],a:"des œuvres dans tous les genres"}],
      [{t:"txt",c:"Un compositeur romantique porte le nom de"},{t:"b",sa:false,o:["Monteverdi","Mozart","Chopin"],a:"Chopin"}],
      [{t:"txt",c:"Un peintre romantique porte le nom de"},{t:"b",sa:false,o:["Nicolas Poussin","René Magritte","Caspar David Friedrich"],a:"Caspar David Friedrich"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Mouvement littéraire et culturel de la première moitié du"},{t:"b",sa:true,o:["XIX"],a:"XIX"},{t:"txt",c:"ème siècle, le romantisme exalte l'imagination, les émotions et la sensibilité mais il apparaît dès le XVIIIème siècle en Allemagne. Goethe et les artistes du Sturm und Drang célèbrent notamment l'accord entre l'homme et la"},{t:"b",sa:false,o:["culture","science","nature"],a:"nature"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les artistes romantiques français sont pris entre espoirs et désenchantements face aux mutations politiques. Ils n'hésitent pas à s'engager dans l'histoire pour défendre leurs idéaux et occupent même des fonctions"},{t:"b",sa:true,o:["politiques"],a:"politiques"},{t:"txt",c:". Lamartine a été élu député par exemple."}],
    ]},
    {h:"LES GRANDS PRINCIPES DU ROMANTISME",parts:[
      [{t:"txt",c:"Le romantisme est avant tout une réaction contre le mouvement"},{t:"b",sa:true,o:["classique"],a:"classique"},{t:"txt",c:"du XVIIème siècle qui privilégie la raison ainsi que la mesure et refuse les épanchements lyriques."}],
      [{t:"txt",c:"Une attention particulière est portée au Moi et à ses états d'âme."}],
      [{t:"txt",c:"De nombreux auteurs romantiques sont touchés par une tristesse si emblématique qu'on l'appelle \"Mal du"},{t:"b",sa:true,o:["siècle"],a:"siècle"},{t:"txt",c:"\"."}],
      [{t:"txt",c:"Les thèmes phares du romantisme sont l'amour, le goût pour la nature, l'Orient et la tentation de l'Ailleurs, le culte du passé, la rêverie, la solitude et la mélancolie, l'homme éphémère face à la nature éternelle, la révolte et la société, le poète investi d'une mission politique et sociale."}],
      [{t:"txt",c:"En poésie, les poètes privilégient le registre"},{t:"b",sa:true,o:["lyrique"],a:"lyrique"},{t:"txt",c:"c'est-à-dire l'expression des sentiments et le registre"},{t:"b",sa:true,o:["élégiaque"],a:"élégiaque"},{t:"txt",c:"c'est-à-dire l'expression de la plainte. Mais les poètes romantiques peuvent également écrire des poèmes épiques et des pamphlets."}],
      [{t:"txt",c:"Victor Hugo théorise le"},{t:"b",sa:true,o:["drame"],a:"drame"},{t:"txt",c:"romantique qui remet en cause les règles du théâtre"},{t:"b",sa:true,o:["classique"],a:"classique"},{t:"txt",c:"et refuse la séparation des genres pour privilégier l'expression des sentiments souvent exaltés."}],
      [{t:"txt",c:"Le roman est lui aussi très prisé des auteurs romantiques."}],
    ]},
    {h:"LES GRANDS AUTEURS ROMANTIQUES",parts:[
      [{t:"txt",c:"L'auteur des Misérables, des Châtiments et de la Préface de Cromwell s'appelle Victor"},{t:"b",sa:true,o:["Hugo"],a:"Hugo"}],
      [{t:"txt",c:"L'auteur des Méditations poétiques est Alphonse de"},{t:"b",sa:true,o:["Lamartine"],a:"Lamartine"},{t:"txt",c:", l'un des fondateurs du romantisme."}],
      [{t:"txt",c:"L'auteur de Lorenzaccio et des Confessions d'un enfant du siècle est Alfred de"},{t:"b",sa:true,o:["Musset"],a:"Musset"},{t:"txt",c:"."}],
    ]},
  ]},
  {key:"PARNASSE",label:"Parnasse",periode:"milieu XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE PARNASSE"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mot «Parnasse » vient"},{t:"b",sa:false,o:["d'une nymphe grecque","du nom d'un massif montagneux consacré à Apollon et aux Muses","d'un quartier de Paris"],a:"du nom d'un massif montagneux consacré à Apollon et aux Muses"}],
      [{t:"txt",c:"Le mouvement du Parnasse s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au milieu du XIXème siècle"],a:"au milieu du XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du Parnasse sont"},{t:"b",sa:false,o:["Leconte de Lisle et Théophile Gautier","Rimbaud et Mallarmé","Samuel Beckett et Eugène Ionesco"],a:"Leconte de Lisle et Théophile Gautier"}],
      [{t:"txt",c:"Le Parnasse est né"},{t:"b",sa:false,o:["dans le prolongement des Lumières","dans le prolongement du naturalisme","en réaction contre la poésie romantique"],a:"en réaction contre la poésie romantique"}],
      [{t:"txt",c:"Les grands thèmes du Parnasse sont"},{t:"b",sa:false,o:["l'instabilité, l'apparence, l'illusion, le mouvement, le bizarre, l'eau en mouvement, le miroir","la beauté froide des bijoux et l'Antiquité","l'étude des mœurs, l'influence du milieu sur l'individu, la société"],a:"la beauté froide des bijoux et l'Antiquité"}],
      [{t:"txt",c:"Les grands principes du Parnasse sont"},{t:"b",sa:false,o:["l'étude des mœurs, l'influence du milieu sur l'individu, la société","l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme","le refus de la sensibilité, le goût pour la description dans la poésie et l'Art pour l'Art"],a:"le refus de la sensibilité, le goût pour la description dans la poésie et l'Art pour l'Art"}],
      [{t:"txt",c:"Les auteurs du Parnasse ont principalement écrit"},{t:"b",sa:false,o:["des essais","des pièces de théâtre","de la poésie"],a:"de la poésie"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le Parnasse est apparu en réaction contre les effusions du grand mouvement poétique du début du XIXème siècle, le"},{t:"b",sa:true,o:["romantisme"],a:"romantisme"},{t:"txt",c:". La poésie du début du XIXème siècle est en effet jugée trop éloquente et sentimentale par les poètes du Parnasse."}],
    ]},
    {h:"LES GRANDS PRINCIPES DU PARNASSE",parts:[
      [{t:"txt",c:"L'autre nom du Parnasse est l'Art pour"},{t:"b",sa:true,o:["l'Art"],a:"l'Art"},{t:"txt",c:"."}],
      [{t:"txt",c:"Ce mouvement a été théorisé par Théophile Gautier dans la préface de son roman Mademoiselle"},{t:"b",sa:true,o:["Maupin"],a:"Maupin"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les poètes du Parnasse récusent par ailleurs la mission civilisatrice et prophétique attribuée au poète par Victor"},{t:"b",sa:true,o:["Hugo"],a:"Hugo"},{t:"txt",c:"dans \"Fonction du poète\". L'art doit se dégager des contingences matérielles et traiter uniquement de la beauté. Le Parnasse refuse une poésie utile car comme le dit Théophile Gautier : \"tout ce qui est utile est"},{t:"b",sa:true,o:["laid"],a:"laid"},{t:"txt",c:"\". La poésie parnassienne est un véritable travail d'orfèvre. La valeur travail est valorisée au détriment de l'inspiration."}],
      [{t:"txt",c:"Selon les Parnassiens, leur poésie est réservée à des initiés qui constituent une sorte d'élite."}],
    ]},
    {h:"LES AUTEURS DU PARNASSE",parts:[
      [{t:"txt",c:"Le recueil Poèmes"},{t:"b",sa:true,o:["barbares"],a:"barbares"},{t:"txt",c:"a été écrit par Leconte de Lisle."}],
      [{t:"txt",c:"Le recueil Emaux et"},{t:"b",sa:true,o:["camées"],a:"camées"},{t:"txt",c:"a été écrit par Théophile Gautier."}],
    ]},
  ]},
  {key:"REALISME",label:"Réalisme",periode:"milieu XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE REALISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mouvement du réalisme s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au milieu du XIXème siècle"],a:"au milieu du XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du réalisme sont"},{t:"b",sa:false,o:["Leconte de Lisle et Théophile Gautier","Rimbaud et Mallarmé","Balzac et Flaubert"],a:"Balzac et Flaubert"}],
      [{t:"txt",c:"Le réalisme est né"},{t:"b",sa:false,o:["dans le prolongement des Lumières","en réaction contre le lyrisme et l'idéalisation romantique","dans le prolongement du naturalisme"],a:"en réaction contre le lyrisme et l'idéalisation romantique"}],
      [{t:"txt",c:"Les grands thèmes du réalisme sont"},{t:"b",sa:false,o:["l'étude des mœurs, l'influence du milieu sur l'individu, la société","l'instabilité, l'apparence, l'illusion, le mouvement, le bizarre, l'eau en mouvement, le miroir","la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté"],a:"l'étude des mœurs, l'influence du milieu sur l'individu, la société"}],
      [{t:"txt",c:"Les grands principes du réalisme sont"},{t:"b",sa:false,o:["le refus de la sensibilité, le goût pour la description dans la poésie et l'Art pour l'Art","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'observation et la reproduction fidèle du réel"],a:"l'observation et la reproduction fidèle du réel"}],
      [{t:"txt",c:"Les auteurs du réalisme ont principalement écrit"},{t:"b",sa:false,o:["des romans et des nouvelles","des pièces de théâtre","de la poésie"],a:"des romans et des nouvelles"}],
      [{t:"txt",c:"Un peintre réaliste porte le nom de"},{t:"b",sa:false,o:["Nicolas Poussin","Arnold Böcklin","Gustave Courbet"],a:"Gustave Courbet"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le réalisme apparaît après la désillusion de la révolution de l'année"},{t:"b",sa:true,o:["1848"],a:"1848"},{t:"txt",c:": la bourgeoisie, classe dominante se soucie de ses seuls intérêts."}],
      [{t:"txt",c:"La révolution"},{t:"b",sa:true,o:["industrielle"],a:"industrielle"},{t:"txt",c:"crée des emplois en ville et crée un exode rural."}],
      [{t:"txt",c:"La foi en le progrès se répand et la science est perçue comme la solution à tous les problèmes."}],
      [{t:"txt",c:"La philosophie positiviste d'Auguste"},{t:"b",sa:true,o:["Comte"],a:"Comte"},{t:"txt",c:"est en plein essor."}],
      [{t:"txt",c:"Dans ce contexte positiviste, le réalisme naît aussi en réaction contre le mouvement"},{t:"b",sa:true,o:["romantique"],a:"romantique"},{t:"txt",c:"et ses épanchements lyriques."}],
    ]},
    {h:"LES GRANDS PRINCIPES",parts:[
      [{t:"txt",c:"Le mot \"réalisme\" apparaît en 1850 et a été utilisé en premier pour caractériser la manière de peindre de Gustave Courbet notamment dans son tableau Enterrement à"},{t:"b",sa:true,o:["Ornans"],a:"Ornans"},{t:"txt",c:"."}],
      [{t:"txt",c:"Il s'agit de dire le réel au plus près en proposant des descriptions précises et en rejetant les intrigues trop romanesques. L'observation du monde contemporain est un moteur important de la création chez les réalistes qui réunissent souvent une abondante documentation."}],
      [{t:"txt",c:"Les romans et les nouvelles réalistes traitent de la banalité de la vie, accordent une grande importance au corps et refusent la bienséance comme en témoigne le procès intenté à Flaubert pour son roman Madame"},{t:"b",sa:true,o:["Bovary"],a:"Bovary"}],
      [{t:"txt",c:"De nouvelles classes sociales deviennent des personnages à part entière : la bourgeoisie et le monde ouvrier."}],
      [{t:"txt",c:"Les personnages ne sont plus idéalisés et sont bien loin d'être héroïques : on passe de personnages extraordinaires à des personnages de la vie"},{t:"b",sa:true,o:["quotidienne"],a:"quotidienne"}],
    ]},
    {h:"LES GRANDS AUTEURS REALISTES",parts:[
      [{t:"txt",c:"L'auteur d'une vaste oeuvre romanesque appelée La Comédie humaine s'appelle Honoré de"},{t:"b",sa:true,o:["Balzac"],a:"Balzac"}],
      [{t:"txt",c:"L'auteur de La Chartreuse de Parme et du roman Le Rouge et le Noir s'appelle"},{t:"b",sa:true,o:["Stendhal"],a:"Stendhal"}],
      [{t:"txt",c:"L'auteur de l'Education sentimentale s'appelle Gustave"},{t:"b",sa:true,o:["Flaubert"],a:"Flaubert"}],
    ]},
  ]},
  {key:"NATURALISME",label:"Naturalisme",periode:"fin XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE NATURALISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mouvement du naturalisme s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","à la fin du XIXème siècle"],a:"à la fin du XIXème siècle"}],
      [{t:"txt",c:"Le mot « naturalisme » signifie initialement"},{t:"b",sa:false,o:["qui prône le retour à la nature","qui étudie l'histoire et les sciences naturelles","qui s'oppose à la culture"],a:"qui étudie l'histoire et les sciences naturelles"}],
      [{t:"txt",c:"Deux auteurs emblématiques du naturalisme sont"},{t:"b",sa:false,o:["Leconte de Lisle et Théophile Gautier","Rimbaud et Mallarmé","Zola et les frères Goncourt"],a:"Zola et les frères Goncourt"}],
      [{t:"txt",c:"Le naturalisme est né"},{t:"b",sa:false,o:["dans le prolongement des Lumières","dans le prolongement des règles classiques","dans le prolongement du réalisme"],a:"dans le prolongement du réalisme"}],
      [{t:"txt",c:"Les grands thèmes du naturalisme sont"},{t:"b",sa:false,o:["l'instabilité, l'apparence, l'illusion, le mouvement, le bizarre, l'eau en mouvement, le miroir","la beauté froide des bijoux, l'Antiquité et l'archéologie","l'étude de l'hérédité et du milieu, le monde du travail et la Révolution industrielle"],a:"l'étude de l'hérédité et du milieu, le monde du travail et la Révolution industrielle"}],
      [{t:"txt",c:"Les grands principes du naturalisme sont"},{t:"b",sa:false,o:["l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'approfondissement du réalisme et l'influence des sciences expérimentales et de la médecine"],a:"l'approfondissement du réalisme et l'influence des sciences expérimentales et de la médecine"}],
      [{t:"txt",c:"Les auteurs du naturalisme ont principalement écrit"},{t:"b",sa:false,o:["des romans et des nouvelles","des pièces de théâtre","de la poésie"],a:"des romans et des nouvelles"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le naturalisme apparaît après le réalisme qui fait lui-même suite à la désillusion de la révolution de l'année"},{t:"b",sa:true,o:["1848"],a:"1848"},{t:"txt",c:": la bourgeoisie, classe dominante, se soucie de ses seuls intérêts."}],
      [{t:"txt",c:"La révolution"},{t:"b",sa:true,o:["industrielle"],a:"industrielle"},{t:"txt",c:"crée des emplois en ville et crée un exode rural."}],
      [{t:"txt",c:"La foi en le progrès se répand et la science est perçue comme la solution à tous les problèmes."}],
      [{t:"txt",c:"La philosophie positiviste d'Auguste"},{t:"b",sa:true,o:["Comte"],a:"Comte"},{t:"txt",c:"est en plein essor."}],
      [{t:"txt",c:"Dans ce contexte positiviste, le naturalisme s'inscrit dans la droite lignée du mouvement"},{t:"b",sa:true,o:["réaliste"],a:"réaliste"},{t:"txt",c:"apparu lui aussi au XIXème siècle."}],
    ]},
    {h:"LES GRANDS PRINCIPES",parts:[
      [{t:"txt",c:"Comme dans le mouvement réaliste, il s'agit pour les auteurs naturalistes de dire le réel au plus près en proposant des descriptions précises et en rejetant les intrigues trop romanesques. L'observation du monde contemporain est un moteur important de la création chez les naturalistes qui réunissent souvent une abondante documentation."}],
      [{t:"txt",c:"Emile Zola utilise pour la première fois le terme \"naturaliste\" en 1866 après avoir lu l’Introduction à l’étude de la médecine expérimentale du physiologiste Claude"},{t:"b",sa:true,o:["Bernard"],a:"Bernard"},{t:"txt",c:"."}],
      [{t:"txt",c:"Emile Zola prend comme modèle d'écriture la méthode"},{t:"b",sa:false,o:["abstraite","scientifique"],a:"scientifique"}],
      [{t:"txt",c:"Dans ses ouvrages, Zola s’attache à montrer « scientifiquement » les effets du"},{t:"b",sa:false,o:["potentiel","déterminisme"],a:"déterminisme"},{t:"txt",c:"biologique (l’hérédité de l’alcoolisme, entre autres) sur le comportement de ses héros."}],
      [{t:"txt",c:"De nouvelles classes sociales deviennent des personnages à part entière : la bourgeoisie et le monde"},{t:"b",sa:false,o:["artistique","ouvrier"],a:"ouvrier"},{t:"txt",c:". Le naturalisme s’attache à peindre les milieux populaires. ( Les ouvriers chez Zola ou les paysans normands chez Maupassant)."}],
    ]},
    {h:"LES GRANDS AUTEURS NATURALISTES",parts:[
      [{t:"txt",c:"Emile Zola écrit un cycle de vingt romans, Les Rougon-"},{t:"b",sa:true,o:["Macquart"],a:"Macquart"},{t:"txt",c:", Histoire naturelle et sociale d’une famille sous le second Empire."}],
      [{t:"txt",c:"Réunis autour de Zola, les auteurs naturalistes publient un recueil de nouvelles naturalistes qui servent de manifeste au mouvement : Les soirées de"},{t:"b",sa:true,o:["Médan"],a:"Médan"},{t:"txt",c:"(1880)"}],
      [{t:"txt",c:"Les frères"},{t:"b",sa:true,o:["Goncourt"],a:"Goncourt"},{t:"txt",c:", qui ont donné leur nom à un célèbre prix littéraire, publient quant à eux par exemple Germinie Lacerteux."}],
    ]},
  ]},
  {key:"SYMBOLISME",label:"Symbolisme",periode:"fin XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE SYMBOLISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mot « symbolisme » vient"},{t:"b",sa:false,o:["du mot grec « symbolon » qui signifie « signe de reconnaissance »","d'une langue inconnue","de l'anglais « symbolize » signifiant « symboliser »"],a:"du mot grec « symbolon » qui signifie « signe de reconnaissance »"}],
      [{t:"txt",c:"Le mouvement du symbolisme s'est développé"},{t:"b",sa:false,o:["au XVIème siècle","au début du XIXème siècle","à la fin du XIXème siècle"],a:"à la fin du XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du symbolisme sont"},{t:"b",sa:false,o:["Rimbaud et Mallarmé","Leconte de Lisle et Théophile Gautier","Victor Hugo et Alfred de Musset"],a:"Rimbaud et Mallarmé"}],
      [{t:"txt",c:"Le symbolisme est né"},{t:"b",sa:false,o:["en réaction contre la poésie baudelairienne","dans le prolongement de la poésie de Baudelaire et en réaction contre le naturalisme","dans le prolongement des règles classiques"],a:"dans le prolongement de la poésie de Baudelaire et en réaction contre le naturalisme"}],
      [{t:"txt",c:"Les grands thèmes du symbolisme sont"},{t:"b",sa:false,o:["la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté","l'étude des mœurs, l'influence du milieu sur l'individu, la société","la mythologie, les mondes cachés et les correspondances"],a:"la mythologie, les mondes cachés et les correspondances"}],
      [{t:"txt",c:"Les auteurs symbolistes ont principalement écrit"},{t:"b",sa:false,o:["des essais","des romans","de la poésie"],a:"de la poésie"}],
      [{t:"txt",c:"Un compositeur symboliste porte le nom de"},{t:"b",sa:false,o:["Monteverdi","Debussy","Dusapin"],a:"Debussy"}],
      [{t:"txt",c:"Un peintre symboliste porte le nom de"},{t:"b",sa:false,o:["Nicolas Poussin","Salvador Dali","Arnold Böcklin"],a:"Arnold Böcklin"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le symbolisme apparaît en pleine émergence du positivisme, mouvement initié par Auguste"},{t:"b",sa:true,o:["Comte"],a:"Comte"},{t:"txt",c:"qui naît avec le triomphe des sciences et des techniques. Le symbolisme s'y oppose et privilégie la sensibilité et l'irrationnel."}],
      [{t:"txt",c:"Le terme \"symbolisme\" est utilisé pour la première fois dans Le Manifeste littéraire de Jean"},{t:"b",sa:true,o:["Moréas"],a:"Moréas"},{t:"txt",c:"qui considère l'auteur des Fleurs du Mal, Charles"},{t:"b",sa:true,o:["Baudelaire"],a:"Baudelaire"},{t:"txt",c:"comme le précurseur de ce mouvement."}],
      [{t:"txt",c:"Le poète Stéphane"},{t:"b",sa:true,o:["Mallarmé"],a:"Mallarmé"},{t:"txt",c:"fera figure de chef de file du symbolisme."}],
    ]},
    {h:"LES PRINCIPES DU SYMBOLISME",parts:[
      [{t:"txt",c:"Le symbolisme rejette la vision matérialiste du monde, le naturalisme et la poésie parnassienne."}],
      [{t:"txt",c:"L'écrivain et le poète sont investis d'une mission sacrée comme l'indique Arthur Rimbaud dans sa célèbre Lettre du"},{t:"b",sa:true,o:["voyant"],a:"voyant"}],
      [{t:"txt",c:"Pour le symbolisme, il est possible d'associer un être ou un objet à une idée. Les figures de l'analogie qui opèrent des rapprochements comme la comparaison et la"},{t:"b",sa:true,o:["métaphore"],a:"métaphore"},{t:"txt",c:"sont des figures fondamentales dans ce mouvement."}],
      [{t:"txt",c:"Le symbolisme présuppose une adéquation entre le monde matériel et le monde spirituel : on parle de"},{t:"b",sa:true,o:["correspondances"],a:"correspondances"},{t:"txt",c:", terme qui est d'ailleurs le titre d'un poème de Charles Baudelaire."}],
      [{t:"txt",c:"Le symbolisme joue beaucoup sur la suggestion comme l'indique le poète Stéphane Mallarmé : \"Nommer un objet, c'est supprimer les trois quarts de la jouissance du poème qui est faite de deviner peu à peu ; le"},{t:"b",sa:true,o:["suggérer"],a:"suggérer"},{t:"txt",c:", voilà le rêve.\""}],
      [{t:"txt",c:"La musicalité du poème est primordiale comme l'indique Paul Verlaine dans la phrase : \"De la"},{t:"b",sa:true,o:["musique"],a:"musique"},{t:"txt",c:"avant toute chose\"."}],
    ]},
    {h:"LES AUTEURS SYMBOLISTES",parts:[
      [{t:"txt",c:"L'auteur d'Un coup de dés est Stéphane"},{t:"b",sa:true,o:["Mallarmé"],a:"Mallarmé"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur des Fêtes galantes et des Poèmes saturniens est Paul"},{t:"b",sa:true,o:["Verlaine"],a:"Verlaine"}],
    ]},
  ]},
  {key:"SURREALISME",label:"Surréalisme",periode:"début XXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE SURREALISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mot « surréalisme » apparaît pour la première fois"},{t:"b",sa:false,o:["dans un texte du poète Guillaume Apollinaire en 1917","dans un texte d'André Breton, figure de proue du surréalisme","dans un texte de Victor Hugo"],a:"dans un texte du poète Guillaume Apollinaire en 1917"}],
      [{t:"txt",c:"Le mouvement surréaliste s'est développé"},{t:"b",sa:false,o:["à la fin du XIXème siècle","dans les premières années du XXème siècle","de la fin de la Première Guerre mondiale à la deuxième moitié du XXème siècle"],a:"de la fin de la Première Guerre mondiale à la deuxième moitié du XXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du surréalisme sont"},{t:"b",sa:false,o:["Rimbaud et Mallarmé","René Char et Yves Bonnefoy","André Breton et Robert Desnos"],a:"André Breton et Robert Desnos"}],
      [{t:"txt",c:"Le surréalisme est né"},{t:"b",sa:false,o:["en réaction contre le dadaïsme","au lendemain de la Première Guerre mondiale dans le prolongement du dadaïsme","dans le prolongement du naturalisme"],a:"au lendemain de la Première Guerre mondiale dans le prolongement du dadaïsme"}],
      [{t:"txt",c:"Les grands principes du surréalisme sont"},{t:"b",sa:false,o:["la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'approfondissement du réalisme et l'influence des sciences expérimentales et de la médecine","l'importance du hasard et de l'insolite, le refus des règles et de la rationalité"],a:"l'importance du hasard et de l'insolite, le refus des règles et de la rationalité"}],
      [{t:"txt",c:"Les grands thèmes du surréalisme sont"},{t:"b",sa:false,o:["l'instabilité, l'apparence, l'illusion, le mouvement, le bizarre, l'eau en mouvement, le miroir","l'amour fou, la magie, le rêve et l'inconscient","l'étude des mœurs, l'influence du milieu sur l'individu, la société"],a:"l'amour fou, la magie, le rêve et l'inconscient"}],
      [{t:"txt",c:"Un peintre surréaliste porte le nom de"},{t:"b",sa:false,o:["Nicolas Poussin","Arnold Böcklin","René Magritte"],a:"René Magritte"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le mouvement surréaliste se développe au lendemain de la"},{t:"b",sa:true,o:["Première"],a:"Première"},{t:"txt",c:"Guerre mondiale. Ce mouvement succède au"},{t:"b",sa:true,o:["dadaïsme"],a:"dadaïsme"},{t:"txt",c:"de Tristan Tzara."}],
    ]},
    {h:"LES PRINCIPES DU SURREALISME",parts:[
      [{t:"txt",c:"André"},{t:"b",sa:true,o:["Breton"],a:"Breton"},{t:"txt",c:"est considéré comme le chef de file du surréalisme et son principal théoricien. Il publie en 1924 le premier"},{t:"b",sa:true,o:["Manifeste"],a:"Manifeste"},{t:"txt",c:"du surréalisme et pose les bases de l’esthétique surréaliste : « Automatisme psychique pur, par lequel on se propose d’exprimer, soit verbalement, soit par écrit, soit de toute autre manière, le fonctionnement réel de la pensée. Dictée de la pensée, en l’absence de tout"},{t:"b",sa:true,o:["contrôle"],a:"contrôle"},{t:"txt",c:"exercé par la raison, en dehors de toute préoccupation esthétique ou"},{t:"b",sa:true,o:["morale"],a:"morale"},{t:"txt",c:". Le surréalisme repose sur la croyance à la réalité supérieure de certaines formes d’associations négligées jusqu’à lui, à la toute-puissance du"},{t:"b",sa:true,o:["rêve"],a:"rêve"},{t:"txt",c:", au jeu désintéressé de la pensée. Il tend à ruiner définitivement tous les autres mécanismes psychiques et à se substituer à eux dans la résolution des principaux problèmes de la vie. »"}],
      [{t:"txt",c:"Le surréalisme est inspiré par les découvertes de Sigmund"},{t:"b",sa:true,o:["Freud"],a:"Freud"},{t:"txt",c:"et explore les zones de l'"},{t:"b",sa:true,o:["inconscient"],a:"inconscient"},{t:"txt",c:". Pour cela les écrivains surréalistes recourent à l'"},{t:"b",sa:true,o:["écriture"],a:"écriture"},{t:"txt",c:"automatique."}],
      [{t:"txt",c:"Les surréalistes proposent également de nombreux jeux poétiques comme les \"cadavres"},{t:"b",sa:true,o:["exquis"],a:"exquis"},{t:"txt",c:"\"."}],
      [{t:"txt",c:"Les poètes surréalistes éclatent les formes fixes et recourent souvent aux vers"},{t:"b",sa:true,o:["libres"],a:"libres"}],
    ]},
    {h:"LES GRANDS NOMS DU SURREALISME",parts:[
      [{t:"txt",c:"Les surréalistes les plus célèbres sont Louis"},{t:"b",sa:true,o:["Aragon"],a:"Aragon"},{t:"txt",c:", Paul"},{t:"b",sa:true,o:["Eluard"],a:"Eluard"},{t:"txt",c:"et Philippe"},{t:"b",sa:true,o:["Soupault"],a:"Soupault"},{t:"txt",c:"."}],
    ]},
  ]},

      [{t:"txt",c:"Deux auteurs emblématiques du Nouveau Roman sont"},{t:"b",sa:false,o:["André Breton et Robert Desnos","Alain Robbe-Grillet et Michel Butor","Samuel Beckett et Eugène Ionesco"],a:"Alain Robbe-Grillet et Michel Butor"}],

  {key:"THEATRE DE L'ABSURDE",label:"Théâtre de l'Absurde",periode:"milieu XXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE THEATRE DE L'ABSURDE"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le théâtre de l'Absurde s'est développé"},{t:"b",sa:false,o:["au début du XIXème siècle","dans les premières années du XXème siècle","au milieu du XXème siècle"],a:"au milieu du XXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du théâtre de l'Absurde sont"},{t:"b",sa:false,o:["André Breton et Robert Desnos","Samuel Beckett et Eugène Ionesco","Alain Robbe-Grillet et Michel Butor"],a:"Samuel Beckett et Eugène Ionesco"}],
      [{t:"txt",c:"Les grands principes du théâtre de l'Absurde sont"},{t:"b",sa:false,o:["l'approfondissement du réalisme et l'influence des sciences expérimentales et de la médecine","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'expression de l'étrangeté de l'homme, le refus du théâtre classique, de la psychologie et des règles traditionnelles"],a:"l'expression de l'étrangeté de l'homme, le refus du théâtre classique, de la psychologie et des règles traditionnelles"}],

    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Les auteurs du théâtre de l'absurde sont fortement marqués par la"},{t:"b",sa:true,o:["Deuxième"],a:"Deuxième"},{t:"txt",c:"Guerre mondiale."}],
    ]},
    {h:"LES PRINCIPES",parts:[
      [{t:"txt",c:"L'Absurde est l'expression de l'impuissance de l'homme à trouver un sens à l'existence."}],
      [{t:"txt",c:"Le théâtre de l'Absurde propose souvent une réflexion sur le destin, la mort, l'incompréhension qui sont des thèmes relevant du registre"},{t:"b",sa:true,o:["tragique"],a:"tragique"},{t:"txt",c:"mais les aborde souvent avec des procédés du registre"},{t:"b",sa:true,o:["comique"],a:"comique"},{t:"txt",c:"afin de faire sourire les spectateurs."}],

function MouvementsModule({onBack}){
  const [sel,setSel]=useState(0);
  const [answers,setAnswers]=useState({});
  const [checked,setChecked]=useState(false);
  const [mode,setMode]=useState('fiche');
  const mv=MOUVEMENTS[sel];
  const selectMv=i=>{setSel(i);setAnswers({});setChecked(false);};
  const setAns=(key,val)=>{setAnswers(a=>({...a,[key]:val}));};
  let totalBlanks=0, correctCount=0;
  mv.sections.forEach((sec,si)=>sec.parts.forEach((part,pi)=>part.forEach((seg,gi)=>{
    if(seg.t==='b'){
      totalBlanks++;
      const key=`${si}-${pi}-${gi}`;
      const given=(answers[key]||'').trim().toLowerCase();
      const expected=(seg.a||'').trim().toLowerCase();
      if(given===expected&&given!=='')correctCount++;
    }
  })));
  const renderSeg=(seg,si,pi,gi)=>{
    if(seg.t==='txt') return <span key={gi}>{seg.c} </span>;
    const key=`${si}-${pi}-${gi}`;
    const given=answers[key]||'';
    const isCorrect=given.trim().toLowerCase()===(seg.a||'').trim().toLowerCase();
    if(mode==='fiche'){
      return <strong key={gi} style={{color:'#5b3cc4',background:'#f5f0ff',padding:'0 4px',borderRadius:3}}>{seg.a} </strong>;
    }
    if(seg.sa){
      return(
        <span key={gi} style={{display:'inline-block',margin:'2px 0'}}>
          <input value={given} onChange={e=>setAns(key,e.target.value)} disabled={checked} placeholder="…"
            style={{fontSize:13,padding:'2px 6px',borderRadius:5,border:`1.5px solid ${checked?(isCorrect?'#27ae60':'#e74c3c'):'#bbb'}`,background:checked?(isCorrect?'#eafaf1':'#fdf0ef'):'white',width:Math.max(60,Math.min(220,(seg.a||'').length*8))+'px',outline:'none'}}/>
          {checked&&!isCorrect&&<span style={{fontSize:11,color:'#27ae60',marginLeft:4}}>→ {seg.a}</span>}{' '}
        </span>
      );
    }
    return(
      <span key={gi} style={{display:'inline-flex',flexWrap:'wrap',gap:4,margin:'2px 4px',verticalAlign:'middle'}}>
        {seg.o.map((opt,oi)=>{
          const chosen=given===opt;
          const isAns=opt===seg.a;
          let bg='white',bc='#ccc',col='#444';
          if(checked){
            if(isAns){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}
            else if(chosen){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}
          }else if(chosen){bg='#f5f0ff';bc='#5b3cc4';col='#5b2d8e';}
          return <button key={oi} onClick={()=>!checked&&setAns(key,opt)} disabled={checked} style={{fontSize:12,padding:'3px 8px',borderRadius:6,border:`1px solid ${bc}`,background:bg,color:col,cursor:checked?'default':'pointer',lineHeight:1.3}}>{opt}</button>;
        })}{' '}
      </span>
    );
  };
  return(
    <div>
      <h2 style={{fontSize:16,fontWeight:600,marginBottom:4}}>📜 Mouvements littéraires</h2>
      <p style={{fontSize:13,color:'#666',marginBottom:'1rem'}}>Révise les 13 grands mouvements pour le commentaire. Mode fiche pour apprendre, mode quiz pour te tester.</p>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:'1rem'}}>
        {MOUVEMENTS.map((m,i)=>(
          <button key={m.key} onClick={()=>selectMv(i)} style={{...s.btn,fontSize:11,padding:'5px 10px',background:sel===i?'#5b3cc4':'white',color:sel===i?'white':'#5b3cc4',border:'1px solid #5b3cc460',fontWeight:sel===i?600:400}}>{m.label}</button>
        ))}
      </div>
      <div style={{display:'flex',gap:0,marginBottom:'1rem',background:'#f0ede8',borderRadius:8,padding:3,maxWidth:320}}>
        <button onClick={()=>{setMode('fiche');setChecked(false);}} style={{flex:1,padding:'6px 0',fontSize:12,fontWeight:mode==='fiche'?600:400,background:mode==='fiche'?'white':'transparent',border:'none',borderRadius:6,color:mode==='fiche'?'#1a1a18':'#888',boxShadow:mode==='fiche'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>📖 Fiche</button>
        <button onClick={()=>{setMode('quiz');setChecked(false);setAnswers({});}} style={{flex:1,padding:'6px 0',fontSize:12,fontWeight:mode==='quiz'?600:400,background:mode==='quiz'?'white':'transparent',border:'none',borderRadius:6,color:mode==='quiz'?'#1a1a18':'#888',boxShadow:mode==='quiz'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>✏️ Quiz</button>
      </div>
      <div style={s.card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',paddingBottom:'0.75rem',borderBottom:'2px solid #5b3cc4',gap:8,flexWrap:'wrap'}}>
          <h3 style={{fontSize:20,fontWeight:700,color:'#5b3cc4',margin:0}}>{mv.label}</h3>
          <span style={{fontSize:12,background:'#f5f0ff',color:'#5b3cc4',padding:'3px 10px',borderRadius:20,fontWeight:500}}>{mv.periode}</span>
        </div>
        {mv.sections.map((sec,si)=>(
          <div key={si} style={{marginBottom:'1rem'}}>
            {sec.h&&<p style={{fontSize:11,fontWeight:700,color:'#5b3cc4',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8,marginTop:si>0?'1rem':0}}>{sec.h}</p>}
            {sec.parts.map((part,pi)=>(
              <p key={pi} style={{fontSize:13.5,lineHeight:2,color:'#2a2a28',marginBottom:8}}>
                {part.map((seg,gi)=>renderSeg(seg,si,pi,gi))}
              </p>
            ))}
          </div>
        ))}
        {mode==='quiz'&&(
          <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'0.5px solid #eee'}}>
            {!checked?(
              <button onClick={()=>setChecked(true)} style={{...s.btn,background:'#5b3cc4',color:'white',border:'none',fontWeight:600}}>Vérifier mes réponses</button>
            ):(
              <div style={{textAlign:'center'}}>
                <p style={{fontSize:24,fontWeight:700,color:correctCount===totalBlanks?'#27ae60':'#5b3cc4',marginBottom:4}}>{correctCount} / {totalBlanks}</p>
                <p style={{fontSize:13,color:'#888',marginBottom:'1rem'}}>{correctCount===totalBlanks?'Sans faute, bravo ! 🎉':correctCount>=totalBlanks*0.7?'Bien joué, presque parfait !':'Relis la fiche et réessaie 💪'}</p>
                <button onClick={()=>{setChecked(false);setAnswers({});}} style={{...s.btn,fontWeight:500}}>🔄 Recommencer</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── TIRAGE AU SORT ─────────────────────────────────────────────────────── */
function TirageEL({onBack}){
  const [el,setEl]=useState(null);
  const [phase,setPhase]=useState('draw');
  const [timeLeft,setTimeLeft]=useState(30*60);
  const [running,setRunning]=useState(false);

  const draw=()=>{
    const picked=TEXTES[Math.floor(Math.random()*TEXTES.length)];
    setEl(picked);setPhase('prepare');setTimeLeft(30*60);setRunning(true);
  };
  const redraw=()=>{setEl(null);setPhase('draw');setRunning(false);};

  useEffect(()=>{
    if(!running||phase!=='prepare')return;
    if(timeLeft<=0){setRunning(false);setPhase('reveal');return;}
    const t=setTimeout(()=>setTimeLeft(s=>s-1),1000);
    return()=>clearTimeout(t);
  },[running,timeLeft,phase]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const pct=((30*60-timeLeft)/(30*60))*100;
  const urgent=timeLeft<5*60;
  const objetCoul=el?OBJETS.find(o=>o.id===el.objet)?.c:'#1a1a18';

  return(
    <div>
      <h2 style={{fontSize:16,fontWeight:600,marginBottom:4}}>🎲 Tirage au sort</h2>
      <p style={{fontSize:13,color:'#666',marginBottom:'1.25rem'}}>Simule les conditions du bac : tu tires un texte, tu as 30 minutes pour préparer ton explication.</p>

      {phase==='draw'&&(
        <div style={{...s.card,textAlign:'center',padding:'2.5rem 1rem'}}>
          <p style={{fontSize:48,marginBottom:'1rem'}}>🎲</p>
          <p style={{fontSize:14,color:'#666',marginBottom:'1.5rem'}}>Prêt·e ? Le chrono démarre dès le tirage.</p>
          <button onClick={draw} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:600,fontSize:15,padding:'0.75rem 2rem'}}>
            Tirer un texte au sort
          </button>
        </div>
      )}

      {(phase==='prepare'||phase==='reveal')&&el&&(
        <div>
          {phase==='prepare'&&(
            <div style={{marginBottom:'1rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontSize:12,color:'#888'}}>Temps de préparation</span>
                <span style={{fontSize:24,fontWeight:700,color:urgent?'#e74c3c':'#1a1a18',fontVariantNumeric:'tabular-nums'}}>{fmt(timeLeft)}</span>
              </div>
              <div style={{height:6,background:'#eee',borderRadius:4}}>
                <div style={{height:6,borderRadius:4,background:urgent?'#e74c3c':objetCoul,width:`${pct}%`,transition:'width 1s linear'}}/>
              </div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button onClick={()=>setRunning(r=>!r)} style={{...s.btn,fontSize:11}}>{running?'⏸ Pause':'▶ Reprendre'}</button>
                <button onClick={()=>{setRunning(false);setPhase('reveal');}} style={{...s.btn,fontSize:11,color:objetCoul,border:`1px solid ${objetCoul}60`}}>Je suis prêt·e →</button>
              </div>
            </div>
          )}

          <div style={s.card}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',gap:8,flexWrap:'wrap'}}>
              <div>
                <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>{el.numero}</span>
                <p style={{fontSize:17,fontWeight:600,margin:'2px 0'}}>{el.titre}</p>
                <p style={{fontSize:13,color:'#888'}}>{el.auteur} · {el.date}</p>
              </div>
              <span style={{fontSize:11,background:objetCoul+'15',color:objetCoul,padding:'3px 8px',borderRadius:20,fontWeight:500}}>{el.mouvement}</span>
            </div>

            <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.9rem 1rem',fontSize:13,lineHeight:1.9,marginBottom:'1rem',fontStyle:'italic',whiteSpace:'pre-line',maxHeight:280,overflowY:'auto'}}>
              {el.extrait}
            </div>

            {phase==='prepare'&&(
              <div style={{background:'#f5f0ff',borderRadius:8,padding:'0.75rem 1rem',border:'1px solid #5b3cc430'}}>
                <p style={{fontSize:12,color:'#5b2d8e',fontWeight:500,margin:0}}>💭 Entraîne-toi à :</p>
                <ul style={{margin:'6px 0 0 16px',fontSize:12,color:'#5b2d8e',lineHeight:1.8}}>
                  <li>Formuler la problématique</li>
                  <li>Identifier et nommer les mouvements</li>
                  <li>Repérer les procédés clés par mouvement</li>
                </ul>
              </div>
            )}

            {phase==='reveal'&&(
              <div>
                <div style={{borderTop:'0.5px solid #eee',paddingTop:'1rem',marginBottom:'1rem'}}>
                  <p style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Problématique</p>
                  <p style={{fontSize:14,fontStyle:'italic',lineHeight:1.6,color:'#2a2a28'}}>{el.problematique}</p>
                </div>
                <div style={{borderTop:'0.5px solid #eee',paddingTop:'1rem'}}>
                  <p style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Mouvements</p>
                  {el.etapes.map((e,i)=>(
                    <div key={i} style={{marginBottom:8}}>
                      <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:4}}>
                        <span style={{background:objetCoul,color:'white',borderRadius:12,padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>{e.label}</span>
                        <span style={{fontSize:13,fontWeight:500}}>{e.titre}</span>
                      </div>
                      <ul style={{margin:'0 0 0 48px',padding:0,listStyle:'none'}}>
                        {e.procedes.map((p,j)=><li key={j} style={{fontSize:12,color:'#555',lineHeight:1.6}}>→ {p}</li>)}
                      </ul>
                    </div>
                  ))}
                </div>
                <div style={{display:'flex',gap:8,marginTop:'1.25rem',flexWrap:'wrap'}}>
                  <button onClick={redraw} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:600}}>🎲 Nouveau tirage</button>
                  <button onClick={onBack} style={s.btn}>← Accueil</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── FLASH CARDS ────────────────────────────────────────────────────────── */
function FlashMode({onBack}){
  const [mode,setMode]=useState('normal');
  const [cards,setCards]=useState([]);
  const [idx,setIdx]=useState(0);
  const [step,setStep]=useState(0);
  const [scores,setScores]=useState({mv:0,pb:0,mvTot:0,pbTot:0});
  const [done,setDone]=useState(false);
  const [selfMv,setSelfMv]=useState(null);
  const [selfPb,setSelfPb]=useState(null);
  const [choices,setChoices]=useState([]);
  const [chosen,setChosen]=useState(null);
  const [showAns,setShowAns]=useState(false);

  const buildCards=()=>{
    const sh=[...TEXTES].sort(()=>Math.random()-0.5);
    setCards(sh);setIdx(0);setStep(0);setDone(false);
    setScores({mv:0,pb:0,mvTot:0,pbTot:0});setSelfMv(null);setSelfPb(null);
    setChosen(null);setShowAns(false);
  };
  useEffect(()=>{buildCards();},[mode]);

  const buildChoices=card=>{
    const others=TEXTES.filter(t=>t.id!==card.id).sort(()=>Math.random()-0.5).slice(0,3);
    const all=[card,...others].sort(()=>Math.random()-0.5);
    setChoices(all);setChosen(null);setShowAns(false);
  };
  useEffect(()=>{
    if(mode==='inverse'&&cards[idx])buildChoices(cards[idx]);
  },[idx,mode,cards]);

  const next=()=>{
    if(idx+1>=cards.length){setDone(true);}
    else{setIdx(i=>i+1);setStep(0);setSelfMv(null);setSelfPb(null);setChosen(null);setShowAns(false);}
  };
  const handleMv=knew=>{setSelfMv(knew);setScores(s=>({...s,mv:s.mv+(knew?1:0),mvTot:s.mvTot+1}));setStep(2);};
  const handlePb=knew=>{setSelfPb(knew);setScores(s=>({...s,pb:s.pb+(knew?1:0),pbTot:s.pbTot+1}));};
  const handleChoice=c=>{
    setChosen(c);setShowAns(true);
    if(c.id===cards[idx].id)setScores(s=>({...s,mv:s.mv+1,mvTot:s.mvTot+1}));
    else setScores(s=>({...s,mvTot:s.mvTot+1}));
  };

  if(done) return(
    <div>
      <div style={s.card}>
        <div style={{textAlign:'center',padding:'1rem 0'}}>
          <p style={{fontSize:32}}>🎉</p>
          <p style={{fontSize:20,fontWeight:600,marginBottom:'1.5rem'}}>Session terminée !</p>
          <div style={{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap',marginBottom:'1.5rem'}}>
            <div style={{background:'#eafaf1',border:'1px solid #27ae6040',borderRadius:12,padding:'1rem 1.5rem',textAlign:'center'}}>
              <p style={{fontSize:28,fontWeight:600,color:'#27ae60',margin:0}}>{scores.mv}/{scores.mvTot}</p>
              <p style={{fontSize:12,color:'#555',margin:0}}>{mode==='inverse'?'Textes reconnus':'Mouvements sus'}</p>
            </div>
            {mode==='normal'&&(
              <div style={{background:'#eaf2fb',border:'1px solid #2980b940',borderRadius:12,padding:'1rem 1.5rem',textAlign:'center'}}>
                <p style={{fontSize:28,fontWeight:600,color:'#2980b9',margin:0}}>{scores.pb}/{scores.pbTot}</p>
                <p style={{fontSize:12,color:'#555',margin:0}}>Problématiques sues</p>
              </div>
            )}
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
            <button onClick={buildCards} style={{...s.btn,background:'#1a1a18',color:'#fff',border:'none'}}>🔄 Recommencer</button>
            <button onClick={onBack} style={s.btn}>← Accueil</button>
          </div>
        </div>
      </div>
    </div>
  );

  const card=cards[idx];
  if(!card)return null;
  const objetCoul=OBJETS.find(o=>o.id===card.objet)?.c||'#1a1a18';
  const total=cards.length;

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
        <button onClick={onBack} style={{...s.btn,fontSize:12}}>← Retour</button>
        <span style={{fontSize:12,color:'#888'}}>Carte {idx+1} / {total}</span>
      </div>

      <div style={{display:'flex',gap:0,marginBottom:'1rem',background:'#f0ede8',borderRadius:8,padding:3}}>
        <button onClick={()=>setMode('normal')} style={{flex:1,padding:'6px 4px',fontSize:12,fontWeight:mode==='normal'?600:400,background:mode==='normal'?'white':'transparent',border:'none',borderRadius:6,color:mode==='normal'?'#1a1a18':'#888',boxShadow:mode==='normal'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          📖 Texte → mouvements
        </button>
        <button onClick={()=>setMode('inverse')} style={{flex:1,padding:'6px 4px',fontSize:12,fontWeight:mode==='inverse'?600:400,background:mode==='inverse'?'white':'transparent',border:'none',borderRadius:6,color:mode==='inverse'?'#1a1a18':'#888',boxShadow:mode==='inverse'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          🔀 Mouvements → texte
        </button>
      </div>

      <div style={{height:4,background:'#eee',borderRadius:4,marginBottom:'1.25rem'}}>
        <div style={{height:4,background:objetCoul,borderRadius:4,width:`${((idx)/total)*100}%`,transition:'width 0.3s'}}/>
      </div>

      {mode==='inverse'&&(
        <div style={s.card}>
          <div style={{marginBottom:'1rem'}}>
            <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>🔀 Mode inverse</span>
            <p style={{fontSize:14,fontWeight:600,margin:'4px 0 2px'}}>Reconnais le texte à partir de ses mouvements</p>
          </div>
          <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.85rem 1rem',marginBottom:'1rem'}}>
            <p style={{fontSize:11,fontWeight:600,color:'#888',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Les mouvements :</p>
            {card.etapes.map((e,i)=>(
              <div key={i} style={{display:'flex',gap:10,marginBottom:6,alignItems:'flex-start'}}>
                <span style={{background:objetCoul,color:'white',borderRadius:12,padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>{e.label}</span>
                <span style={{fontSize:13,lineHeight:1.5}}>{e.titre}</span>
              </div>
            ))}
          </div>
          <p style={{fontSize:13,color:'#555',marginBottom:'0.75rem',fontWeight:500}}>À quel texte correspondent ces mouvements ?</p>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:'1rem'}}>
            {choices.map((c,i)=>{
              const isCorrect=c.id===card.id;
              const isChosen=chosen?.id===c.id;
              let bg='#fff',bc='#ddd',col='#1a1a18';
              if(showAns){

function tirageSujet(pool,mode,exclude){
  let f=mode==='all'?pool:pool.filter(x=>x.type===mode);
  if(!f.length)f=pool;
  let cand=f.filter(x=>x!==exclude);
  if(!cand.length)cand=f;
  return cand[Math.floor(Math.random()*cand.length)];
}

function Stars({n}){
  return <span aria-label={`${n} étoile${n>1?'s':''} sur 3`} style={{fontSize:34,letterSpacing:4}}>{[0,1,2].map(k=><span key={k} className="pop" style={{animationDelay:`${k*0.15}s`,display:'inline-block',color:k<n?'#f5a300':'rgba(22,18,29,0.18)'}}>★</span>)}</span>;
}

function QuiParle(){
  const N=10;
  const [phase,setPhase]=useState('intro');
  const [deck,setDeck]=useState([]);
  const [i,setI]=useState(0);
  const [ans,setAns]=useState(null);
  const [score,setScore]=useState(0);
  const [streak,setStreak]=useState(0);
  const [best,setBest]=useState(0);
  const [misses,setMisses]=useState([]);
  const q=deck[i];

  const start=()=>{
    setDeck([...QUI_PARLE].sort(()=>Math.random()-0.5).slice(0,N));
    setI(0);setAns(null);setScore(0);setStreak(0);setBest(0);setMisses([]);setPhase('play');
  };
  const answer=p=>{
    if(ans!==null||!q)return;
    setAns(p);
    if(p===q.p){const n=streak+1;setScore(x=>x+1);setStreak(n);setBest(b=>Math.max(b,n));}
    else{setStreak(0);setMisses(m=>[...m,q]);}
  };
  const next=()=>{if(i+1>=deck.length)setPhase('end');else{setI(i+1);setAns(null);}};

  useEffect(()=>{
    if(phase!=='play')return;
    const onKey=e=>{
      if(e.key==='1')answer(1);
      else if(e.key==='2')answer(2);
      else if(e.key==='Enter'&&ans!==null){e.preventDefault();next();}
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  });

  if(phase==='intro') return(
    <div className="b" style={{background:'var(--lilac)',textAlign:'center',padding:'2.25rem 1.25rem'}}>
      <div style={{fontSize:44}}>🎭</div>
      <h3 style={{fontSize:'clamp(28px,5vw,40px)',margin:'8px 0'}}>Qui parle ?</h3>
      <p style={{maxWidth:460,margin:'0 auto',fontSize:15,lineHeight:1.6}}>Une réplique de la pièce s'affiche. À toi de dire si c'est <strong>H1</strong> ou <strong>H2</strong> qui la prononce. {N} répliques, tirées au hasard à chaque partie.</p>
      <p style={{fontSize:12.5,marginTop:10,opacity:0.75}}>Astuce : touches 1 et 2 du clavier, Entrée pour continuer.</p>
      <button onClick={start} style={{...s.btn,marginTop:18,padding:'12px 26px',fontSize:15,background:'var(--ink)',color:'#fff'}}>Jouer →</button>
    </div>
  );

  if(phase==='end'){
    const stars=score>=9?3:score>=7?2:score>=5?1:0;
    const mot=stars===3?'Tu connais H1 et H2 par cœur !':stars===2?'Très bien, tu as l\'oreille !':stars===1?'Pas mal, relis les passages ratés.':'Relis la pièce et retente ta chance !';
    return(
      <div>
        <div className="b" style={{background:'var(--yellow)',textAlign:'center',padding:'2rem 1.25rem'}}>
          <Stars n={stars}/>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:56,lineHeight:1,margin:'10px 0 4px'}}>{score}/{deck.length}</p>
          <p style={{fontWeight:600}}>{mot}</p>
          {best>=3&&<p style={{fontSize:13,marginTop:6}}>🔥 Meilleure série : {best} bonnes réponses d'affilée</p>}
          <button onClick={start} style={{...s.btn,marginTop:16,background:'var(--ink)',color:'#fff'}}>🔄 Rejouer</button>
        </div>
        {misses.length>0&&(
          <div className="b" style={{background:'var(--surface)',marginTop:16}}>
            <span className="kicker" style={{background:'var(--pink)'}}>À revoir</span>
            <ul style={{listStyle:'none',marginTop:12,display:'flex',flexDirection:'column',gap:12}}>
              {misses.map((m,k)=>(
                <li key={k} style={{borderTop:k?'1px solid var(--line)':'none',paddingTop:k?12:0}}>
                  <p style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:16}}>« {m.t} » <strong style={{fontFamily:'var(--sans)',fontStyle:'normal'}}>: H{m.p}</strong></p>
                  <p style={{fontSize:13.5,color:'var(--muted)',marginTop:3,lineHeight:1.55}}>{m.ex}</p>
                </li>
              ))}
            </ul>
          </div>
        )}
      </div>
    );
  }

  const ok=ans!==null&&ans===q.p;
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,gap:8,flexWrap:'wrap'}}>
        <span className="chip">Réplique {i+1} / {deck.length}</span>
        <span style={{display:'flex',gap:8}}>
          {streak>=2&&<span className="chip pop" key={streak} style={{background:'var(--coral)'}}>🔥 {streak} d'affilée</span>}
          <span className="chip" style={{background:'var(--yellow)'}}>Score : {score}</span>
        </span>
      </div>
      <div style={{height:10,border:'2px solid var(--ink)',borderRadius:999,background:'#fff',overflow:'hidden',marginBottom:16}}>
        <div style={{height:'100%',width:`${((i+(ans!==null?1:0))/deck.length)*100}%`,background:'var(--violet)',transition:'width .3s'}}/>
      </div>
      <div className="b" style={{background:'var(--surface)',padding:'2rem 1.5rem',textAlign:'center'}}>
        <span className="kicker" style={{background:'var(--lilac)'}}>Qui parle ?</span>
        <p key={i} className="fade" style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:'clamp(21px,3.6vw,30px)',lineHeight:1.35,margin:'1rem auto 0',maxWidth:620}}>« {q.t} »</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:16}}>
        {[1,2].map(p=>{
          let bg=p===1?'var(--lilac)':'var(--pink)';
          if(ans!==null){bg=p===q.p?'var(--mint)':p===ans?'#ff9b8a':'#eeeaf2';}
          return(
            <button key={p} className="b" onClick={()=>answer(p)} disabled={ans!==null} style={{background:bg,textAlign:'center',padding:'1.1rem',cursor:ans===null?'pointer':'default'}}>
              <span style={{display:'block',fontFamily:'var(--display)',fontWeight:800,fontSize:40,lineHeight:1}}>H{p}</span>
              <span style={{fontSize:12,opacity:0.7}}>{ans!==null&&p===q.p?'✓ bonne réponse':`touche ${p}`}</span>
            </button>
          );
        })}
      </div>
      {ans!==null&&(
        <div className={'b fade'+(ok?'':' shake')} style={{marginTop:16,background:ok?'var(--mint)':'#ffd9d1'}}>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:20}}>{ok?'✓ Bien vu !':`✗ Raté : c'est H${q.p}.`}</p>
          <p style={{fontSize:14.5,marginTop:6,lineHeight:1.6}}>{q.ex}</p>
          <button onClick={next} style={{...s.btn,marginTop:14,background:'var(--ink)',color:'#fff'}}>{i+1>=deck.length?'Voir mon score →':'Réplique suivante →'}</button>
        </div>
      )}
    </div>
  );
}

/* ── JEU 2 : REMETS LA PIÈCE DANS L'ORDRE ───────────────────────────────── */
const ORDRE_PIECE=[
  {id:1,t:"H1 vient voir H2 pour lui demander ce qu'il a contre lui."},
  {id:2,t:"H2 finit par avouer : tout vient d'un « C'est bien… ça »."},
  {id:3,t:"H2 révèle qu'il a demandé l'autorisation de rompre : débouté, il est fiché comme « celui qui rompt pour un oui ou pour un non »."},
  {id:4,t:"H1 propose un mot pour nommer le grief : « condescendant »."},
  {id:5,t:"H2 va chercher ses voisins pour qu'ils jugent le différend."},
  {id:6,t:"Devant eux, H2 accuse H1 de lui avoir tendu une « souricière » avec une tournée de conférences."},
  {id:7,t:"Les voisins repartent, perplexes ; H2 reproche à H1 d'« étaler » son bonheur et nie être jaloux."},
  {id:8,t:"À la fenêtre, H2 dit « la vie est là » : H1 reconnaît Verlaine et l'accuse de se réfugier dans la « poésie »."},
  {id:9,t:"H1 rappelle l'ascension de la Barre des Écrins et sa moquerie sur les « cartes postales »."},
  {id:10,t:"H2 déclare qu'ils sont deux camps ennemis ; le mot « raté » est lâché."},
  {id:11,t:"Chacun décrit son malaise chez l'autre : sables mouvants pour H1, claustrophobie pour H2."},
  {id:12,t:"Ils envisagent une demande de rupture à deux… et la pièce s'achève sur « Oui » / « Non ! »."},
];
const ORDRE_COURT=[1,2,5,8,10,12];

function OrdrePiece(){
  const [niveau,setNiveau]=useState(null);
  const [pool,setPool]=useState([]);
  const [placed,setPlaced]=useState([]);
  const [checked,setChecked]=useState(false);
  const items=niveau?ORDRE_PIECE.filter(e=>niveau==='court'?ORDRE_COURT.includes(e.id):true):[];
  const expected=items.map(e=>e.id);

  const start=nv=>{
    const its=ORDRE_PIECE.filter(e=>nv==='court'?ORDRE_COURT.includes(e.id):true);
    let sh;
    do{sh=[...its].sort(()=>Math.random()-0.5);}while(sh.every((e,k)=>e.id===its[k].id));
    setNiveau(nv);setPool(sh);setPlaced([]);setChecked(false);
  };
  const place=e=>{if(checked)return;setPool(p=>p.filter(x=>x.id!==e.id));setPlaced(p=>[...p,e]);};
  const unplace=e=>{if(checked)return;setPlaced(p=>p.filter(x=>x.id!==e.id));setPool(p=>[...p,e]);};
  const nbOk=placed.filter((e,k)=>e.id===expected[k]).length;

  if(!niveau) return(
    <div className="b" style={{background:'var(--yellow)',textAlign:'center',padding:'2.25rem 1.25rem'}}>
      <div style={{fontSize:44}}>🧩</div>
      <h3 style={{fontSize:'clamp(28px,5vw,40px)',margin:'8px 0'}}>Remets la pièce dans l'ordre</h3>
      <p style={{maxWidth:480,margin:'0 auto',fontSize:15,lineHeight:1.6}}>Les étapes de la dispute sont mélangées. Clique-les dans l'ordre où elles arrivent dans la pièce. Clique sur une étape déjà placée pour la retirer.</p>
      <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginTop:18}}>
        <button onClick={()=>start('court')} style={{...s.btn,padding:'12px 20px',fontSize:14}}>Les grandes étapes ({ORDRE_COURT.length})</button>
        <button onClick={()=>start('long')} style={{...s.btn,padding:'12px 20px',fontSize:14,background:'var(--ink)',color:'#fff'}}>Toute la pièce ({ORDRE_PIECE.length})</button>
      </div>
    </div>
  );

  const complet=pool.length===0;
  const stars=checked?(nbOk===items.length?3:nbOk>=items.length*0.7?2:nbOk>=items.length*0.4?1:0):0;
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,gap:8,flexWrap:'wrap'}}>
        <span className="chip" style={{background:'var(--yellow)'}}>{niveau==='court'?'Les grandes étapes':'Toute la pièce'} · {placed.length}/{items.length} placées</span>
        <button onClick={()=>setNiveau(null)} style={{...s.btn,fontSize:12}}>Changer de niveau</button>
      </div>

      {checked&&(
        <div className={'b fade'+(nbOk===items.length?'':' shake')} style={{background:nbOk===items.length?'var(--mint)':'var(--pink)',textAlign:'center',marginBottom:16}}>
          <Stars n={stars}/>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:40,lineHeight:1,margin:'8px 0 4px'}}>{nbOk}/{items.length}</p>
          <p style={{fontWeight:600}}>{nbOk===items.length?'Parfait, tu connais la pièce sur le bout des doigts !':'Les étapes en rouge ne sont pas à leur place. Regarde l\'indication, puis réessaie.'}</p>
          <button onClick={()=>start(niveau)} style={{...s.btn,marginTop:14,background:'var(--ink)',color:'#fff'}}>🔄 Nouvelle partie</button>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,alignItems:'start'}}>
        {!checked&&(
          <div className="b" style={{background:'var(--sky)'}}>
            <span className="kicker">Étapes à placer</span>
            <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
              {pool.map(e=>(
                <button key={e.id} className="fade" onClick={()=>place(e)} style={{textAlign:'left',padding:'11px 13px',fontSize:14,lineHeight:1.45,border:'2px solid var(--ink)',borderRadius:14,background:'#fff',boxShadow:'2px 2px 0 var(--ink)'}}>{e.t}</button>
              ))}
              {complet&&<p style={{fontSize:14,fontWeight:600}}>Tout est placé ! Vérifie ta chronologie →</p>}
            </div>
          </div>
        )}
        <div className="b" style={{background:'var(--surface)',gridColumn:checked?'1 / -1':'auto'}}>
          <span className="kicker" style={{background:'var(--lilac)'}}>Ta chronologie</span>
          <ol style={{listStyle:'none',display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
            {items.map((_,k)=>{
              const e=placed[k];
              if(!e) return(
                <li key={'v'+k} style={{display:'flex',gap:10,alignItems:'center',padding:'11px 13px',border:'2px dashed rgba(22,18,29,0.3)',borderRadius:14,color:'var(--faint)',fontSize:13.5}}>
                  <span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:18,width:26,textAlign:'center'}}>{k+1}</span>{k===placed.length?'← clique une étape':''}
                </li>
              );
              const good=e.id===expected[k];
              const bg=checked?(good?'var(--mint)':'#ffd0c6'):'var(--paper)';
              return(
                <li key={e.id}>
                  <button onClick={()=>unplace(e)} disabled={checked} style={{width:'100%',display:'flex',gap:10,alignItems:'flex-start',textAlign:'left',padding:'11px 13px',fontSize:14,lineHeight:1.45,border:'2px solid var(--ink)',borderRadius:14,background:bg,cursor:checked?'default':'pointer'}}>
                    <span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:18,width:26,textAlign:'center',flexShrink:0}}>{k+1}</span>
                    <span style={{flex:1}}>
                      {e.t}
                      {checked&&!good&&<span style={{display:'block',fontSize:12.5,fontWeight:700,marginTop:4}}>↳ en réalité, étape n° {expected.indexOf(e.id)+1}</span>}
                    </span>
                    {checked&&<span aria-hidden="true">{good?'✅':'❌'}</span>}
                  </button>
                </li>
              );
            })}
          </ol>
          {complet&&!checked&&<button onClick={()=>setChecked(true)} style={{...s.btn,marginTop:16,width:'100%',padding:'12px',fontSize:15,background:'var(--violet)',color:'#fff'}}>Vérifier ma chronologie</button>}
        </div>
      </div>
    </div>
  );
}

      </button>
    </div>
  );
}
