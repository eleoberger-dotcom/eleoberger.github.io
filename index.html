function Proced√©Text({text, onTermClick}){
  const terms=Object.keys(GLOSSAIRE);

  let bestIdx=Infinity, bestTerm=null, bestLen=0;
  terms.forEach(t=>{

    if(idx>=0 && (idx<bestIdx || (idx===bestIdx && t.length>bestLen))){

  });

  const before=text.slice(0,bestIdx);

}

function Entretien(){
  const canvasRef=useRef();
  const [spinning,setSpinning]=useState(false);
  const [question,setQuestion]=useState(null);
  const [reponse,setReponse]=useState('');
  const [tipsOpen,setTipsOpen]=useState(false);
  const [posees,setPosees]=useState([]);

  const oeuvre={c:'#5b3cc4',info:OBJETS_INFO.theatre};

  const N=QUESTIONS_ORAL.length;
  const colors=['#5b3cc4','#27ae60','#e67e22','#2980b9','#c0392b','#16a085','#d35400','#7f8c8d'];

  const draw=useCallback((angle)=>{
    const c=canvasRef.current;if(!c)return;
    const ctx=c.getContext('2d');
    const cx=c.width/2,cy=c.height/2,r=cy-4;
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<N;i++){
      const a=angle+i*(2*Math.PI/N);
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,a,a+2*Math.PI/N);
      ctx.fillStyle=colors[i%colors.length];ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(cx+r-4,cy);ctx.lineTo(cx+r+12,cy-8);ctx.lineTo(cx+r+12,cy+8);
    ctx.fillStyle='#1a1a18';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,18,0,2*Math.PI);
    ctx.fillStyle='#fff';ctx.fill();
    ctx.font='bold 11px system-ui';ctx.fillStyle='#1a1a18';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('üéØ',cx,cy);
  },[N]);

  useEffect(()=>{draw(0);},[draw]);

  const spin=()=>{
    if(spinning)return;
    setSpinning(true);setQuestion(null);setReponse('');
    const extra=4*Math.PI+Math.random()*4*Math.PI;
    const start=performance.now();
    const dur=3000+Math.random()*1000;
    const startA=angleRef.current;
    const animate=now=>{
      const t=Math.min((now-start)/dur,1);
      const ease=1-Math.pow(1-t,3);
      const a=startA+extra*ease;
      angleRef.current=a%(2*Math.PI);
      draw(angleRef.current);
      if(t<1){animRef.current=requestAnimationFrame(animate);}
      else{
        setSpinning(false);
        const normalized=((2*Math.PI-angleRef.current)%(2*Math.PI));
        const idx=Math.floor(normalized/(2*Math.PI/N))%N;
        const q=QUESTIONS_ORAL[idx];
        setQuestion(q);
        setPosees(p=>p.includes(q)?p:[...p,q]);
      }
    };
    animRef.current=requestAnimationFrame(animate);
  };

  useEffect(()=>()=>{cancelAnimationFrame(animRef.current);},[]);

  return(
    <div>
      <div style={{...s.card,marginBottom:'1rem',background:'#fffaf0',borderColor:'#f4d8a4'}}>

        </p>
      </div>

      <div style={{...s.card,marginBottom:'1rem',padding:'0.85rem 1rem',borderColor:oeuvre.c+'60',background:oeuvre.c+'0d'}}>
        <span style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.05em',color:oeuvre.c,fontWeight:600}}>≈íuvre travaill√©e</span>
        <p style={{fontSize:14,margin:'2px 0 0'}}>{oeuvre.info.auteur}, <em>{oeuvre.info.oeuvre}</em></p>
      </div>

      <button onClick={()=>setTipsOpen(o=>!o)} style={{...s.btn,marginBottom:'1rem',width:'100%',textAlign:'left',fontSize:13}}>
        üí° Conseils pour la pr√©sentation de l'≈ìuvre (2‚Äì3 min) {tipsOpen?'‚ñ≤':'‚ñº'}
      </button>
      {tipsOpen&&(
        <div className="fade" style={{...s.card,marginBottom:'1rem',background:'#f0f4ff',borderColor:'#c3cfe2'}}>
          <p style={{fontSize:12,fontWeight:600,color:'#1a5276',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>‚úÖ Une pr√©sentation efficace</p>
          <ul style={{margin:'0 0 12px 16px',fontSize:13,lineHeight:1.75,color:'#1a1a18'}}>
            <li>Une pr√©sentation <em>personnelle</em>, justifi√©e par des r√©f√©rences pr√©cises √† l'≈ìuvre</li>
            <li>Caract√©ristiques principales (auteur, titre, genre, √©poque, sujet)</li>
            <li>Int√©r√™t et particularit√©s de l'≈ìuvre</li>
            <li>Avis argument√© + √©tay√© par des r√©f√©rences</li>
          </ul>
          <p style={{fontSize:12,fontWeight:600,color:'#a93226',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>‚ùå Ce qu'il ne faut pas faire</p>
          <ul style={{margin:'0 0 12px 16px',fontSize:13,lineHeight:1.75,color:'#1a1a18'}}>
            <li>La r√©citation d'une fiche de lecture impersonnelle</li>
            <li>La r√©citation d'un cours</li>
            <li>Un r√©sum√© complet de l'intrigue</li>

          <p style={{fontSize:12,fontWeight:600,color:'#1a5276',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Adjectifs utiles</p>
          <p style={{fontSize:12,color:'#555',lineHeight:1.7,fontStyle:'italic'}}>comique ¬∑ r√©aliste ¬∑ vivant ¬∑ po√©tique ¬∑ critique ¬∑ ironique ¬∑ parodique ¬∑ path√©tique ¬∑ lyrique ¬∑ engag√© ¬∑ universel ¬∑ ambigu ¬∑ bouleversant ¬∑ d√©paysant ¬∑ actuel</p>
        </div>
      )}

      <div style={{marginBottom:'0.75rem'}}>
        <span style={s.label}>Lance la roue pour t'entra√Æner aux questions du jury</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'1rem',marginBottom:'1.25rem'}}>
        <canvas ref={canvasRef} width={260} height={260} style={{borderRadius:'50%',boxShadow:'0 2px 12px rgba(0,0,0,0.15)'}}/>
        <button onClick={spin} disabled={spinning} style={{...s.btn,background:spinning?'#ccc':'#1a1a18',color:'#fff',border:'none',padding:'10px 28px',fontSize:14,fontWeight:600}}>
          {spinning?'La roue tourne‚Ä¶':'üéØ Lancer la roue'}
        </button>
        {posees.length>0&&<p style={{fontSize:11,color:'#888'}}>{posees.length} / {N} questions d√©j√† tir√©es</p>}
      </div>

      {question&&(
        <div className="fade" style={s.card}>
          <p style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.08em',color:oeuvre.c,marginBottom:8,fontWeight:600}}>
            Question tir√©e au sort ‚Äî sur {oeuvre.info.oeuvre}
          </p>
          <p style={{fontSize:16,fontWeight:500,lineHeight:1.6,marginBottom:'1rem',color:'#1a1a18'}}>¬´ {question} ¬ª</p>
          <label style={s.label}>Ta r√©ponse (un paragraphe argument√© avec exemples pr√©cis)</label>
          <textarea value={reponse} onChange={e=>setReponse(e.target.value)} placeholder={`R√©ponds en t'appuyant sur des exemples pr√©cis tir√©s de ${oeuvre.info.oeuvre}‚Ä¶`} style={{minHeight:140}}/>
          {reponse.length>20&&<p style={{fontSize:12,color:'#888',marginTop:6}}>{reponse.length} caract√®res ‚Äî relis-toi √† voix haute avant de passer √† la suivante.</p>}

          <ul style={{margin:'8px 0 0 20px',fontSize:12,color:'#666',lineHeight:1.6}}>
            {posees.map((q,i)=><li key={i}>{q}</li>)}

        </details>
      )}
    </div>
  );
}

/* ‚îÄ‚îÄ COMPOSANT : QUIZ G√âN√âRIQUE ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ */
function shuffleOpts(q){
  if(!q||!q.o)return null;
  const idxs=q.o.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
  }
  return {opts:idxs.map(i=>q.o[i]),r:idxs.indexOf(q.r)};
}

function QuizGeneric({data,niveaux,objetId}){
  const firstNiv=niveaux[0][0];
  const [niv,setNiv]=useState(firstNiv);
  const [qi,setQi]=useState(0);
  const [score,setScore]=useState(0);
  const [ans,setAns]=useState(null);
  const [rep,setRep]=useState('');
  const [done,setDone]=useState(false);
  const [showEx,setShowEx]=useState(false);
  const [shuffled,setShuffled]=useState(null);

  const n=data[niv]||{questions:[]};
  const q=n.questions[qi];

  useEffect(()=>{setShuffled(q&&q.o?shuffleOpts(q):null);},[qi,niv]);

  const opts=shuffled?shuffled.opts:q?.o;
  const correctIdx=shuffled!==null?shuffled.r:q?.r;

  const changeNiv=v=>{setNiv(v);setQi(0);setScore(0);setAns(null);setRep('');setDone(false);setShowEx(false);};
  const handleQCM=i=>{if(ans!==null)return;setAns(i);if(i===correctIdx)setScore(s=>s+1);};
  const nextQ=()=>{setQi(q=>q+1);setAns(null);setRep('');setShowEx(false);};
  const nextDone=()=>{
    setDone(true);
    if(objetId){
      try{
        const p=JSON.parse(localStorage.getItem('quiz_progress')||'{}');
        if(!p[objetId])p[objetId]={};
        p[objetId][niv]=true;
        localStorage.setItem('quiz_progress',JSON.stringify(p));
      }catch(e){}
    }
  };
  const reset=()=>{setQi(0);setScore(0);setAns(null);setRep('');setDone(false);setShowEx(false);};

  if(!n.questions.length)return<div style={s.card}><p style={{fontSize:13,color:'#888'}}>Quiz √† venir.</p></div>;

  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:'1rem',flexWrap:'wrap'}}>
        {niveaux.map(([k])=>data[k]&&<button key={k} onClick={()=>changeNiv(k)} style={s.lvl(niv===k,data[k].c)}>{data[k].label}</button>)}
      </div>
      <div style={s.card}>
        {!done?(
          <>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.75rem'}}>
              <span style={{fontSize:12,color:'#888'}}>Question {qi+1} / {n.questions.length}</span>
              <span style={{fontSize:12,color:'#888'}}>Score : {score}</span>
            </div>
            <div style={{background:'#f5f4f0',borderRadius:8,padding:'0.75rem 1rem',marginBottom:'1rem'}}>
              <p style={{fontSize:15,fontWeight:500,lineHeight:1.5}}>{q.q}</p>
            </div>
            {opts?(
              <>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {opts.map((opt,i)=>{
                    let bg='#fff',bc='#ddd',col='#1a1a18';
                    if(ans!==null){if(i===correctIdx){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}else if(i===ans){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}}
                    return<button key={i} onClick={()=>handleQCM(i)} style={{textAlign:'left',padding:'10px 14px',fontSize:14,borderRadius:8,border:`0.5px solid ${bc}`,background:bg,color:col,cursor:ans===null?'pointer':'default',lineHeight:1.5,minHeight:44}}>{opt}</button>;
                  })}
                </div>
                {ans!==null&&q.ex&&(

function MouvementsModule({onBack}){

  let totalBlanks=0, correctCount=0;
  mv.sections.forEach((sec,si)=>sec.parts.forEach((part,pi)=>part.forEach((seg,gi)=>{
    if(seg.t==='b'){
      totalBlanks++;
      const key=`${si}-${pi}-${gi}`;

      const expected=(seg.a||'').trim().toLowerCase();
      if(given===expected&&given!=='')correctCount++;
    }
  })));
  const renderSeg=(seg,si,pi,gi)=>{

    const key=`${si}-${pi}-${gi}`;

    const isCorrect=given.trim().toLowerCase()===(seg.a||'').trim().toLowerCase();
    if(mode==='fiche'){
      return <strong key={gi} style={{color:'#5b3cc4',background:'#f5f0ff',padding:'0 4px',borderRadius:3}}>{seg.a} </strong>;
    }
    if(seg.sa){
      return(
        <span key={gi} style={{display:'inline-block',margin:'2px 0'}}>
          <input value={given} onChange={e=>setAns(key,e.target.value)} disabled={checked} placeholder="‚Ä¶"

          {checked&&!isCorrect&&<span style={{fontSize:11,color:'#27ae60',marginLeft:4}}>‚Üí {seg.a}</span>}{' '}
        </span>
      );
    }
    return(
      <span key={gi} style={{display:'inline-flex',flexWrap:'wrap',gap:4,margin:'2px 4px',verticalAlign:'middle'}}>
        {seg.o.map((opt,oi)=>{
          const chosen=given===opt;
          const isAns=opt===seg.a;
          let bg='white',bc='#ccc',col='#444';
          if(checked){
            if(isAns){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}
            else if(chosen){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}
          }else if(chosen){bg='#f5f0ff';bc='#5b3cc4';col='#5b2d8e';}
          return <button key={oi} onClick={()=>!checked&&setAns(key,opt)} disabled={checked} style={{fontSize:12,padding:'3px 8px',borderRadius:6,border:`1px solid ${bc}`,background:bg,color:col,cursor:checked?'default':'pointer',lineHeight:1.3}}>{opt}</button>;
        })}{' '}

function TirageEL({onBack}){
  const [el,setEl]=useState(null);
  const [phase,setPhase]=useState('draw');
  const [timeLeft,setTimeLeft]=useState(30*60);
  const [running,setRunning]=useState(false);

  const draw=()=>{
    const picked=TEXTES[Math.floor(Math.random()*TEXTES.length)];
    setEl(picked);setPhase('prepare');setTimeLeft(30*60);setRunning(true);
  };
  const redraw=()=>{setEl(null);setPhase('draw');setRunning(false);};

  useEffect(()=>{
    if(!running||phase!=='prepare')return;
    if(timeLeft<=0){setRunning(false);setPhase('reveal');return;}
    const t=setTimeout(()=>setTimeLeft(s=>s-1),1000);
    return()=>clearTimeout(t);
  },[running,timeLeft,phase]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const pct=((30*60-timeLeft)/(30*60))*100;
  const urgent=timeLeft<5*60;
  const objetCoul=el?OBJETS.find(o=>o.id===el.objet)?.c:'#1a1a18';

  return(
    <div>
      <h2 style={{fontSize:16,fontWeight:600,marginBottom:4}}>üé≤ Tirage au sort</h2>
      <p style={{fontSize:13,color:'#666',marginBottom:'1.25rem'}}>Simule les conditions du bac : tu tires un texte, tu as 30 minutes pour pr√©parer ton explication.</p>

      {phase==='draw'&&(
        <div style={{...s.card,textAlign:'center',padding:'2.5rem 1rem'}}>
          <p style={{fontSize:48,marginBottom:'1rem'}}>üé≤</p>
          <p style={{fontSize:14,color:'#666',marginBottom:'1.5rem'}}>Pr√™t¬∑e ? Le chrono d√©marre d√®s le tirage.</p>
          <button onClick={draw} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:600,fontSize:15,padding:'0.75rem 2rem'}}>
            Tirer un texte au sort
          </button>
        </div>
      )}

      {(phase==='prepare'||phase==='reveal')&&el&&(
        <div>
          {phase==='prepare'&&(
            <div style={{marginBottom:'1rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontSize:12,color:'#888'}}>Temps de pr√©paration</span>
                <span style={{fontSize:24,fontWeight:700,color:urgent?'#e74c3c':'#1a1a18',fontVariantNumeric:'tabular-nums'}}>{fmt(timeLeft)}</span>
              </div>
              <div style={{height:6,background:'#eee',borderRadius:4}}>
                <div style={{height:6,borderRadius:4,background:urgent?'#e74c3c':objetCoul,width:`${pct}%`,transition:'width 1s linear'}}/>
              </div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button onClick={()=>setRunning(r=>!r)} style={{...s.btn,fontSize:11}}>{running?'‚è∏ Pause':'‚ñ∂ Reprendre'}</button>
                <button onClick={()=>{setRunning(false);setPhase('reveal');}} style={{...s.btn,fontSize:11,color:objetCoul,border:`1px solid ${objetCoul}60`}}>Je suis pr√™t¬∑e ‚Üí</button>
              </div>
            </div>
          )}

          <div style={s.card}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',gap:8,flexWrap:'wrap'}}>
              <div>
                <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>{el.numero}</span>
                <p style={{fontSize:17,fontWeight:600,margin:'2px 0'}}>{el.titre}</p>
                <p style={{fontSize:13,color:'#888'}}>{el.auteur} ¬∑ {el.date}</p>
              </div>
              <span style={{fontSize:11,background:objetCoul+'15',color:objetCoul,padding:'3px 8px',borderRadius:20,fontWeight:500}}>{el.mouvement}</span>
            </div>

            <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.9rem 1rem',fontSize:13,lineHeight:1.9,marginBottom:'1rem',fontStyle:'italic',whiteSpace:'pre-line',maxHeight:280,overflowY:'auto'}}>
              {el.extrait}
            </div>

            {phase==='prepare'&&(
              <div style={{background:'#f5f0ff',borderRadius:8,padding:'0.75rem 1rem',border:'1px solid #5b3cc430'}}>
                <p style={{fontSize:12,color:'#5b2d8e',fontWeight:500,margin:0}}>üí≠ Entra√Æne-toi √† :</p>
                <ul style={{margin:'6px 0 0 16px',fontSize:12,color:'#5b2d8e',lineHeight:1.8}}>
                  <li>Formuler la probl√©matique</li>
                  <li>Identifier et nommer les mouvements</li>
                  <li>Rep√©rer les proc√©d√©s cl√©s par mouvement</li>
                </ul>

            {phase==='reveal'&&(
              <div>

                  <p style={{fontSize:14,fontStyle:'italic',lineHeight:1.6,color:'#2a2a28'}}>{el.problematique}</p>

                  <button onClick={onBack} style={s.btn}>‚Üê Accueil</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ‚îÄ‚îÄ FLASH CARDS ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ‚îÄ */
function FlashMode({onBack}){
  const [mode,setMode]=useState('normal');
  const [cards,setCards]=useState([]);
  const [idx,setIdx]=useState(0);
  const [step,setStep]=useState(0);
  const [scores,setScores]=useState({mv:0,pb:0,mvTot:0,pbTot:0});
  const [done,setDone]=useState(false);
  const [selfMv,setSelfMv]=useState(null);
  const [selfPb,setSelfPb]=useState(null);
  const [choices,setChoices]=useState([]);
  const [chosen,setChosen]=useState(null);
  const [showAns,setShowAns]=useState(false);

  const buildCards=()=>{
    const sh=[...TEXTES].sort(()=>Math.random()-0.5);
    setCards(sh);setIdx(0);setStep(0);setDone(false);
    setScores({mv:0,pb:0,mvTot:0,pbTot:0});setSelfMv(null);setSelfPb(null);
    setChosen(null);setShowAns(false);
  };
  useEffect(()=>{buildCards();},[mode]);

  const buildChoices=card=>{
    const others=TEXTES.filter(t=>t.id!==card.id).sort(()=>Math.random()-0.5).slice(0,3);
    const all=[card,...others].sort(()=>Math.random()-0.5);
    setChoices(all);setChosen(null);setShowAns(false);
  };
  useEffect(()=>{
    if(mode==='inverse'&&cards[idx])buildChoices(cards[idx]);
  },[idx,mode,cards]);

  const next=()=>{
    if(idx+1>=cards.length){setDone(true);}
    else{setIdx(i=>i+1);setStep(0);setSelfMv(null);setSelfPb(null);setChosen(null);setShowAns(false);}
  };
  const handleMv=knew=>{setSelfMv(knew);setScores(s=>({...s,mv:s.mv+(knew?1:0),mvTot:s.mvTot+1}));setStep(2);};
  const handlePb=knew=>{setSelfPb(knew);setScores(s=>({...s,pb:s.pb+(knew?1:0),pbTot:s.pbTot+1}));};
  const handleChoice=c=>{
    setChosen(c);setShowAns(true);
    if(c.id===cards[idx].id)setScores(s=>({...s,mv:s.mv+1,mvTot:s.mvTot+1}));
    else setScores(s=>({...s,mvTot:s.mvTot+1}));
  };

  if(done) return(
    <div>
      <div style={s.card}>
        <div style={{textAlign:'center',padding:'1rem 0'}}>
          <p style={{fontSize:32}}>üéâ</p>
          <p style={{fontSize:20,fontWeight:600,marginBottom:'1.5rem'}}>Session termin√©e !</p>
          <div style={{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap',marginBottom:'1.5rem'}}>
            <div style={{background:'#eafaf1',border:'1px solid #27ae6040',borderRadius:12,padding:'1rem 1.5rem',textAlign:'center'}}>
              <p style={{fontSize:28,fontWeight:600,color:'#27ae60',margin:0}}>{scores.mv}/{scores.mvTot}</p>
              <p style={{fontSize:12,color:'#555',margin:0}}>{mode==='inverse'?'Textes reconnus':'Mouvements sus'}</p>
            </div>
            {mode==='normal'&&(
              <div style={{background:'#eaf2fb',border:'1px solid #2980b940',borderRadius:12,padding:'1rem 1.5rem',textAlign:'center'}}>
                <p style={{fontSize:28,fontWeight:600,color:'#2980b9',margin:0}}>{scores.pb}/{scores.pbTot}</p>
                <p style={{fontSize:12,color:'#555',margin:0}}>Probl√©matiques sues</p>
              </div>
            )}
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
            <button onClick={buildCards} style={{...s.btn,background:'#1a1a18',color:'#fff',border:'none'}}>üîÑ Recommencer</button>
            <button onClick={onBack} style={s.btn}>‚Üê Accueil</button>
          </div>
        </div>
      </div>
    </div>
  );

  const card=cards[idx];
  if(!card)return null;
  const objetCoul=OBJETS.find(o=>o.id===card.objet)?.c||'#1a1a18';
  const total=cards.length;

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
        <button onClick={onBack} style={{...s.btn,fontSize:12}}>‚Üê Retour</button>
        <span style={{fontSize:12,color:'#888'}}>Carte {idx+1} / {total}</span>
      </div>

      <div style={{display:'flex',gap:0,marginBottom:'1rem',background:'#f0ede8',borderRadius:8,padding:3}}>
        <button onClick={()=>setMode('normal')} style={{flex:1,padding:'6px 4px',fontSize:12,fontWeight:mode==='normal'?600:400,background:mode==='normal'?'white':'transparent',border:'none',borderRadius:6,color:mode==='normal'?'#1a1a18':'#888',boxShadow:mode==='normal'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          üìñ Texte ‚Üí mouvements
        </button>
        <button onClick={()=>setMode('inverse')} style={{flex:1,padding:'6px 4px',fontSize:12,fontWeight:mode==='inverse'?600:400,background:mode==='inverse'?'white':'transparent',border:'none',borderRadius:6,color:mode==='inverse'?'#1a1a18':'#888',boxShadow:mode==='inverse'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          üîÄ Mouvements ‚Üí texte
        </button>
      </div>

      <div style={{height:4,background:'#eee',borderRadius:4,marginBottom:'1.25rem'}}>
        <div style={{height:4,background:objetCoul,borderRadius:4,width:`${((idx)/total)*100}%`,transition:'width 0.3s'}}/>
      </div>

      {mode==='inverse'&&(
        <div style={s.card}>
          <div style={{marginBottom:'1rem'}}>
            <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>üîÄ Mode inverse</span>
            <p style={{fontSize:14,fontWeight:600,margin:'4px 0 2px'}}>Reconnais le texte √† partir de ses mouvements</p>
          </div>
          <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.85rem 1rem',marginBottom:'1rem'}}>
            <p style={{fontSize:11,fontWeight:600,color:'#888',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Les mouvements :</p>
            {card.etapes.map((e,i)=>(
              <div key={i} style={{display:'flex',gap:10,marginBottom:6,alignItems:'flex-start'}}>
                <span style={{background:objetCoul,color:'white',borderRadius:12,padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>{e.label}</span>
                <span style={{fontSize:13,lineHeight:1.5}}>{e.titre}</span>
              </div>
            ))}
          </div>
          <p style={{fontSize:13,color:'#555',marginBottom:'0.75rem',fontWeight:500}}>√Ä quel texte correspondent ces mouvements ?</p>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:'1rem'}}>
            {choices.map((c,i)=>{
              const isCorrect=c.id===card.id;
              const isChosen=chosen?.id===c.id;
              let bg='#fff',bc='#ddd',col='#1a1a18';
              if(showAns){
                if(isCorrect){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}
                else if(isChosen){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}
              }
              return(
                <button key={i} onClick={()=>!showAns&&handleChoice(c)}
                  style={{textAlign:'left',padding:'10px 14px',borderRadius:8,border:`1px solid ${bc}`,background:bg,color:col,cursor:showAns?'default':'pointer',fontSize:13,lineHeight:1.4}}>
                  <span style={{fontSize:10,fontWeight:600,color:showAns&&isCorrect?'#27ae60':objetCoul,textTransform:'uppercase',marginRight:6}}>{c.numero}</span>
                  {c.auteur}, <em>{c.titre}</em>
                  {showAns&&isCorrect&&<span style={{float:'right'}}>‚úÖ</span>}
                  {showAns&&isChosen&&!isCorrect&&<span style={{float:'right'}}>‚ùå</span>}
                </button>
              );
            })}
          </div>
          {showAns&&(
            <div>
              {chosen?.id===card.id
                ?<p style={{fontSize:13,color:'#27ae60',fontWeight:600,marginBottom:'0.75rem'}}>Bravo ! Tu as reconnu le texte üéâ</p>
                :<p style={{fontSize:13,color:'#e74c3c',marginBottom:'0.75rem'}}>C'√©tait <strong>{card.numero} ‚Äî {card.titre}</strong> ({card.auteur})</p>
              }
              <button onClick={next} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:500}}>
                {idx+1>=total?'Voir le r√©sultat':'Carte suivante ‚Üí'}
              </button>
            </div>
          )}
        </div>
      )}

      {mode==='normal'&&(
      <div style={s.card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',gap:8,flexWrap:'wrap'}}>
          <div>
            <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>{card.numero}</span>
            <p style={{fontSize:16,fontWeight:600,margin:'2px 0'}}>{card.titre}</p>

function tirageSujet(pool,mode,exclude){
  let f=mode==='all'?pool:pool.filter(x=>x.type===mode);
  if(!f.length)f=pool;
  let cand=f.filter(x=>x!==exclude);
  if(!cand.length)cand=f;
  return cand[Math.floor(Math.random()*cand.length)];
}

function QuiParle(){
  const N=10;
  const [phase,setPhase]=useState('intro');
  const [deck,setDeck]=useState([]);
  const [i,setI]=useState(0);
  const [ans,setAns]=useState(null);
  const [score,setScore]=useState(0);
  const [streak,setStreak]=useState(0);
  const [best,setBest]=useState(0);
  const [misses,setMisses]=useState([]);
  const q=deck[i];

  const start=()=>{
    setDeck([...QUI_PARLE].sort(()=>Math.random()-0.5).slice(0,N));
    setI(0);setAns(null);setScore(0);setStreak(0);setBest(0);setMisses([]);setPhase('play');
  };
  const answer=p=>{
    if(ans!==null||!q)return;
    setAns(p);
    if(p===q.p){const n=streak+1;setScore(x=>x+1);setStreak(n);setBest(b=>Math.max(b,n));}
    else{setStreak(0);setMisses(m=>[...m,q]);}
  };
  const next=()=>{if(i+1>=deck.length)setPhase('end');else{setI(i+1);setAns(null);}};

  useEffect(()=>{
    if(phase!=='play')return;
    const onKey=e=>{
      if(e.key==='1')answer(1);
      else if(e.key==='2')answer(2);
      else if(e.key==='Enter'&&ans!==null){e.preventDefault();next();}
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  });

  if(phase==='intro') return(
    <div className="b" style={{background:'var(--lilac)',textAlign:'center',padding:'2.25rem 1.25rem'}}>

    const stars=score>=9?3:score>=7?2:score>=5?1:0;

          <p style={{fontWeight:600}}>{mot}</p>
          {best>=3&&<p style={{fontSize:13,marginTop:6}}>üî• Meilleure s√©rie : {best} bonnes r√©ponses d'affil√©e</p>}
          <button onClick={start} style={{...s.btn,marginTop:16,background:'var(--ink)',color:'#fff'}}>üîÑ Rejouer</button>
        </div>
        {misses.length>0&&(
          <div className="b" style={{background:'var(--surface)',marginTop:16}}>
            <span className="kicker" style={{background:'var(--pink)'}}>√Ä revoir</span>
            <ul style={{listStyle:'none',marginTop:12,display:'flex',flexDirection:'column',gap:12}}>
              {misses.map((m,k)=>(
                <li key={k} style={{borderTop:k?'1px solid var(--line)':'none',paddingTop:k?12:0}}>
                  <p style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:16}}>¬´ {m.t} ¬ª <strong style={{fontFamily:'var(--sans)',fontStyle:'normal'}}>: H{m.p}</strong></p>
                  <p style={{fontSize:13.5,color:'var(--muted)',marginTop:3,lineHeight:1.55}}>{m.ex}</p>
                </li>
              ))}
            </ul>
          </div>
        )}
      </div>
    );
  }

  const ok=ans!==null&&ans===q.p;
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,gap:8,flexWrap:'wrap'}}>
        <span className="chip">R√©plique {i+1} / {deck.length}</span>
        <span style={{display:'flex',gap:8}}>
          {streak>=2&&<span className="chip pop" key={streak} style={{background:'var(--coral)'}}>üî• {streak} d'affil√©e</span>}
          <span className="chip" style={{background:'var(--yellow)'}}>Score : {score}</span>
        </span>
      </div>
      <div style={{height:10,border:'2px solid var(--ink)',borderRadius:999,background:'#fff',overflow:'hidden',marginBottom:16}}>
        <div style={{height:'100%',width:`${((i+(ans!==null?1:0))/deck.length)*100}%`,background:'var(--violet)',transition:'width .3s'}}/>
      </div>
      <div className="b" style={{background:'var(--surface)',padding:'2rem 1.5rem',textAlign:'center'}}>
        <span className="kicker" style={{background:'var(--lilac)'}}>Qui parle ?</span>

function OrdrePiece(){

    setNiveau(nv);setPool(sh);setPlaced([]);setChecked(false);

  const nbOk=placed.filter((e,k)=>e.id===expected[k]).length;

      </div>

      {checked&&(
        <div className={'b fade'+(nbOk===items.length?'':' shake')} style={{background:nbOk===items.length?'var(--mint)':'var(--pink)',textAlign:'center',marginBottom:16}}>

          <p style={{fontWeight:600}}>{nbOk===items.length?'Parfait, tu connais la pi√®ce sur le bout des doigts !':'Les √©tapes en rouge ne sont pas √† leur place. Regarde l\'indication, puis r√©essaie.'}</p>
          <button onClick={()=>start(niveau)} style={{...s.btn,marginTop:14,background:'var(--ink)',color:'#fff'}}>üîÑ Nouvelle partie</button>
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,alignItems:'start'}}>
        {!checked&&(
          <div className="b" style={{background:'var(--sky)'}}>
            <span className="kicker">√âtapes √† placer</span>
            <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
              {pool.map(e=>(
                <button key={e.id} className="fade" onClick={()=>place(e)} style={{textAlign:'left',padding:'11px 13px',fontSize:14,lineHeight:1.45,border:'2px solid var(--ink)',borderRadius:14,background:'#fff',boxShadow:'2px 2px 0 var(--ink)'}}>{e.t}</button>

          <ol style={{listStyle:'none',display:'flex',flexDirection:'column',gap:10,marginTop:14}}>
