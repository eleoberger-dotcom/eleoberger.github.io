/* ── GLOSSAIRE DES FIGURES DE STYLE ─────────────────────────────────────── */
const GLOSSAIRE={
  "anaphore":"Répétition d'un même mot ou groupe en tête de plusieurs phrases ou vers consécutifs. Effet : insistance, martèlement, amplification.",
  "épiphore":"Répétition d'un mot ou groupe en fin de plusieurs groupes successifs. Effet : clôture, insistance finale.",
  "épizeuxe":"Répétition immédiate d'un mot, sans autre mot intercalé (ex. : « Vite, vite ! »). Effet : urgence, intensité.",
  "chiasme":"Figure de construction en miroir : A B / B A (ex. : « Il faut manger pour vivre, non vivre pour manger »). Effet : balance, mise en relief.",
  "parallélisme":"Répétition d'une même structure syntaxique. Effet : symétrie, amplification rythmique.",
  "gradation":"Succession de termes en progression croissante ou décroissante. Effet : amplification ou atténuation progressive.",
  "accumulation":"Juxtaposition de plusieurs éléments de même nature sans hiérarchie. Effet : profusion, débordement.",
  "énumération":"Liste d'éléments de même nature séparés par des virgules ou conjonctions. Effet : exhaustivité ou profusion.",
  "métaphore":"Comparaison implicite sans outil comparatif (comme, tel que). Rapproche deux réalités par analogie. Effet : image frappante.",
  "comparaison":"Mise en relation de deux éléments à l'aide d'un outil comparatif (comme, tel, pareil à). Effet : illustration, clarification.",
  "métonymie":"Désignation d'une chose par un terme qui lui est logiquement lié (contenant pour contenu, cause pour effet…). Effet : condensation, élargissement.",
  "synecdoque":"Désignation d'un tout par une partie, ou d'une partie par le tout (ex. : « les voiles » pour les bateaux). Effet : condensation, symbolisation.",
  "prosopopée":"Attribution de la parole ou de qualités humaines à un être absent, mort ou inanimé. Effet : personnification dramatique.",
  "personnification":"Attribution de traits humains à un être non humain ou à un objet. Effet : animation, vivification.",
  "litote":"Atténuation : dire moins pour suggérer davantage (ex. : « ce n'est pas sans importance »). Effet : intensification par l'understatement.",
  "hyperbole":"Exagération volontaire qui force l'expression d'une idée. Effet : dramatisation, emphase.",
  "antithèse":"Opposition de deux termes ou idées contraires dans une même structure. Effet : contraste saisissant, mise en relief.",
  "oxymore":"Association de deux termes contradictoires dans un même groupe (ex. : « bourreau tranquille »). Effet : paradoxe, tension.",
  "antiphrase":"Dire le contraire de ce que l'on pense pour faire comprendre le sens réel (ironie). Effet : ironie mordante.",
  "ironie":"Dire le contraire de ce qu'on pense, de sorte que le lecteur comprend le sens réel. Effet : distanciation critique.",
  "euphémisme":"Atténuation d'une réalité dure ou choquante par une formulation adoucie. Effet : pudeur, déni.",
  "périphrase":"Remplacement d'un mot par un groupe de mots équivalents. Effet : emphase, contournement, mise en relief.",
  "apostrophe":"Interpellation directe d'un être (présent, absent ou inanimé) dans le discours. Effet : dramatisation, implication.",
  "question rhétorique":"Question qui n'attend pas de réponse car la réponse est implicite et évidente. Effet : implication du lecteur, force argumentative.",
  "aposiopèse":"Interruption brusque de la phrase, marquée par des points de suspension. Effet : suspension, parole qui se cherche ou se brise.",
  "épanorthose":"Reprise ou correction de ce qu'on vient de dire (ex. : « … ou plutôt… »). Effet : nuance, ajustement de la pensée.",
  "stichomythie":"Échange de répliques très courtes entre deux personnages. Effet au théâtre : tension, duel verbal, rapidité.",
  "didascalie":"Indication scénique de l'auteur (décor, jeu d'acteur, déplacements). Peut être externe ou interne au dialogue.",
  "prolepse":"Anticipation par le narrateur sur ce qui va se passer. Effet : tension dramatique, sentiment d'inéluctabilité.",
  "analepse":"Retour en arrière dans le récit (flash-back). Effet : mise en perspective, explication rétrospective.",
  "ellipse":"Saut d'une période temporelle non racontée. Effet : accélération du récit, concentration sur l'essentiel.",
  "in medias res":"Début du récit au milieu de l'action, sans exposition préalable. Effet : immersion immédiate.",
  "discours indirect libre":"Fusion de la voix du narrateur et du personnage, sans guillemets ni verbe introducteur. Effet : accès à la subjectivité du personnage.",
  "focalisation interne":"Le récit est filtré par le point de vue d'un seul personnage. Effet : identification, subjectivité.",
  "asyndète":"Suppression des mots de liaison (conjonctions) entre des propositions. Effet : rapidité, parataxe, juxtaposition sèche.",
  "parataxe":"Juxtaposition de propositions sans mot de liaison. Effet : neutralité apparente, accumulation.",
  "allitération":"Répétition d'un son consonantique. Effet : musicalité, expressivité sonore.",
  "assonance":"Répétition d'un son vocalique. Effet : harmonie, résonance.",
  "enjambement":"Passage d'un vers à l'autre sans pause syntaxique. Effet : fluidité, tension entre forme et sens.",
  "rejet":"Report en début du vers suivant d'un élément syntaxiquement lié au vers précédent. Effet : mise en relief.",
  "contre-rejet":"Report en fin de vers d'un élément qui introduit le vers suivant. Effet : suspension, anticipation.",
  "monostiche":"Vers isolé, formant à lui seul une strophe ou un poème. Effet : concentration, silence autour du vers.",
  "concession":"En argumentation : accord partiel avec l'adversaire pour mieux le réfuter ensuite. Effet : nuance, crédibilité.",
  "exemplum":"Illustration d'une thèse par un exemple historique, mythologique ou littéraire. Effet : preuve par le cas particulier.",
  "maxime":"Formule brève et frappante énonçant une vérité générale ou une règle de conduite.",
  "apologue":"Court récit qui illustre une morale ou une leçon (fable, parabole). Forme : narration + morale.",
  "tropisme":"Chez Sarraute : mouvement intérieur inconscient qui affleure sous la conversation ordinaire.",
  "sous-conversation":"Chez Sarraute : flux intérieur inavoué qui coule sous la conversation apparente.",
};

// Détecte et rend cliquables les figures dans un texte de procédé
function ProcedéText({text, onTermClick}){
  const terms=Object.keys(GLOSSAIRE);
  const lower=text.toLowerCase();
  let bestIdx=Infinity, bestTerm=null, bestLen=0;
  terms.forEach(t=>{
    const idx=lower.indexOf(t.toLowerCase());
    if(idx>=0 && (idx<bestIdx || (idx===bestIdx && t.length>bestLen))){
      bestIdx=idx; bestTerm=t; bestLen=t.length;
    }
  });
  if(!bestTerm || bestIdx===Infinity) return <span>{text}</span>;
  const before=text.slice(0,bestIdx);
  const matched=text.slice(bestIdx,bestIdx+bestTerm.length);
  const after=text.slice(bestIdx+bestTerm.length);
  return(
    <span>
      {before}
      <span onClick={()=>onTermClick(bestTerm)} style={{textDecoration:'underline dotted',cursor:'pointer',color:'inherit',fontWeight:600}}>
        {matched}
      </span>
      <ProcedéText text={after} onTermClick={onTermClick}/>
    </span>
  );
}

/* ── AUDIO (MP3 placé à côté d'index.html) ──────────────────────────────── */
function createAudio(type){
  const sources={sarraute:'sarraute.mp3'};
  const src=sources[type];
  if(!src)return {stop:()=>{},onError:()=>{}};
  const audio=new Audio(src);
  audio.loop=true;
  audio.volume=0.4;
  let errorCb=null;
  audio.addEventListener('error',()=>{
    const code=audio.error?.code;
    let msg='Erreur audio';
    if(code===4) msg=`Fichier "${src}" introuvable sur le serveur.`;
    else if(code===2) msg='Erreur réseau au chargement.';
    else if(code===3) msg='Erreur de décodage du fichier.';
    else if(code===1) msg='Chargement interrompu.';
    if(errorCb) errorCb(msg);
  });
  audio.play().catch(e=>{if(errorCb) errorCb('Lecture refusée : '+e.message);});
  return {
    stop:()=>{audio.pause();audio.src='';},
    onError:cb=>{errorCb=cb;}
  };
}

  {titre:"Les classes grammaticales",items:["Nom (propre / commun) — varie en genre et en nombre","Déterminant — devant le nom : articles définis (le, la, les), indéfinis (un, une, des), partitifs (du, de la), possessifs (mon, ton…), démonstratifs (ce, cette…), indéfinis (chaque, aucun…)","Adjectif — précise le sens d'un nom ; varie en genre et en nombre","Pronom — remplace un nom : personnel, possessif, démonstratif, indéfini, interrogatif, relatif","Verbe — varie en personne, nombre, temps, mode, voix","Adverbe (invariable) — précise un verbe, un adjectif, un autre adverbe","Préposition (invariable) — introduit un GN, pronom, infinitif : à, de, par, pour, sans, en, vers, sous…","Conjonction de coordination : mais, ou, et, donc, or, ni, car","Conjonction de subordination — introduit une subordonnée : que, quand, si, parce que, bien que…"]},

  const [lastId,setLastId]=useState('accueil');
  const [showAll,setShowAll]=useState(false);
  const boxRef=useRef(null);
  const timer=useRef(null);

  const asked=new Set(msgs.filter(m=>m.from==='e').map(m=>m.id));

  useEffect(()=>{
    const b=boxRef.current;
    if(b)b.scrollTop=b.scrollHeight;
  },[msgs,typing]);
  useEffect(()=>()=>clearTimeout(timer.current),[]);

  const ask=id=>{
    if(typing)return;
    setShowAll(false);
    setMsgs(m=>[...m,{from:'e',id}]);
    setTyping(true);
    timer.current=setTimeout(()=>{
      setMsgs(m=>[...m,{from:'s',id}]);
      setTyping(false);
      setLastId(id);
    },650+Math.random()*500);
  };
  const reset=()=>{clearTimeout(timer.current);setTyping(false);setMsgs(init());setLastId('accueil');setShowAll(false);};

  let suggestions=(SARRAUTE_QR[lastId].suite||[]).filter(id=>!asked.has(id));
  if(suggestions.length===0)suggestions=Object.keys(SARRAUTE_QR).filter(id=>id!=='accueil'&&!asked.has(id)).slice(0,3);
  const toutVu=Object.keys(SARRAUTE_QR).filter(id=>id!=='accueil').every(id=>asked.has(id));

  const chip=(id,dim)=>(
    <button key={id} onClick={()=>ask(id)} disabled={typing}
      style={{padding:'8px 12px',fontSize:13,borderRadius:18,border:`1px solid ${dim?'#ddd':C+'70'}`,background:dim?'#f5f4f0':'#fff',color:dim?'#999':C,cursor:typing?'default':'pointer',textAlign:'left',lineHeight:1.35,minHeight:38}}>
      {dim&&'✓ '}{SARRAUTE_QR[id].q}
    </button>
  );

  return(
    <div>
      <div style={{...s.card,display:'flex',gap:14,alignItems:'center',marginBottom:'0.75rem',background:C+'0d',borderColor:C+'40'}}>
        <SarrauteAvatar size={56}/>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontSize:16,fontWeight:600,margin:0}}>Nathalie Sarraute</p>
          <p style={{fontSize:12,color:'#777',margin:'2px 0 0'}}>1900–1999 · autrice de <em>Pour un oui ou pour un non</em></p>
        </div>
        <button onClick={reset} style={{...s.btn,fontSize:11,padding:'5px 10px'}}>↺ Recommencer</button>
      </div>
      <p style={{fontSize:11.5,color:'#999',lineHeight:1.5,margin:'0 0 0.75rem',fontStyle:'italic'}}>
        Nathalie Sarraute est morte en 1999 : ses réponses sont imaginées pour ce site, à partir de ses œuvres et de ce qu'elle a dit de son travail. Ne les cite pas comme de vraies paroles d'elle à l'oral !
      </p>

      <div ref={boxRef} style={{...s.card,padding:'1rem',height:'min(460px, 60vh)',overflowY:'auto',display:'flex',flexDirection:'column',gap:10,background:'#fbfaf8'}}>
        {msgs.map((m,i)=>{
          const d=SARRAUTE_QR[m.id];
          if(m.from==='e') return(
            <div key={i} className="fade" style={{alignSelf:'flex-end',maxWidth:'82%',background:'#1a1a18',color:'#fff',padding:'8px 12px',borderRadius:'14px 14px 4px 14px',fontSize:14,lineHeight:1.5}}>{d.q}</div>
          );
          return(
            <div key={i} className="fade" style={{display:'flex',gap:8,alignItems:'flex-end',maxWidth:'92%'}}>
              <SarrauteAvatar size={30}/>
              <div style={{background:'#fff',border:`0.5px solid ${C}40`,padding:'10px 13px',borderRadius:'14px 14px 14px 4px',fontSize:14,lineHeight:1.65,color:'#2a2a28'}}>
                {d.r.map((p,k)=><p key={k} style={{margin:k?'8px 0 0':0}}>{p}</p>)}
                {d.defi&&(
                  <p style={{margin:'10px 0 0',padding:'7px 10px',background:'#fffaf0',borderLeft:'2px solid #e67e22',borderRadius:'0 6px 6px 0',fontSize:13,color:'#7d4f10'}}>
                    <strong>À toi :</strong> {d.defi}
                  </p>
                )}
              </div>
            </div>
          );
        })}
        {typing&&(
          <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
            <SarrauteAvatar size={30}/>
            <div style={{background:'#fff',border:`0.5px solid ${C}40`,padding:'10px 14px',borderRadius:'14px 14px 14px 4px'}}>
              <span className="dot"/><span className="dot"/><span className="dot"/>
            </div>
          </div>
        )}
      </div>

      <div style={{marginTop:'0.75rem'}}>
        {toutVu?(
          <p style={{fontSize:13,color:C,fontWeight:500,margin:'0 0 8px'}}>Vous m'avez tout demandé… Relisez maintenant votre EL 2 : vous n'entendrez plus les points de suspension de la même manière.</p>
        ):(
          <>
            <span style={s.label}>Pose-lui une question</span>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:4}}>
              {suggestions.map(id=>chip(id,false))}
            </div>
          </>
        )}
        <button onClick={()=>setShowAll(v=>!v)} style={{...s.btn,marginTop:10,fontSize:12,width:'100%',textAlign:'left'}}>
          📋 Toutes les questions ({asked.size}/{Object.keys(SARRAUTE_QR).length-1}) {showAll?'▲':'▼'}
        </button>
        {showAll&&(
          <div className="fade" style={{marginTop:8,display:'flex',flexDirection:'column',gap:12}}>
            {SARRAUTE_THEMES.map(t=>(
              <div key={t.titre}>
                <span style={{...s.label,color:C}}>{t.titre}</span>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{t.ids.map(id=>chip(id,asked.has(id)))}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── COMPOSANT : ENTRETIEN (2e partie de l'oral) ────────────────────────── */
function Entretien(){
  const canvasRef=useRef();
  const [spinning,setSpinning]=useState(false);
  const [question,setQuestion]=useState(null);
  const [reponse,setReponse]=useState('');
  const [tipsOpen,setTipsOpen]=useState(false);
  const [posees,setPosees]=useState([]);
  const angleRef=useRef(0);
  const animRef=useRef();
  const oeuvre={c:'#5b3cc4',info:OBJETS_INFO.theatre};

  const N=QUESTIONS_ORAL.length;
  const colors=['#5b3cc4','#27ae60','#e67e22','#2980b9','#c0392b','#16a085','#d35400','#7f8c8d'];

  const draw=useCallback((angle)=>{
    const c=canvasRef.current;if(!c)return;
    const ctx=c.getContext('2d');
    const cx=c.width/2,cy=c.height/2,r=cy-4;
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<N;i++){
      const a=angle+i*(2*Math.PI/N);
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,a,a+2*Math.PI/N);
      ctx.fillStyle=colors[i%colors.length];ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(cx+r-4,cy);ctx.lineTo(cx+r+12,cy-8);ctx.lineTo(cx+r+12,cy+8);
    ctx.fillStyle='#1a1a18';ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy,18,0,2*Math.PI);
    ctx.fillStyle='#fff';ctx.fill();
    ctx.font='bold 11px system-ui';ctx.fillStyle='#1a1a18';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🎯',cx,cy);
  },[N]);

  useEffect(()=>{draw(0);},[draw]);

  const spin=()=>{
    if(spinning)return;
    setSpinning(true);setQuestion(null);setReponse('');
    const extra=4*Math.PI+Math.random()*4*Math.PI;
    const start=performance.now();
    const dur=3000+Math.random()*1000;
    const startA=angleRef.current;
    const animate=now=>{
      const t=Math.min((now-start)/dur,1);
      const ease=1-Math.pow(1-t,3);
      const a=startA+extra*ease;
      angleRef.current=a%(2*Math.PI);
      draw(angleRef.current);
      if(t<1){animRef.current=requestAnimationFrame(animate);}
      else{
        setSpinning(false);
        const normalized=((2*Math.PI-angleRef.current)%(2*Math.PI));
        const idx=Math.floor(normalized/(2*Math.PI/N))%N;
        const q=QUESTIONS_ORAL[idx];
        setQuestion(q);
        setPosees(p=>p.includes(q)?p:[...p,q]);
      }
    };
    animRef.current=requestAnimationFrame(animate);
  };

  useEffect(()=>()=>{cancelAnimationFrame(animRef.current);},[]);

  return(
    <div>
      <div style={{...s.card,marginBottom:'1rem',background:'#fffaf0',borderColor:'#f4d8a4'}}>
        <p style={{fontSize:13,lineHeight:1.7,color:'#7d4f10',margin:0}}>
          <strong>L'entretien (≈ 8 min)</strong> commence par la question de grammaire (2–3 min), puis un échange avec le jury sur l'œuvre choisie et le parcours (5–6 min).
        </p>
      </div>

      <div style={{...s.card,marginBottom:'1rem',padding:'0.85rem 1rem',borderColor:oeuvre.c+'60',background:oeuvre.c+'0d'}}>
        <span style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.05em',color:oeuvre.c,fontWeight:600}}>Œuvre travaillée</span>
        <p style={{fontSize:14,margin:'2px 0 0'}}>{oeuvre.info.auteur}, <em>{oeuvre.info.oeuvre}</em></p>
      </div>

      <button onClick={()=>setTipsOpen(o=>!o)} style={{...s.btn,marginBottom:'1rem',width:'100%',textAlign:'left',fontSize:13}}>
        💡 Conseils pour la présentation de l'œuvre (2–3 min) {tipsOpen?'▲':'▼'}
      </button>
      {tipsOpen&&(
        <div className="fade" style={{...s.card,marginBottom:'1rem',background:'#f0f4ff',borderColor:'#c3cfe2'}}>
          <p style={{fontSize:12,fontWeight:600,color:'#1a5276',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>✅ Une présentation efficace</p>
          <ul style={{margin:'0 0 12px 16px',fontSize:13,lineHeight:1.75,color:'#1a1a18'}}>
            <li>Une présentation <em>personnelle</em>, justifiée par des références précises à l'œuvre</li>
            <li>Caractéristiques principales (auteur, titre, genre, époque, sujet)</li>
            <li>Intérêt et particularités de l'œuvre</li>
            <li>Avis argumenté + étayé par des références</li>
          </ul>
          <p style={{fontSize:12,fontWeight:600,color:'#a93226',marginBottom:8,textTransform:'uppercase',letterSpacing:'0.05em'}}>❌ Ce qu'il ne faut pas faire</p>
          <ul style={{margin:'0 0 12px 16px',fontSize:13,lineHeight:1.75,color:'#1a1a18'}}>
            <li>La récitation d'une fiche de lecture impersonnelle</li>
            <li>La récitation d'un cours</li>
            <li>Un résumé complet de l'intrigue</li>
          </ul>
          <p style={{fontSize:12,fontWeight:600,color:'#1a5276',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Adjectifs utiles</p>
          <p style={{fontSize:12,color:'#555',lineHeight:1.7,fontStyle:'italic'}}>comique · réaliste · vivant · poétique · critique · ironique · parodique · pathétique · lyrique · engagé · universel · ambigu · bouleversant · dépaysant · actuel</p>
        </div>
      )}

      <div style={{marginBottom:'0.75rem'}}>
        <span style={s.label}>Lance la roue pour t'entraîner aux questions du jury</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'1rem',marginBottom:'1.25rem'}}>
        <canvas ref={canvasRef} width={260} height={260} style={{borderRadius:'50%',boxShadow:'0 2px 12px rgba(0,0,0,0.15)'}}/>
        <button onClick={spin} disabled={spinning} style={{...s.btn,background:spinning?'#ccc':'#1a1a18',color:'#fff',border:'none',padding:'10px 28px',fontSize:14,fontWeight:600}}>
          {spinning?'La roue tourne…':'🎯 Lancer la roue'}
        </button>
        {posees.length>0&&<p style={{fontSize:11,color:'#888'}}>{posees.length} / {N} questions déjà tirées</p>}
      </div>

      {question&&(
        <div className="fade" style={s.card}>
          <p style={{fontSize:11,textTransform:'uppercase',letterSpacing:'0.08em',color:oeuvre.c,marginBottom:8,fontWeight:600}}>
            Question tirée au sort — sur {oeuvre.info.oeuvre}
          </p>
          <p style={{fontSize:16,fontWeight:500,lineHeight:1.6,marginBottom:'1rem',color:'#1a1a18'}}>« {question} »</p>
          <label style={s.label}>Ta réponse (un paragraphe argumenté avec exemples précis)</label>
          <textarea value={reponse} onChange={e=>setReponse(e.target.value)} placeholder={`Réponds en t'appuyant sur des exemples précis tirés de ${oeuvre.info.oeuvre}…`} style={{minHeight:140}}/>
          {reponse.length>20&&<p style={{fontSize:12,color:'#888',marginTop:6}}>{reponse.length} caractères — relis-toi à voix haute avant de passer à la suivante.</p>}
          <button onClick={()=>{setQuestion(null);setReponse('');}} style={{...s.btn,marginTop:'0.75rem',fontSize:12}}>Nouvelle question →</button>
        </div>
      )}

      {posees.length>=5&&(
        <details style={{marginTop:'1rem'}}>
          <summary style={{cursor:'pointer',fontSize:12,color:'#888',padding:'8px'}}>Voir les {posees.length} questions déjà tirées</summary>
          <ul style={{margin:'8px 0 0 20px',fontSize:12,color:'#666',lineHeight:1.6}}>
            {posees.map((q,i)=><li key={i}>{q}</li>)}
          </ul>
        </details>
      )}
    </div>
  );
}

/* ── COMPOSANT : QUIZ GÉNÉRIQUE ─────────────────────────────────────────── */
function shuffleOpts(q){
  if(!q||!q.o)return null;
  const idxs=q.o.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
  }
  return {opts:idxs.map(i=>q.o[i]),r:idxs.indexOf(q.r)};
}

function QuizGeneric({data,niveaux,objetId}){
  const firstNiv=niveaux[0][0];
  const [niv,setNiv]=useState(firstNiv);
  const [qi,setQi]=useState(0);
  const [score,setScore]=useState(0);
  const [ans,setAns]=useState(null);
  const [rep,setRep]=useState('');
  const [done,setDone]=useState(false);
  const [showEx,setShowEx]=useState(false);
  const [shuffled,setShuffled]=useState(null);

  const n=data[niv]||{questions:[]};
  const q=n.questions[qi];

  useEffect(()=>{setShuffled(q&&q.o?shuffleOpts(q):null);},[qi,niv]);

  const opts=shuffled?shuffled.opts:q?.o;
  const correctIdx=shuffled!==null?shuffled.r:q?.r;

  const changeNiv=v=>{setNiv(v);setQi(0);setScore(0);setAns(null);setRep('');setDone(false);setShowEx(false);};
  const handleQCM=i=>{if(ans!==null)return;setAns(i);if(i===correctIdx)setScore(s=>s+1);};
  const nextQ=()=>{setQi(q=>q+1);setAns(null);setRep('');setShowEx(false);};
  const nextDone=()=>{
    setDone(true);
    if(objetId){
      try{
        const p=JSON.parse(localStorage.getItem('quiz_progress')||'{}');
        if(!p[objetId])p[objetId]={};
        p[objetId][niv]=true;
        localStorage.setItem('quiz_progress',JSON.stringify(p));
      }catch(e){}
    }
  };
  const reset=()=>{setQi(0);setScore(0);setAns(null);setRep('');setDone(false);setShowEx(false);};

  if(!n.questions.length)return<div style={s.card}><p style={{fontSize:13,color:'#888'}}>Quiz à venir.</p></div>;

  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:'1rem',flexWrap:'wrap'}}>
        {niveaux.map(([k])=>data[k]&&<button key={k} onClick={()=>changeNiv(k)} style={s.lvl(niv===k,data[k].c)}>{data[k].label}</button>)}
      </div>
      <div style={s.card}>
        {!done?(
          <>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.75rem'}}>
              <span style={{fontSize:12,color:'#888'}}>Question {qi+1} / {n.questions.length}</span>
              <span style={{fontSize:12,color:'#888'}}>Score : {score}</span>
            </div>
            <div style={{background:'#f5f4f0',borderRadius:8,padding:'0.75rem 1rem',marginBottom:'1rem'}}>
              <p style={{fontSize:15,fontWeight:500,lineHeight:1.5}}>{q.q}</p>
            </div>
            {opts?(
              <>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {opts.map((opt,i)=>{
                    let bg='#fff',bc='#ddd',col='#1a1a18';
                    if(ans!==null){if(i===correctIdx){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}else if(i===ans){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}}
                    return<button key={i} onClick={()=>handleQCM(i)} style={{textAlign:'left',padding:'10px 14px',fontSize:14,borderRadius:8,border:`0.5px solid ${bc}`,background:bg,color:col,cursor:ans===null?'pointer':'default',lineHeight:1.5,minHeight:44}}>{opt}</button>;
                  })}
                </div>
                {ans!==null&&q.ex&&(
                  <div style={{marginTop:'0.75rem'}}>
                    <button onClick={()=>setShowEx(e=>!e)} style={{...s.btn,fontSize:12}}>{showEx?'Masquer l\'explication':'Voir l\'explication grammaticale'}</button>
                    {showEx&&<div style={{marginTop:8,padding:'0.75rem',background:'#f0f4ff',borderRadius:8,fontSize:13,lineHeight:1.7,color:'#1a5276',border:'0.5px solid #c3cfe2'}}>{q.ex}</div>}
                  </div>
                )}
                {ans!==null&&(
                  <button onClick={qi+1>=n.questions.length?nextDone:nextQ} style={{...s.btn,marginTop:'0.75rem'}}>
                    {qi+1>=n.questions.length?'Voir le résultat':'Question suivante →'}
                  </button>
                )}
              </>
            ):(
              <>
                <textarea value={rep} onChange={e=>setRep(e.target.value)} placeholder="Rédigez votre analyse grammaticale ici…"/>
                {rep.length>10&&(
                  <div style={{display:'flex',gap:8,marginTop:'0.75rem',flexWrap:'wrap'}}>
                    <button onClick={qi+1>=n.questions.length?nextDone:nextQ} style={{...s.btn,background:'#1a1a18',color:'#fff',border:'none'}}>
                      {qi+1>=n.questions.length?'Terminer':'Question suivante →'}
                    </button>
                  </div>
                )}
              </>
            )}
          </>
        ):(
          <div style={{textAlign:'center',padding:'1.5rem 0'}}>
            <p style={{fontSize:36,fontWeight:500,marginBottom:8}}>{score} / {n.questions.length}</p>
            <p style={{fontSize:14,color:'#888',marginBottom:'1.5rem'}}>{score>=n.questions.length*0.8?'Excellent travail !':score>=n.questions.length*0.6?'Bon début, continue à réviser.':'Reprends tes fiches avant de réessayer.'}</p>
            <button onClick={reset} style={s.btn}>Recommencer</button>
          </div>
        )}
      </div>
    </div>
  );
}

              <div style={{background:'#fff',border:'2px solid var(--ink)',borderRadius:14,padding:'0 14px 14px',marginTop:6}}><QuestionsBacEL key={t.id} elId={t.id}/></div>

              📐 Exercices de grammaire sur ce texte {gramOpen?'▲':'▼'}
            </button>
            {gramOpen&&<GrammaireEL questions={t.grammaire.filter(g=>g.type==='qcm')}/>}
          </div>
        </div>
      )}
    </div>
  );
}

function GrammaireEL({questions}){
  const [qi,setQi]=useState(0);
  const [ans,setAns]=useState(null);
  const [rep,setRep]=useState('');
  const [showEx,setShowEx]=useState(false);
  const [done,setDone]=useState(false);
  const q=questions[qi];

  const nextQ=()=>{setQi(i=>i+1);setAns(null);setRep('');setShowEx(false);};
  const finish=()=>setDone(true);
  const reset=()=>{setQi(0);setAns(null);setRep('');setShowEx(false);setDone(false);};

  if(done)return(
    <div style={{marginTop:'0.75rem',padding:'1rem',background:'#f0fff4',borderRadius:8,textAlign:'center'}}>
      <p style={{fontSize:14,color:'#27ae60',fontWeight:500,marginBottom:8}}>✓ Exercices terminés</p>
      <button onClick={reset} style={{...s.btn,fontSize:12}}>Recommencer</button>
    </div>
  );

  return(
    <div style={{marginTop:'0.75rem',padding:'0.75rem',background:'#f0f4ff',borderRadius:8,border:'0.5px solid #c3cfe2'}}>
      <p style={{fontSize:11,color:'#888',marginBottom:8}}>Question {qi+1} / {questions.length}</p>
      <p style={{fontSize:14,fontWeight:500,lineHeight:1.55,marginBottom:'0.75rem',color:'#1a1a18'}}>{q.q}</p>
      {q.type==='qcm'?(
        <>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {q.o.map((opt,i)=>{
              let bg='#fff',bc='#ddd',col='#1a1a18';
              if(ans!==null){if(i===q.r){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}else if(i===ans){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}}
              return<button key={i} onClick={()=>{if(ans===null)setAns(i);}} style={{textAlign:'left',padding:'8px 12px',fontSize:13,borderRadius:7,border:`0.5px solid ${bc}`,background:bg,color:col,cursor:ans===null?'pointer':'default',lineHeight:1.4}}>{opt}</button>;
            })}
          </div>
          {ans!==null&&q.ex&&(
            <div style={{marginTop:8}}>
              <button onClick={()=>setShowEx(e=>!e)} style={{...s.btn,fontSize:11}}>{showEx?'Masquer':'Voir l\'analyse grammaticale'}</button>
              {showEx&&<p style={{marginTop:8,fontSize:13,lineHeight:1.7,color:'#1a5276'}}>{q.ex}</p>}
            </div>
          )}
          {ans!==null&&(
            <button onClick={qi+1>=questions.length?finish:nextQ} style={{...s.btn,marginTop:8,fontSize:12}}>
              {qi+1>=questions.length?'Terminer':'Question suivante →'}
            </button>
          )}
        </>
      ):(
        <>
          <textarea value={rep} onChange={e=>setRep(e.target.value)} placeholder="Rédigez votre analyse grammaticale…" style={{fontSize:13,minHeight:100}}/>
          {rep.length>10&&<button onClick={qi+1>=questions.length?finish:nextQ} style={{...s.btn,marginTop:8,fontSize:12,display:'block'}}>
            {qi+1>=questions.length?'Terminer':'Question suivante →'}
          </button>}
        </>
      )}
    </div>
  );
}

function ObjetModule({objet,onBack,startTab,startGame}){
  const [tab,setTab]=useState(startTab||'cours');
  const [musicOn,setMusicOn]=useState(false);
  const [musicError,setMusicError]=useState(null);
  const musicRef=useRef(null);
  const info=OBJETS_INFO[objet.id];
  const TABS=[['cours','📖 Cours'],['jeux','🎮 Jeux'],['sarraute','💬 Parler à Sarraute'],['quiz','🎯 Quiz']];
  const niveaux=[['n1','Niveau 1'],['n2','Niveau 2'],['n3','Niveau 3']];

  const toggleMusic=()=>{
    if(musicOn){
      musicRef.current?.stop();
      musicRef.current=null;
      setMusicOn(false);
      setMusicError(null);
    } else {
      setMusicError(null);
      try{
        musicRef.current=createAudio(objet.music);
        musicRef.current.onError?.(msg=>{
          setMusicError(msg);
          setMusicOn(false);
        });
        setMusicOn(true);
      }catch(e){
        setMusicError(e.message);
      }
    }
  };
  useEffect(()=>()=>{musicRef.current?.stop();},[]);

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
        <span/>
        {objet.music&&(
          <button onClick={toggleMusic} style={{...s.btn,fontSize:12,color:musicOn?objet.c:'#888',border:`0.5px solid ${musicOn?objet.c:'#ccc'}`}}>
            {musicOn?'🔊 Musique active':'🔈 Musique'}
          </button>
        )}
      </div>
      {musicError&&(
        <div style={{background:'#fdf0ef',border:'0.5px solid #e74c3c',borderRadius:8,padding:'0.5rem 0.75rem',marginBottom:'1rem',fontSize:12,color:'#a93226',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>⚠ {musicError}</span>
          <button onClick={()=>setMusicError(null)} style={{background:'none',border:'none',color:'#a93226',cursor:'pointer',fontSize:14}}>×</button>
        </div>
      )}
      <div className="b" style={{background:'var(--violet)',color:'#fff',marginBottom:'1.25rem',display:'flex',gap:16,alignItems:'center'}}>
        <div style={{background:'var(--yellow)',border:'2px solid var(--ink)',borderRadius:'50%',padding:6,flexShrink:0}}><SarrauteAvatar size={50}/></div>
        <div style={{minWidth:0}}>
          <span className="kicker" style={{color:'var(--ink)'}}>{objet.label} · {info.date}</span>
          <h2 style={{fontSize:'clamp(24px,4vw,34px)',lineHeight:1.05,margin:'8px 0 4px'}}>{info.oeuvre}</h2>
          <p style={{fontSize:13.5,opacity:0.9}}>{info.auteur} · Parcours « {info.parcours} »</p>
        </div>
      </div>
      <div style={s.tabbar}>
        {TABS.map(([k,l])=><button key={k} style={s.tab(tab===k)} onClick={()=>setTab(k)}>{l}</button>)}
      </div>
      {tab==='cours'&&<CoursObjet info={info} c={objet.c}/>}
      {tab==='jeux'&&<JeuxPiece initial={startGame}/>}
      {tab==='sarraute'&&<DiscussionSarraute/>}
      {tab==='quiz'&&<QuizGeneric data={QUIZ_OBJETS[objet.id]} niveaux={niveaux} objetId={objet.id}/>}
    </div>
  );
}

function Grammaire(){
  const [tab,setTab]=useState('fiches');

  return(

      </div>
      {tab==='fiches'&&(
        <div>
          <p style={{fontSize:13,color:'#888',marginBottom:'1rem',lineHeight:1.6}}>Fiches de référence pour la question de grammaire — sans analyse stylistique.</p>

              <div key={i} style={{...s.card,padding:0,overflow:'hidden'}}>

                  <div style={{padding:'0 1.25rem 1.25rem',borderTop:'0.5px solid #eee'}}>

function GrammaireBac(){
  const els=TEXTES.filter(t=>QUESTIONS_BAC[String(t.id)]);
  const [sel,setSel]=useState(els[0]?.id);
  const t=els.find(e=>e.id===sel);
  return(
    <div>
      <p style={{fontSize:14,lineHeight:1.6,marginBottom:12}}>Les questions de grammaire que l'examinateur pourrait te poser sur chaque EL. Garde ton texte sous les yeux, réponds avec la méthode (identifier, nommer, analyser la valeur dans le texte), puis compare avec la correction.</p>
      <div style={s.tabbar}>{els.map(e=><button key={e.id} style={s.tab(sel===e.id)} onClick={()=>setSel(e.id)}>{e.numero}</button>)}</div>
      {t&&(
        <div className="b" style={{background:'var(--surface)'}}>
          <span className="kicker" style={{background:'var(--lilac)'}}>{t.numero} · {t.auteur}</span>
          <h3 style={{fontSize:24,marginTop:8}}>{t.titre}</h3>
          <QuestionsBacEL key={t.id} elId={t.id}/>
        </div>
      )}
    </div>
  );
}

// Dates du bac 2027 (écrit de français et début des oraux).
const DATE_ECRIT='2027-06-15T08:00:00', LABEL_ECRIT='15 juin';
const DATE_ORAL='2027-06-21T08:00:00', LABEL_ORAL='dès le 21 juin';
const DATES_PROVISOIRES=false;

function Countdown(){
  const now=new Date();
  const msDay=1000*60*60*24;
  const dEcrit=Math.ceil((new Date(DATE_ECRIT)-now)/msDay);
  const dOral=Math.ceil((new Date(DATE_ORAL)-now)/msDay);
  if(dOral<0) return null;
  const ecritDone=dEcrit<=0;
  const urgence=!ecritDone&&dEcrit<=7;
  const tres_urgent=!ecritDone&&dEcrit<=3;
  const messages=tres_urgent
    ?["☠️ Alerte maximale. Plus le temps de procrastiner.","🚨 Chaque heure compte MAINTENANT.","😱 Ferme TikTok. Ouvre tes fiches."]
    :urgence
    ?["🔥 Le sprint final est lancé. On lâche rien.","😬 Le commentaire et la dissertation n'attendent pas.","😤 C'est maintenant que ça se gagne."]
    :ecritDone
    ?["✅ L'écrit, c'est fait ! Place aux oraux.","🎤 Tu connais toutes tes EL ?","🎯 Focalise-toi sur tes points faibles."]
    :dEcrit>30
    ?["📚 Largement le temps de tout réviser !","✨ Commence maintenant, tu te remercieras en juin.","🎯 Le moment idéal pour s'y mettre."]
    :["⏳ La ligne droite approche !","💪 Tes fiches de méthode sont à jour ?","😤 Ne relâche pas l'effort."];
  const msg=messages[Math.floor(Date.now()/8000)%messages.length];
  const seg=(label,n,sub,color,doneTxt)=>(
    <div style={{flex:'1 1 130px',padding:'12px 16px',minWidth:0}}>
      <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.12em',opacity:0.7}}>{label}</div>
      {doneTxt
        ?<div style={{fontFamily:'var(--display)',fontWeight:800,fontSize:26,color,marginTop:6}}>{doneTxt}</div>
        :<div style={{display:'flex',alignItems:'baseline',columnGap:8,flexWrap:'wrap',marginTop:2}}>
          <span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:'clamp(36px,6vw,54px)',lineHeight:1,letterSpacing:'-0.04em',color,fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}>J-{n}</span>
          <span style={{fontSize:13,opacity:0.85}}>{sub}</span>
        </div>}
    </div>
  );
  return(
    <div className={tres_urgent?'shake':''} role="timer" aria-label={`Écrit dans ${dEcrit} jours, oraux dans ${dOral} jours`}
      style={{display:'inline-flex',flexWrap:'wrap',alignItems:'stretch',maxWidth:'100%',background:tres_urgent?'#8a1f0e':'var(--ink)',color:'#fff',borderRadius:18,border:'2px solid var(--ink)',boxShadow:'4px 4px 0 var(--coral)',transform:'rotate(-1deg)',marginBottom:'1.5rem',overflow:'hidden'}}>
      {seg('✍️ Écrit',dEcrit,LABEL_ECRIT,'var(--yellow)',ecritDone?'C\'est fait ✓':null)}
      <div aria-hidden="true" style={{borderLeft:'2px dashed rgba(255,255,255,0.35)',margin:'10px 0'}}/>
      {seg('🎤 Oraux',dOral,LABEL_ORAL,'var(--pink)',dOral<=0?'En cours !':null)}
      <div style={{flex:'1 1 100%',padding:'8px 18px',fontSize:12.5,background:'rgba(255,255,255,0.08)',borderTop:'1px solid rgba(255,255,255,0.12)'}}>{msg}</div>
    </div>
  );
}

      [{t:"txt",c:"Dans ses célèbres fables, Jean de La Fontaine s'inspire du fabuliste grec"},{t:"b",sa:true,o:["Esope"],a:"Esope"},{t:"txt",c:"et du fabuliste latin"},{t:"b",sa:true,o:["Phèdre"],a:"Phèdre"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur des Caractères s'appelle Jean"},{t:"b",sa:true,o:["La Bruyère"],a:"La Bruyère"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur de La Princesse de Clèves s'appelle Mme de"},{t:"b",sa:true,o:["La Fayette"],a:"La Fayette"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur de Phèdre et de Britannicus s'appelle Jean"},{t:"b",sa:true,o:["Racine"],a:"Racine"},{t:"txt",c:"."}],
      [{t:"txt",c:"Le plus célèbre auteur de comédies classiques est"},{t:"b",sa:true,o:["Molière"],a:"Molière"},{t:"txt",c:"."}],
      [{t:"txt",c:"Un moyen mnémotechnique pour retenir le nom des grands auteurs classiques :"}],
      [{t:"txt",c:"« Sur la racine de la bruyère, la corneille boit l’eau de la fontaine Molière »"}],
    ]},
  ]},
  {key:"LUMIERES",label:"Lumières",periode:"XVIIIe siècle",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LES LUMIERES"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mouvement des Lumières s'appelle ainsi car il souhaite"},{t:"b",sa:false,o:["éclairer le peuple et le sortir de l'obscurantisme","mettre le roi en valeur","faire la lumière sur les textes antiques"],a:"éclairer le peuple et le sortir de l'obscurantisme"}],
      [{t:"txt",c:"Le mouvement des Lumières s'est développé principalement"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au XIXème siècle"],a:"au XVIIIème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques des Lumières sont"},{t:"b",sa:false,o:["Racine et Boileau","Victor Hugo et Alfred de Musset","Voltaire et Diderot"],a:"Voltaire et Diderot"}],
      [{t:"txt",c:"Les grands principes du mouvement des Lumières sont"},{t:"b",sa:false,o:["la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'importance accordée à l'individu et à la sensibilité"],a:"la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté"}],
      [{t:"txt",c:"Les auteurs des Lumières ont principalement écrit"},{t:"b",sa:false,o:["de la poésie","des romans","des essais, des discours et des contes philosophiques"],a:"des essais, des discours et des contes philosophiques"}],
      [{t:"txt",c:"Les auteurs ayant présidé à la rédaction de l'Encyclopédie, œuvre phare des Lumières, sont"},{t:"b",sa:false,o:["Rousseau et l'abbé Prévost","Choderlos de Laclos et Olympe de Gouges","Diderot et d'Alembert"],a:"Diderot et d'Alembert"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Les Lumières sont un vaste mouvement philosophique, littéraire et scientifique qui domine le monde des idées en Europe au XVIIIème siècle."}],
      [{t:"txt",c:"La mort du roi"},{t:"b",sa:true,o:["Louis XIV"],a:"Louis XIV"},{t:"txt",c:"en 1715 fait souffler un vent de liberté sur la France. La vie intellectuelle se libère et se diffuse dans les Cafés et les"},{t:"b",sa:true,o:["Salons"],a:"Salons"},{t:"txt",c:"lieux où se réunissent les lettrés. Les conversations trouvent un écho dans la littérature dans les dialogues philosophiques comme le Neveu de"},{t:"b",sa:true,o:["Rameau"],a:"Rameau"},{t:"txt",c:"de Denis Diderot."}],
      [{t:"txt",c:"Le livre se diffuse et apparaît le premier quotidien français appelé le Journal de"},{t:"b",sa:true,o:["Paris"],a:"Paris"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les auteurs des Lumières sont impliqués dans les affaires politiques et sociales de leur temps : ce sont des auteurs engagés. On peut citer par exemple l'implication de Voltaire dans l'affaire Jean"},{t:"b",sa:true,o:["Calas"],a:"Calas"},{t:"txt",c:"."}],
    ]},
    {h:"LES PRINCIPES DES LUMIERES",parts:[
      [{t:"txt",c:"La devise en latin des Lumières proposée par Emmanuel Kant dans son célèbre Qu'est-ce que les Lumières est la formule latine \"sapere"},{t:"b",sa:true,o:["aude"],a:"aude"},{t:"txt",c:", \"aie le courage de te servir de ton propre entendement\" ou \"ose savoir\"."}],
      [{t:"txt",c:"Le grand combat des Lumières est résumé en ces termes de Voltaire : \"écrasez"},{t:"b",sa:true,o:["l'infâme"],a:"l'infâme"},{t:"txt",c:"\". Il s'agit de lutter contre le fanatisme, l'ignorance, les préjugés, le dogme religieux et tous les ennemis de la raison."}],
      [{t:"txt",c:"Les Lumières luttent contre la superstition et le fanatisme religieux. Certains auteurs, comme Diderot, sont même athées voire anticléricaux. Voltaire quant à lui croit en un être supérieur mais rejette les rites religieux : il est"},{t:"b",sa:true,o:["déiste"],a:"déiste"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les auteurs des Lumières rejettent la monarchie absolue et prônent au contraire, pour certains, un nouveau modèle dirigé par un \"despote"},{t:"b",sa:true,o:["éclairé"],a:"éclairé"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les auteurs des Lumières s'engagent enfin sur des questions de société, notamment contre l'esclavage comme dans De l'esclavage des nègres de"},{t:"b",sa:true,o:["Montesquieu"],a:"Montesquieu"},{t:"txt",c:"."}],
      [{t:"txt",c:"Comme Montaigne et les auteurs du mouvement"},{t:"b",sa:true,o:["humaniste"],a:"humaniste"},{t:"txt",c:"deux siècles avant eux, les auteurs des Lumières ont foi en l'homme et en l'humanité."}],
      [{t:"txt",c:"Ils utilisent par ailleurs des formes originales pour diffuser le savoir comme les dictionnaires ou l'"},{t:"b",sa:true,o:["Encyclopédie"],a:"Encyclopédie"},{t:"txt",c:"grande oeuvre collaborative des Lumières ou encore des contes"},{t:"b",sa:true,o:["philosophiques"],a:"philosophiques"},{t:"txt",c:"comme Candide de Voltaire."}],
    ]},
    {h:"LES GRANDS AUTEURS DES LUMIERES",parts:[
      [{t:"txt",c:"L'auteur du Dictionnaire philosophique, de Candide et du Traité sur la tolérance est"},{t:"b",sa:true,o:["Voltaire"],a:"Voltaire"},{t:"txt",c:"."}],
      [{t:"txt",c:"L'auteur de De l'Esprit des"},{t:"b",sa:true,o:["lois"],a:"lois"},{t:"txt",c:"et des Lettres"},{t:"b",sa:true,o:["persanes"],a:"persanes"},{t:"txt",c:"est Montesquieu."}],
      [{t:"txt",c:"L'auteur du Discours sur l'origine de l'inégalité parmi les hommes est Jean-Jacques"},{t:"b",sa:true,o:["Rousseau"],a:"Rousseau"}],
    ]},
  ]},
  {key:"ROMANTISME",label:"Romantisme",periode:"1ère moitié XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE ROMANTISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mot « romantisme » vient"},{t:"b",sa:false,o:["de l'ancien français « roman » qui signifie « en langue vulgaire »","du mot grec « romanos » qui signifie « inconnu »","d'une langue inconnue"],a:"de l'ancien français « roman » qui signifie « en langue vulgaire »"}],
      [{t:"txt",c:"Le mouvement du romantisme s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au XIXème siècle"],a:"au XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du romantisme sont"},{t:"b",sa:false,o:["Racine et Boileau","Victor Hugo et Alfred de Musset","Samuel Beckett et Eugène Ionesco"],a:"Victor Hugo et Alfred de Musset"}],
      [{t:"txt",c:"Le romantisme est en rupture avec"},{t:"b",sa:false,o:["les règles, le goût et le Beau classiques","la volonté de mettre le moi au centre","le goût pour la nature"],a:"les règles, le goût et le Beau classiques"}],
      [{t:"txt",c:"Les grands principes du romantisme sont"},{t:"b",sa:false,o:["la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté","l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité"],a:"l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme"}],
      [{t:"txt",c:"Les auteurs romantiques ont écrit"},{t:"b",sa:false,o:["des œuvres dans tous les genres","uniquement des romans","uniquement des pièces de théâtre"],a:"des œuvres dans tous les genres"}],
      [{t:"txt",c:"Un compositeur romantique porte le nom de"},{t:"b",sa:false,o:["Monteverdi","Mozart","Chopin"],a:"Chopin"}],
      [{t:"txt",c:"Un peintre romantique porte le nom de"},{t:"b",sa:false,o:["Nicolas Poussin","René Magritte","Caspar David Friedrich"],a:"Caspar David Friedrich"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Mouvement littéraire et culturel de la première moitié du"},{t:"b",sa:true,o:["XIX"],a:"XIX"},{t:"txt",c:"ème siècle, le romantisme exalte l'imagination, les émotions et la sensibilité mais il apparaît dès le XVIIIème siècle en Allemagne. Goethe et les artistes du Sturm und Drang célèbrent notamment l'accord entre l'homme et la"},{t:"b",sa:false,o:["culture","science","nature"],a:"nature"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les artistes romantiques français sont pris entre espoirs et désenchantements face aux mutations politiques. Ils n'hésitent pas à s'engager dans l'histoire pour défendre leurs idéaux et occupent même des fonctions"},{t:"b",sa:true,o:["politiques"],a:"politiques"},{t:"txt",c:". Lamartine a été élu député par exemple."}],
    ]},
    {h:"LES GRANDS PRINCIPES DU ROMANTISME",parts:[
      [{t:"txt",c:"Le romantisme est avant tout une réaction contre le mouvement"},{t:"b",sa:true,o:["classique"],a:"classique"},{t:"txt",c:"du XVIIème siècle qui privilégie la raison ainsi que la mesure et refuse les épanchements lyriques."}],
      [{t:"txt",c:"Une attention particulière est portée au Moi et à ses états d'âme."}],
      [{t:"txt",c:"De nombreux auteurs romantiques sont touchés par une tristesse si emblématique qu'on l'appelle \"Mal du"},{t:"b",sa:true,o:["siècle"],a:"siècle"},{t:"txt",c:"\"."}],
      [{t:"txt",c:"Les thèmes phares du romantisme sont l'amour, le goût pour la nature, l'Orient et la tentation de l'Ailleurs, le culte du passé, la rêverie, la solitude et la mélancolie, l'homme éphémère face à la nature éternelle, la révolte et la société, le poète investi d'une mission politique et sociale."}],
      [{t:"txt",c:"En poésie, les poètes privilégient le registre"},{t:"b",sa:true,o:["lyrique"],a:"lyrique"},{t:"txt",c:"c'est-à-dire l'expression des sentiments et le registre"},{t:"b",sa:true,o:["élégiaque"],a:"élégiaque"},{t:"txt",c:"c'est-à-dire l'expression de la plainte. Mais les poètes romantiques peuvent également écrire des poèmes épiques et des pamphlets."}],
      [{t:"txt",c:"Victor Hugo théorise le"},{t:"b",sa:true,o:["drame"],a:"drame"},{t:"txt",c:"romantique qui remet en cause les règles du théâtre"},{t:"b",sa:true,o:["classique"],a:"classique"},{t:"txt",c:"et refuse la séparation des genres pour privilégier l'expression des sentiments souvent exaltés."}],
      [{t:"txt",c:"Le roman est lui aussi très prisé des auteurs romantiques."}],
    ]},
    {h:"LES GRANDS AUTEURS ROMANTIQUES",parts:[
      [{t:"txt",c:"L'auteur des Misérables, des Châtiments et de la Préface de Cromwell s'appelle Victor"},{t:"b",sa:true,o:["Hugo"],a:"Hugo"}],
      [{t:"txt",c:"L'auteur des Méditations poétiques est Alphonse de"},{t:"b",sa:true,o:["Lamartine"],a:"Lamartine"},{t:"txt",c:", l'un des fondateurs du romantisme."}],
      [{t:"txt",c:"L'auteur de Lorenzaccio et des Confessions d'un enfant du siècle est Alfred de"},{t:"b",sa:true,o:["Musset"],a:"Musset"},{t:"txt",c:"."}],
    ]},
  ]},
  {key:"PARNASSE",label:"Parnasse",periode:"milieu XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE PARNASSE"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mot «Parnasse » vient"},{t:"b",sa:false,o:["d'une nymphe grecque","du nom d'un massif montagneux consacré à Apollon et aux Muses","d'un quartier de Paris"],a:"du nom d'un massif montagneux consacré à Apollon et aux Muses"}],
      [{t:"txt",c:"Le mouvement du Parnasse s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au milieu du XIXème siècle"],a:"au milieu du XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du Parnasse sont"},{t:"b",sa:false,o:["Leconte de Lisle et Théophile Gautier","Rimbaud et Mallarmé","Samuel Beckett et Eugène Ionesco"],a:"Leconte de Lisle et Théophile Gautier"}],
      [{t:"txt",c:"Le Parnasse est né"},{t:"b",sa:false,o:["dans le prolongement des Lumières","dans le prolongement du naturalisme","en réaction contre la poésie romantique"],a:"en réaction contre la poésie romantique"}],
      [{t:"txt",c:"Les grands thèmes du Parnasse sont"},{t:"b",sa:false,o:["l'instabilité, l'apparence, l'illusion, le mouvement, le bizarre, l'eau en mouvement, le miroir","la beauté froide des bijoux et l'Antiquité","l'étude des mœurs, l'influence du milieu sur l'individu, la société"],a:"la beauté froide des bijoux et l'Antiquité"}],
      [{t:"txt",c:"Les grands principes du Parnasse sont"},{t:"b",sa:false,o:["l'étude des mœurs, l'influence du milieu sur l'individu, la société","l'importance accordée à l'individu et à la sensibilité, la mélancolie et l'exotisme","le refus de la sensibilité, le goût pour la description dans la poésie et l'Art pour l'Art"],a:"le refus de la sensibilité, le goût pour la description dans la poésie et l'Art pour l'Art"}],
      [{t:"txt",c:"Les auteurs du Parnasse ont principalement écrit"},{t:"b",sa:false,o:["des essais","des pièces de théâtre","de la poésie"],a:"de la poésie"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le Parnasse est apparu en réaction contre les effusions du grand mouvement poétique du début du XIXème siècle, le"},{t:"b",sa:true,o:["romantisme"],a:"romantisme"},{t:"txt",c:". La poésie du début du XIXème siècle est en effet jugée trop éloquente et sentimentale par les poètes du Parnasse."}],
    ]},
    {h:"LES GRANDS PRINCIPES DU PARNASSE",parts:[
      [{t:"txt",c:"L'autre nom du Parnasse est l'Art pour"},{t:"b",sa:true,o:["l'Art"],a:"l'Art"},{t:"txt",c:"."}],
      [{t:"txt",c:"Ce mouvement a été théorisé par Théophile Gautier dans la préface de son roman Mademoiselle"},{t:"b",sa:true,o:["Maupin"],a:"Maupin"},{t:"txt",c:"."}],
      [{t:"txt",c:"Les poètes du Parnasse récusent par ailleurs la mission civilisatrice et prophétique attribuée au poète par Victor"},{t:"b",sa:true,o:["Hugo"],a:"Hugo"},{t:"txt",c:"dans \"Fonction du poète\". L'art doit se dégager des contingences matérielles et traiter uniquement de la beauté. Le Parnasse refuse une poésie utile car comme le dit Théophile Gautier : \"tout ce qui est utile est"},{t:"b",sa:true,o:["laid"],a:"laid"},{t:"txt",c:"\". La poésie parnassienne est un véritable travail d'orfèvre. La valeur travail est valorisée au détriment de l'inspiration."}],
      [{t:"txt",c:"Selon les Parnassiens, leur poésie est réservée à des initiés qui constituent une sorte d'élite."}],
    ]},
    {h:"LES AUTEURS DU PARNASSE",parts:[
      [{t:"txt",c:"Le recueil Poèmes"},{t:"b",sa:true,o:["barbares"],a:"barbares"},{t:"txt",c:"a été écrit par Leconte de Lisle."}],
      [{t:"txt",c:"Le recueil Emaux et"},{t:"b",sa:true,o:["camées"],a:"camées"},{t:"txt",c:"a été écrit par Théophile Gautier."}],
    ]},
  ]},
  {key:"REALISME",label:"Réalisme",periode:"milieu XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE REALISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mouvement du réalisme s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","au milieu du XIXème siècle"],a:"au milieu du XIXème siècle"}],
      [{t:"txt",c:"Deux auteurs emblématiques du réalisme sont"},{t:"b",sa:false,o:["Leconte de Lisle et Théophile Gautier","Rimbaud et Mallarmé","Balzac et Flaubert"],a:"Balzac et Flaubert"}],
      [{t:"txt",c:"Le réalisme est né"},{t:"b",sa:false,o:["dans le prolongement des Lumières","en réaction contre le lyrisme et l'idéalisation romantique","dans le prolongement du naturalisme"],a:"en réaction contre le lyrisme et l'idéalisation romantique"}],
      [{t:"txt",c:"Les grands thèmes du réalisme sont"},{t:"b",sa:false,o:["l'étude des mœurs, l'influence du milieu sur l'individu, la société","l'instabilité, l'apparence, l'illusion, le mouvement, le bizarre, l'eau en mouvement, le miroir","la critique des préjugés, la lutte contre fanatisme, le refus des dogmes religieux, la tolérance et la liberté"],a:"l'étude des mœurs, l'influence du milieu sur l'individu, la société"}],
      [{t:"txt",c:"Les grands principes du réalisme sont"},{t:"b",sa:false,o:["le refus de la sensibilité, le goût pour la description dans la poésie et l'Art pour l'Art","la séparation des genres, le respect des règles, les principes d'ordre, d'équilibre, de mesure et de simplicité","l'observation et la reproduction fidèle du réel"],a:"l'observation et la reproduction fidèle du réel"}],
      [{t:"txt",c:"Les auteurs du réalisme ont principalement écrit"},{t:"b",sa:false,o:["des romans et des nouvelles","des pièces de théâtre","de la poésie"],a:"des romans et des nouvelles"}],
      [{t:"txt",c:"Un peintre réaliste porte le nom de"},{t:"b",sa:false,o:["Nicolas Poussin","Arnold Böcklin","Gustave Courbet"],a:"Gustave Courbet"}],
    ]},
    {h:"LE CONTEXTE",parts:[
      [{t:"txt",c:"Le réalisme apparaît après la désillusion de la révolution de l'année"},{t:"b",sa:true,o:["1848"],a:"1848"},{t:"txt",c:": la bourgeoisie, classe dominante se soucie de ses seuls intérêts."}],
      [{t:"txt",c:"La révolution"},{t:"b",sa:true,o:["industrielle"],a:"industrielle"},{t:"txt",c:"crée des emplois en ville et crée un exode rural."}],
      [{t:"txt",c:"La foi en le progrès se répand et la science est perçue comme la solution à tous les problèmes."}],
      [{t:"txt",c:"La philosophie positiviste d'Auguste"},{t:"b",sa:true,o:["Comte"],a:"Comte"},{t:"txt",c:"est en plein essor."}],
      [{t:"txt",c:"Dans ce contexte positiviste, le réalisme naît aussi en réaction contre le mouvement"},{t:"b",sa:true,o:["romantique"],a:"romantique"},{t:"txt",c:"et ses épanchements lyriques."}],
    ]},
    {h:"LES GRANDS PRINCIPES",parts:[
      [{t:"txt",c:"Le mot \"réalisme\" apparaît en 1850 et a été utilisé en premier pour caractériser la manière de peindre de Gustave Courbet notamment dans son tableau Enterrement à"},{t:"b",sa:true,o:["Ornans"],a:"Ornans"},{t:"txt",c:"."}],
      [{t:"txt",c:"Il s'agit de dire le réel au plus près en proposant des descriptions précises et en rejetant les intrigues trop romanesques. L'observation du monde contemporain est un moteur important de la création chez les réalistes qui réunissent souvent une abondante documentation."}],
      [{t:"txt",c:"Les romans et les nouvelles réalistes traitent de la banalité de la vie, accordent une grande importance au corps et refusent la bienséance comme en témoigne le procès intenté à Flaubert pour son roman Madame"},{t:"b",sa:true,o:["Bovary"],a:"Bovary"}],
      [{t:"txt",c:"De nouvelles classes sociales deviennent des personnages à part entière : la bourgeoisie et le monde ouvrier."}],
      [{t:"txt",c:"Les personnages ne sont plus idéalisés et sont bien loin d'être héroïques : on passe de personnages extraordinaires à des personnages de la vie"},{t:"b",sa:true,o:["quotidienne"],a:"quotidienne"}],
    ]},
    {h:"LES GRANDS AUTEURS REALISTES",parts:[
      [{t:"txt",c:"L'auteur d'une vaste oeuvre romanesque appelée La Comédie humaine s'appelle Honoré de"},{t:"b",sa:true,o:["Balzac"],a:"Balzac"}],
      [{t:"txt",c:"L'auteur de La Chartreuse de Parme et du roman Le Rouge et le Noir s'appelle"},{t:"b",sa:true,o:["Stendhal"],a:"Stendhal"}],
      [{t:"txt",c:"L'auteur de l'Education sentimentale s'appelle Gustave"},{t:"b",sa:true,o:["Flaubert"],a:"Flaubert"}],
    ]},
  ]},
  {key:"NATURALISME",label:"Naturalisme",periode:"fin XIXe",sections:[
    {h:null,parts:[
      [{t:"txt",c:"LE NATURALISME"}],
    ]},
    {h:"UN QCM POUR COMMENCER",parts:[
      [{t:"txt",c:"Le mouvement du naturalisme s'est développé"},{t:"b",sa:false,o:["au XVIIème siècle","au XVIIIème siècle","à la fin du XIXème siècle"],a:"à la fin du XIXème siècle"}],
      [{t:"txt",c:"Le mot « naturalisme » signifie initialement"},{t:"b",sa:false,o:["qui prône le retour à la nature","qui étudie l'histoire et les sciences naturelles","qui s'oppose à la culture"],a:"qui étudie l'histoire et les sciences naturelles"}],
      [{t:"txt",c:"Deux auteurs emblématiques du naturalisme sont"},{t:"b",sa:false,o:["Leconte de Lisle et Théophile Gautier","Rimbaud et Mallarmé","Zola et les frères Goncourt"],a:"Zola et les frères Goncourt"}],
      [{t:"txt",c:"Le naturalisme est né"},{t:"b",sa:false,o:["dans le prolongement des Lumières","dans le prolongement des règles classiques","dans le prolongement du réalisme"],a:"dans le prolongement du réalisme"}],

    {h:"LES PRINCIPES DU SURREALISME",parts:[

function MouvementsModule({onBack}){
  const [sel,setSel]=useState(0);
  const [answers,setAnswers]=useState({});
  const [checked,setChecked]=useState(false);
  const [mode,setMode]=useState('fiche');
  const mv=MOUVEMENTS[sel];
  const selectMv=i=>{setSel(i);setAnswers({});setChecked(false);};
  const setAns=(key,val)=>{setAnswers(a=>({...a,[key]:val}));};
  let totalBlanks=0, correctCount=0;
  mv.sections.forEach((sec,si)=>sec.parts.forEach((part,pi)=>part.forEach((seg,gi)=>{
    if(seg.t==='b'){
      totalBlanks++;
      const key=`${si}-${pi}-${gi}`;
      const given=(answers[key]||'').trim().toLowerCase();
      const expected=(seg.a||'').trim().toLowerCase();
      if(given===expected&&given!=='')correctCount++;
    }
  })));
  const renderSeg=(seg,si,pi,gi)=>{
    if(seg.t==='txt') return <span key={gi}>{seg.c} </span>;
    const key=`${si}-${pi}-${gi}`;
    const given=answers[key]||'';
    const isCorrect=given.trim().toLowerCase()===(seg.a||'').trim().toLowerCase();
    if(mode==='fiche'){
      return <strong key={gi} style={{color:'#5b3cc4',background:'#f5f0ff',padding:'0 4px',borderRadius:3}}>{seg.a} </strong>;
    }
    if(seg.sa){
      return(
        <span key={gi} style={{display:'inline-block',margin:'2px 0'}}>
          <input value={given} onChange={e=>setAns(key,e.target.value)} disabled={checked} placeholder="…"
            style={{fontSize:13,padding:'2px 6px',borderRadius:5,border:`1.5px solid ${checked?(isCorrect?'#27ae60':'#e74c3c'):'#bbb'}`,background:checked?(isCorrect?'#eafaf1':'#fdf0ef'):'white',width:Math.max(60,Math.min(220,(seg.a||'').length*8))+'px',outline:'none'}}/>
          {checked&&!isCorrect&&<span style={{fontSize:11,color:'#27ae60',marginLeft:4}}>→ {seg.a}</span>}{' '}
        </span>
      );
    }
    return(
      <span key={gi} style={{display:'inline-flex',flexWrap:'wrap',gap:4,margin:'2px 4px',verticalAlign:'middle'}}>
        {seg.o.map((opt,oi)=>{
          const chosen=given===opt;
          const isAns=opt===seg.a;
          let bg='white',bc='#ccc',col='#444';
          if(checked){
            if(isAns){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}
            else if(chosen){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}
          }else if(chosen){bg='#f5f0ff';bc='#5b3cc4';col='#5b2d8e';}
          return <button key={oi} onClick={()=>!checked&&setAns(key,opt)} disabled={checked} style={{fontSize:12,padding:'3px 8px',borderRadius:6,border:`1px solid ${bc}`,background:bg,color:col,cursor:checked?'default':'pointer',lineHeight:1.3}}>{opt}</button>;
        })}{' '}
      </span>
    );
  };
  return(
    <div>
      <h2 style={{fontSize:16,fontWeight:600,marginBottom:4}}>📜 Mouvements littéraires</h2>
      <p style={{fontSize:13,color:'#666',marginBottom:'1rem'}}>Révise les 13 grands mouvements pour le commentaire. Mode fiche pour apprendre, mode quiz pour te tester.</p>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:'1rem'}}>
        {MOUVEMENTS.map((m,i)=>(
          <button key={m.key} onClick={()=>selectMv(i)} style={{...s.btn,fontSize:11,padding:'5px 10px',background:sel===i?'#5b3cc4':'white',color:sel===i?'white':'#5b3cc4',border:'1px solid #5b3cc460',fontWeight:sel===i?600:400}}>{m.label}</button>
        ))}
      </div>
      <div style={{display:'flex',gap:0,marginBottom:'1rem',background:'#f0ede8',borderRadius:8,padding:3,maxWidth:320}}>
        <button onClick={()=>{setMode('fiche');setChecked(false);}} style={{flex:1,padding:'6px 0',fontSize:12,fontWeight:mode==='fiche'?600:400,background:mode==='fiche'?'white':'transparent',border:'none',borderRadius:6,color:mode==='fiche'?'#1a1a18':'#888',boxShadow:mode==='fiche'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>📖 Fiche</button>
        <button onClick={()=>{setMode('quiz');setChecked(false);setAnswers({});}} style={{flex:1,padding:'6px 0',fontSize:12,fontWeight:mode==='quiz'?600:400,background:mode==='quiz'?'white':'transparent',border:'none',borderRadius:6,color:mode==='quiz'?'#1a1a18':'#888',boxShadow:mode==='quiz'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>✏️ Quiz</button>
      </div>
      <div style={s.card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',paddingBottom:'0.75rem',borderBottom:'2px solid #5b3cc4',gap:8,flexWrap:'wrap'}}>
          <h3 style={{fontSize:20,fontWeight:700,color:'#5b3cc4',margin:0}}>{mv.label}</h3>
          <span style={{fontSize:12,background:'#f5f0ff',color:'#5b3cc4',padding:'3px 10px',borderRadius:20,fontWeight:500}}>{mv.periode}</span>
        </div>
        {mv.sections.map((sec,si)=>(
          <div key={si} style={{marginBottom:'1rem'}}>
            {sec.h&&<p style={{fontSize:11,fontWeight:700,color:'#5b3cc4',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8,marginTop:si>0?'1rem':0}}>{sec.h}</p>}
            {sec.parts.map((part,pi)=>(
              <p key={pi} style={{fontSize:13.5,lineHeight:2,color:'#2a2a28',marginBottom:8}}>
                {part.map((seg,gi)=>renderSeg(seg,si,pi,gi))}
              </p>
            ))}
          </div>
        ))}
        {mode==='quiz'&&(
          <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'0.5px solid #eee'}}>
            {!checked?(
              <button onClick={()=>setChecked(true)} style={{...s.btn,background:'#5b3cc4',color:'white',border:'none',fontWeight:600}}>Vérifier mes réponses</button>
            ):(
              <div style={{textAlign:'center'}}>
                <p style={{fontSize:24,fontWeight:700,color:correctCount===totalBlanks?'#27ae60':'#5b3cc4',marginBottom:4}}>{correctCount} / {totalBlanks}</p>
                <p style={{fontSize:13,color:'#888',marginBottom:'1rem'}}>{correctCount===totalBlanks?'Sans faute, bravo ! 🎉':correctCount>=totalBlanks*0.7?'Bien joué, presque parfait !':'Relis la fiche et réessaie 💪'}</p>
                <button onClick={()=>{setChecked(false);setAnswers({});}} style={{...s.btn,fontWeight:500}}>🔄 Recommencer</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
