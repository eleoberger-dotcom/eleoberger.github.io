/* ── TIRAGE AU SORT ─────────────────────────────────────────────────────── */
function TirageEL({onBack}){
  const [el,setEl]=useState(null);
  const [phase,setPhase]=useState('draw');
  const [timeLeft,setTimeLeft]=useState(30*60);
  const [running,setRunning]=useState(false);

  const draw=()=>{
    const picked=TEXTES[Math.floor(Math.random()*TEXTES.length)];
    setEl(picked);setPhase('prepare');setTimeLeft(30*60);setRunning(true);
  };
  const redraw=()=>{setEl(null);setPhase('draw');setRunning(false);};

  useEffect(()=>{
    if(!running||phase!=='prepare')return;
    if(timeLeft<=0){setRunning(false);setPhase('reveal');return;}
    const t=setTimeout(()=>setTimeLeft(s=>s-1),1000);
    return()=>clearTimeout(t);
  },[running,timeLeft,phase]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const pct=((30*60-timeLeft)/(30*60))*100;
  const urgent=timeLeft<5*60;
  const objetCoul=el?OBJETS.find(o=>o.id===el.objet)?.c:'#1a1a18';

  return(
    <div>
      <h2 style={{fontSize:16,fontWeight:600,marginBottom:4}}>🎲 Tirage au sort</h2>
      <p style={{fontSize:13,color:'#666',marginBottom:'1.25rem'}}>Simule les conditions du bac : tu tires un texte, tu as 30 minutes pour préparer ton explication.</p>

      {phase==='draw'&&(
        <div style={{...s.card,textAlign:'center',padding:'2.5rem 1rem'}}>
          <p style={{fontSize:48,marginBottom:'1rem'}}>🎲</p>
          <p style={{fontSize:14,color:'#666',marginBottom:'1.5rem'}}>Prêt·e ? Le chrono démarre dès le tirage.</p>
          <button onClick={draw} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:600,fontSize:15,padding:'0.75rem 2rem'}}>
            Tirer un texte au sort
          </button>
        </div>
      )}

      {(phase==='prepare'||phase==='reveal')&&el&&(
        <div>
          {phase==='prepare'&&(
            <div style={{marginBottom:'1rem'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <span style={{fontSize:12,color:'#888'}}>Temps de préparation</span>
                <span style={{fontSize:24,fontWeight:700,color:urgent?'#e74c3c':'#1a1a18',fontVariantNumeric:'tabular-nums'}}>{fmt(timeLeft)}</span>
              </div>
              <div style={{height:6,background:'#eee',borderRadius:4}}>
                <div style={{height:6,borderRadius:4,background:urgent?'#e74c3c':objetCoul,width:`${pct}%`,transition:'width 1s linear'}}/>
              </div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button onClick={()=>setRunning(r=>!r)} style={{...s.btn,fontSize:11}}>{running?'⏸ Pause':'▶ Reprendre'}</button>
                <button onClick={()=>{setRunning(false);setPhase('reveal');}} style={{...s.btn,fontSize:11,color:objetCoul,border:`1px solid ${objetCoul}60`}}>Je suis prêt·e →</button>
              </div>
            </div>
          )}

          <div style={s.card}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',gap:8,flexWrap:'wrap'}}>
              <div>
                <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>{el.numero}</span>
                <p style={{fontSize:17,fontWeight:600,margin:'2px 0'}}>{el.titre}</p>
                <p style={{fontSize:13,color:'#888'}}>{el.auteur} · {el.date}</p>
              </div>
              <span style={{fontSize:11,background:objetCoul+'15',color:objetCoul,padding:'3px 8px',borderRadius:20,fontWeight:500}}>{el.mouvement}</span>
            </div>

            <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.9rem 1rem',fontSize:13,lineHeight:1.9,marginBottom:'1rem',fontStyle:'italic',whiteSpace:'pre-line',maxHeight:280,overflowY:'auto'}}>
              {el.extrait}
            </div>

            {phase==='prepare'&&(
              <div style={{background:'#f5f0ff',borderRadius:8,padding:'0.75rem 1rem',border:'1px solid #5b3cc430'}}>
                <p style={{fontSize:12,color:'#5b2d8e',fontWeight:500,margin:0}}>💭 Entraîne-toi à :</p>
                <ul style={{margin:'6px 0 0 16px',fontSize:12,color:'#5b2d8e',lineHeight:1.8}}>
                  <li>Formuler la problématique</li>
                  <li>Identifier et nommer les mouvements</li>
                  <li>Repérer les procédés clés par mouvement</li>
                </ul>
              </div>
            )}

            {phase==='reveal'&&(
              <div>
                <div style={{borderTop:'0.5px solid #eee',paddingTop:'1rem',marginBottom:'1rem'}}>
                  <p style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Problématique</p>
                  <p style={{fontSize:14,fontStyle:'italic',lineHeight:1.6,color:'#2a2a28'}}>{el.problematique}</p>
                </div>
                <div style={{borderTop:'0.5px solid #eee',paddingTop:'1rem'}}>
                  <p style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Mouvements</p>
                  {el.etapes.map((e,i)=>(
                    <div key={i} style={{marginBottom:8}}>
                      <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:4}}>
                        <span style={{background:objetCoul,color:'white',borderRadius:12,padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>{e.label}</span>
                        <span style={{fontSize:13,fontWeight:500}}>{e.titre}</span>
                      </div>
                      <ul style={{margin:'0 0 0 48px',padding:0,listStyle:'none'}}>
                        {e.procedes.map((p,j)=><li key={j} style={{fontSize:12,color:'#555',lineHeight:1.6}}>→ {p}</li>)}
                      </ul>
                    </div>
                  ))}
                </div>
                <div style={{display:'flex',gap:8,marginTop:'1.25rem',flexWrap:'wrap'}}>
                  <button onClick={redraw} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:600}}>🎲 Nouveau tirage</button>
                  <button onClick={onBack} style={s.btn}>← Accueil</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── FLASH CARDS ────────────────────────────────────────────────────────── */
function FlashMode({onBack}){
  const [mode,setMode]=useState('normal');
  const [cards,setCards]=useState([]);
  const [idx,setIdx]=useState(0);
  const [step,setStep]=useState(0);
  const [scores,setScores]=useState({mv:0,pb:0,mvTot:0,pbTot:0});
  const [done,setDone]=useState(false);
  const [selfMv,setSelfMv]=useState(null);
  const [selfPb,setSelfPb]=useState(null);
  const [choices,setChoices]=useState([]);
  const [chosen,setChosen]=useState(null);
  const [showAns,setShowAns]=useState(false);

  const buildCards=()=>{
    const sh=[...TEXTES].sort(()=>Math.random()-0.5);
    setCards(sh);setIdx(0);setStep(0);setDone(false);
    setScores({mv:0,pb:0,mvTot:0,pbTot:0});setSelfMv(null);setSelfPb(null);
    setChosen(null);setShowAns(false);
  };
  useEffect(()=>{buildCards();},[mode]);

  const buildChoices=card=>{
    const others=TEXTES.filter(t=>t.id!==card.id).sort(()=>Math.random()-0.5).slice(0,3);
    const all=[card,...others].sort(()=>Math.random()-0.5);
    setChoices(all);setChosen(null);setShowAns(false);
  };
  useEffect(()=>{
    if(mode==='inverse'&&cards[idx])buildChoices(cards[idx]);
  },[idx,mode,cards]);

  const next=()=>{
    if(idx+1>=cards.length){setDone(true);}
    else{setIdx(i=>i+1);setStep(0);setSelfMv(null);setSelfPb(null);setChosen(null);setShowAns(false);}
  };
  const handleMv=knew=>{setSelfMv(knew);setScores(s=>({...s,mv:s.mv+(knew?1:0),mvTot:s.mvTot+1}));setStep(2);};
  const handlePb=knew=>{setSelfPb(knew);setScores(s=>({...s,pb:s.pb+(knew?1:0),pbTot:s.pbTot+1}));};
  const handleChoice=c=>{
    setChosen(c);setShowAns(true);
    if(c.id===cards[idx].id)setScores(s=>({...s,mv:s.mv+1,mvTot:s.mvTot+1}));
    else setScores(s=>({...s,mvTot:s.mvTot+1}));
  };

  if(done) return(
    <div>
      <div style={s.card}>
        <div style={{textAlign:'center',padding:'1rem 0'}}>
          <p style={{fontSize:32}}>🎉</p>
          <p style={{fontSize:20,fontWeight:600,marginBottom:'1.5rem'}}>Session terminée !</p>
          <div style={{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap',marginBottom:'1.5rem'}}>
            <div style={{background:'#eafaf1',border:'1px solid #27ae6040',borderRadius:12,padding:'1rem 1.5rem',textAlign:'center'}}>
              <p style={{fontSize:28,fontWeight:600,color:'#27ae60',margin:0}}>{scores.mv}/{scores.mvTot}</p>
              <p style={{fontSize:12,color:'#555',margin:0}}>{mode==='inverse'?'Textes reconnus':'Mouvements sus'}</p>
            </div>
            {mode==='normal'&&(
              <div style={{background:'#eaf2fb',border:'1px solid #2980b940',borderRadius:12,padding:'1rem 1.5rem',textAlign:'center'}}>
                <p style={{fontSize:28,fontWeight:600,color:'#2980b9',margin:0}}>{scores.pb}/{scores.pbTot}</p>
                <p style={{fontSize:12,color:'#555',margin:0}}>Problématiques sues</p>
              </div>
            )}
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
            <button onClick={buildCards} style={{...s.btn,background:'#1a1a18',color:'#fff',border:'none'}}>🔄 Recommencer</button>
            <button onClick={onBack} style={s.btn}>← Accueil</button>
          </div>
        </div>
      </div>
    </div>
  );

  const card=cards[idx];
  if(!card)return null;
  const objetCoul=OBJETS.find(o=>o.id===card.objet)?.c||'#1a1a18';
  const total=cards.length;

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
        <span/>
        <span style={{fontSize:12,color:'#888'}}>Carte {idx+1} / {total}</span>
      </div>

      <div style={{display:'flex',gap:0,marginBottom:'1rem',background:'#f0ede8',borderRadius:8,padding:3}}>
        <button onClick={()=>setMode('normal')} style={{flex:1,padding:'6px 4px',fontSize:12,fontWeight:mode==='normal'?600:400,background:mode==='normal'?'white':'transparent',border:'none',borderRadius:6,color:mode==='normal'?'#1a1a18':'#888',boxShadow:mode==='normal'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          📖 Texte → mouvements
        </button>
        <button onClick={()=>setMode('inverse')} style={{flex:1,padding:'6px 4px',fontSize:12,fontWeight:mode==='inverse'?600:400,background:mode==='inverse'?'white':'transparent',border:'none',borderRadius:6,color:mode==='inverse'?'#1a1a18':'#888',boxShadow:mode==='inverse'?'0 1px 4px rgba(0,0,0,0.1)':'none'}}>
          🔀 Mouvements → texte
        </button>
      </div>

      <div style={{height:4,background:'#eee',borderRadius:4,marginBottom:'1.25rem'}}>
        <div style={{height:4,background:objetCoul,borderRadius:4,width:`${((idx)/total)*100}%`,transition:'width 0.3s'}}/>
      </div>

      {mode==='inverse'&&(
        <div style={s.card}>
          <div style={{marginBottom:'1rem'}}>
            <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>🔀 Mode inverse</span>
            <p style={{fontSize:14,fontWeight:600,margin:'4px 0 2px'}}>Reconnais le texte à partir de ses mouvements</p>
          </div>
          <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.85rem 1rem',marginBottom:'1rem'}}>
            <p style={{fontSize:11,fontWeight:600,color:'#888',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Les mouvements :</p>
            {card.etapes.map((e,i)=>(
              <div key={i} style={{display:'flex',gap:10,marginBottom:6,alignItems:'flex-start'}}>
                <span style={{background:objetCoul,color:'white',borderRadius:12,padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>{e.label}</span>
                <span style={{fontSize:13,lineHeight:1.5}}>{e.titre}</span>
              </div>
            ))}
          </div>
          <p style={{fontSize:13,color:'#555',marginBottom:'0.75rem',fontWeight:500}}>À quel texte correspondent ces mouvements ?</p>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:'1rem'}}>
            {choices.map((c,i)=>{
              const isCorrect=c.id===card.id;
              const isChosen=chosen?.id===c.id;
              let bg='#fff',bc='#ddd',col='#1a1a18';
              if(showAns){
                if(isCorrect){bg='#eafaf1';bc='#27ae60';col='#1a6b3a';}
                else if(isChosen){bg='#fdf0ef';bc='#e74c3c';col='#a93226';}
              }
              return(
                <button key={i} onClick={()=>!showAns&&handleChoice(c)}
                  style={{textAlign:'left',padding:'10px 14px',borderRadius:8,border:`1px solid ${bc}`,background:bg,color:col,cursor:showAns?'default':'pointer',fontSize:13,lineHeight:1.4}}>
                  <span style={{fontSize:10,fontWeight:600,color:showAns&&isCorrect?'#27ae60':objetCoul,textTransform:'uppercase',marginRight:6}}>{c.numero}</span>
                  {c.auteur}, <em>{c.titre}</em>
                  {showAns&&isCorrect&&<span style={{float:'right'}}>✅</span>}
                  {showAns&&isChosen&&!isCorrect&&<span style={{float:'right'}}>❌</span>}
                </button>
              );
            })}
          </div>
          {showAns&&(
            <div>
              {chosen?.id===card.id
                ?<p style={{fontSize:13,color:'#27ae60',fontWeight:600,marginBottom:'0.75rem'}}>Bravo ! Tu as reconnu le texte 🎉</p>
                :<p style={{fontSize:13,color:'#e74c3c',marginBottom:'0.75rem'}}>C'était <strong>{card.numero} — {card.titre}</strong> ({card.auteur})</p>
              }
              <button onClick={next} style={{...s.btn,background:'#1a1a18',color:'white',border:'none',fontWeight:500}}>
                {idx+1>=total?'Voir le résultat':'Carte suivante →'}
              </button>
            </div>
          )}
        </div>
      )}

      {mode==='normal'&&(
      <div style={s.card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem',gap:8,flexWrap:'wrap'}}>
          <div>
            <span style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em'}}>{card.numero}</span>
            <p style={{fontSize:16,fontWeight:600,margin:'2px 0'}}>{card.titre}</p>
            <p style={{fontSize:12,color:'#888'}}>{card.auteur} · {card.date}</p>
          </div>
          <span style={{fontSize:11,background:objetCoul+'15',color:objetCoul,padding:'3px 8px',borderRadius:20,fontWeight:500,whiteSpace:'nowrap'}}>{card.mouvement}</span>
        </div>

        <div style={{background:'#f8f6f2',borderRadius:8,padding:'0.85rem 1rem',fontSize:13,lineHeight:1.8,maxHeight:200,overflowY:'auto',marginBottom:'1rem',fontStyle:'italic',color:'#2a2a28',whiteSpace:'pre-line'}}>
          {card.extrait}
        </div>

        {step===0&&(
          <div style={{textAlign:'center',padding:'0.5rem 0'}}>
            <p style={{fontSize:13,color:'#555',marginBottom:'1rem'}}>🔍 Quels sont les <strong>mouvements</strong> de ce texte ?</p>
            <button onClick={()=>setStep(1)} style={{...s.btn,background:objetCoul,color:'white',border:'none',fontWeight:500}}>Révéler les mouvements</button>
          </div>
        )}
        {step>=1&&(
          <div style={{marginBottom:'1rem'}}>
            <p style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8}}>Mouvements</p>
            {card.etapes.map((e,i)=>(
              <div key={i} style={{display:'flex',gap:10,marginBottom:6,alignItems:'flex-start'}}>
                <span style={{background:objetCoul,color:'white',borderRadius:12,padding:'1px 8px',fontSize:11,fontWeight:600,flexShrink:0}}>{e.label}</span>
                <span style={{fontSize:13,lineHeight:1.5}}>{e.titre}</span>
              </div>
            ))}
            {step===1&&selfMv===null&&(
              <div style={{marginTop:'1rem',display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
                <p style={{fontSize:12,color:'#888',width:'100%',textAlign:'center',marginBottom:8}}>Est-ce que tu le savais ?</p>
                <button onClick={()=>handleMv(true)} style={{...s.btn,background:'#eafaf1',color:'#27ae60',border:'1px solid #27ae6060',fontWeight:600}}>✅ Oui</button>
                <button onClick={()=>handleMv(false)} style={{...s.btn,background:'#fdf0ef',color:'#e74c3c',border:'1px solid #e74c3c60',fontWeight:600}}>❌ Non</button>
              </div>
            )}
          </div>
        )}
        {step===2&&(
          <div style={{textAlign:'center',padding:'0.5rem 0',borderTop:'0.5px solid #eee',paddingTop:'1rem'}}>
            <p style={{fontSize:12,color:selfMv?'#27ae60':'#e74c3c',marginBottom:10}}>{selfMv?'Super !':'Pas grave, tu t\'en souviendras !'}</p>
            <p style={{fontSize:13,color:'#555',marginBottom:'1rem'}}>💡 Quelle est la <strong>problématique</strong> ?</p>
            <button onClick={()=>setStep(3)} style={{...s.btn,background:objetCoul,color:'white',border:'none',fontWeight:500}}>Révéler la problématique</button>
          </div>
        )}
        {step>=3&&(
          <div style={{borderTop:'0.5px solid #eee',paddingTop:'1rem',marginBottom:'1rem'}}>
            <p style={{fontSize:11,fontWeight:600,color:objetCoul,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Problématique</p>
            <p style={{fontSize:14,fontStyle:'italic',lineHeight:1.6,color:'#2a2a28'}}>{card.problematique}</p>
            {selfPb===null&&(
              <div style={{marginTop:'1rem',display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>

function tirageSujet(pool,mode,exclude){
  let f=mode==='all'?pool:pool.filter(x=>x.type===mode);
  if(!f.length)f=pool;
  let cand=f.filter(x=>x!==exclude);
  if(!cand.length)cand=f;
  return cand[Math.floor(Math.random()*cand.length)];
}

function DissertGenerator({onBack}){
  const oid='theatre';

      {q:"« il y a des choses que je n'oublie pas » : comment cette phrase sonne-t-elle ? Pourquoi ?",i:"C'est une tournure emphatique. Et à quel mot de H1 « choses » répond-il ?",m:"La tournure emphatique sonne presque comme une menace. Le nom « choses » laisse un flou (positif ou négatif ?) et répond au « rien dont je me souvienne » de H1 : « choses » / « rien ». On sent que la rancœur est du côté de H2."},
      {q:"« il y a eu des circonstances… » : pourquoi H2 reste-t-il si vague ?",i:"Est-ce une réponse concrète ?",m:"C'est une expression allusive : rien de concret, l'objet reste flou, ce qui permet à H2 de ne pas répondre directement."},
      {q:"Quel effet produit l'antithèse « jamais » / « toujours » (l. 11-12) ?",i:"Ce sont des mots radicaux, extrêmes.",m:"Elle renforce l'opposition : le langage montre le fossé entre eux. Ce vocabulaire radical montre aussi que la situation est arrivée à une extrémité, un paroxysme."},
     ]},
    {mvt:2,l:"l. 13-17",t:"L'amitié d'hier",
     qs:[
      {q:"« Tu as toujours été très chic » / « tu as toujours été parfait » : que remarques-tu ?",i:"Regarde les adjectifs, le temps du verbe… et la ressemblance des deux phrases.",m:"Les adjectifs mélioratifs montrent que H1, plus attentionné, veut régler le conflit. Mais le passé « tu as toujours été » suppose qu'il ne l'est peut-être plus. Et les deux phrases se ressemblent : leur proximité passée se voit dans leur manière de parler."},
      {q:"H2 rapporte les paroles de sa mère. Quel procédé, quel registre, et dans quel but ?",i:"« pauvre maman »…",m:"La prosopopée donne à entendre le discours de la mère, avec un registre pathétique (on devine qu'elle est morte : « pauvre maman »). Cela sonne comme une tentative de renouer la relation autour de l'affection passée."},
     ]},
    {mvt:2,l:"l. 18-23",t:"La distance",
     repere:{c:"Clique sur le champ lexical de l'éloignement.",f:"Tu étais toujours à une certaine [[distance]]… tu étais à [[l'autre bout du monde]]…",e:"L'éloignement physique imite l'éloignement psychologique."},
     qs:[
      {q:"« Alors… que veux-tu que je te dise ! » + la didascalie « hausse les épaules » : que montrent-elles ?",i:"H2 veut-il répondre ?",m:"Elles soulignent l'exaspération de H2, qui refuse de répondre. Les acteurs jouent à ne rien dire : le langage est vide, très clivé, et l'on a du mal à saisir concrètement les choses."},
      {q:"« Si, dis-moi » : que fait H1 ?",i:"La conversation était en train de s'éteindre…",m:"Avec la reprise de « alors », la conversation s'éteignait ; l'adverbe « si » et l'impératif la relancent. H1 est tenace, il ne veut pas abandonner."},
      {q:"Pourquoi l'épisode du téléphone est-il important ?",i:"Pourquoi H1 vient-il en personne ?",m:"Le téléphone ne permet pas de réduire l'éloignement : c'est pourquoi H1 se lance dans cette conversation en face à face. On a aussi un premier élément de réponse, développé dans la pièce : H2 est celui qui s'éloigne des autres « pour un oui ou pour un non »."},
     ]},
    {mvt:2,l:"l. 24-fin",t:"« Rien qu'on puisse dire »",
     qs:[
      {q:"« dans un élan. – Mais moi aussi, figure-toi… » : que se passe-t-il chez H2 ?",i:"La didascalie annonce un changement de rythme.",m:"La didascalie annonce un changement de position : H2 va enfin entrer dans la discussion. Le « moi aussi », couplé à « je t'aime tout autant », marque une pause dans la contradiction et une tentative de rapprochement."},
      {q:"« Ah tu vois, j'ai donc raison… » : que cherche H1 ?",i:"Interjection + « donc »…",m:"H1 cherche de nouveau le conflit, en tenant à avoir raison."},
      {q:"« Non… vraiment rien… Rien qu'on puisse dire… » : que nous dit ce « rien » sur le langage ?",i:"Ce « rien » désigne-t-il vraiment rien ?",m:"Le « rien » est répété (anadiplose) et complété par la relative « qu'on puisse dire » : il désigne bien quelque chose, un problème, mais le langage semble impuissant à l'exprimer. Les pronoms sans référent (« ça », « le ») donnent l'impression d'un discours qui tourne en rond."},
     ]},
   ],
   synthese:"Cette scène d'exposition ne respecte pas la tradition informative des premières scènes : on ne sait rien du lien entre les personnages, ni du décor, de l'époque ou de l'intrigue. Elle se concentre sur le nœud du problème : la relation entre H1 et H2 et les raisons de leur éloignement. Les modalisateurs, les indéfinis (« quelque chose », « rien »), les aposiopèses et l'alternance entre affirmation et négation, qui fait écho au titre, montrent dès la première scène que le langage sera au centre de la pièce : il ne clarifie rien et ne réconcilie pas."},

  {id:3,numero:'EL 3',titre:"« C'est bien, ça »",auteur:'Nathalie Sarraute',
   problematique:"Comment le dévoilement du motif, d'apparence dérisoire, de la dispute permet-il de réfléchir sur ce qui se cache derrière le langage quotidien ?",
   mouvements:["l. 1 à 17 : La montée du suspens","l. 17 à la fin : La révélation décevante"],
   passages:[
    {mvt:1,l:"l. 1-3",t:"La pression de H1",
     repere:{c:"Clique sur les deux impératifs.",f:"H. 1 : [[Allons]], [[vas-y]]…",e:"Le double impératif : H1 insiste lourdement, la pression atteint son paroxysme."},
     qs:[
      {q:"Quel effet produit le double impératif « Allons, vas-y… » ?",i:"Depuis quand H1 presse-t-il son ami ?",m:"H1 ne tient plus et insiste lourdement pour que son ami révèle la raison de son éloignement. Cette pression, commencée dès la première réplique de la pièce, atteint ici son paroxysme : c'est un véritable combat verbal."},
      {q:"« c'est juste des mots » : pourquoi l'adverbe « juste » peut-il être entendu de manière ironique par le public ?",i:"De quoi parle toute la pièce ?",m:"Avec la double énonciation, le public entend l'ironie : ces simples « mots » sont tout le sujet de la pièce, et l'on comprend qu'ils signifient bien souvent plus qu'ils n'en ont l'air."},
      {q:"« Des mots ? Entre nous ? » : que montre la double interrogation ? Qu'a-t-elle de paradoxal ?",i:"Que sont-ils en train de faire, justement ?",m:"Elle montre que H1 est outré. Pourtant, il y a bien « des mots » entre eux : c'est bel et bien une dispute."},
     ]},
    {mvt:1,l:"l. 4-6",t:"Les mots qu'on n'a pas « eus »",
     repere:{c:"Clique sur le mot que H2 met entre guillemets.",f:"pas ceux dont on dit qu'on les a [[« eus »]]... Des mots qu'on n'a pas [[« eus »]], justement...",e:"H2 détache ce mot du reste de la phrase : l'acteur doit changer de ton pour faire entendre les guillemets."},
     qs:[
      {q:"Sur quelle expression H2 joue-t-il ? Que veut-il dire grâce au parallélisme de construction ?",i:"« Avoir des mots avec quelqu'un », ça veut dire…",m:"« Avoir des mots » signifie se disputer. Avec le parallélisme, H2 affirme que l'éloignement ne vient pas de ce qu'on a dit, mais des non-dits : ce qu'on a gardé en soi, les fameuses sous-conversations dont parle Sarraute."},
      {q:"Pourquoi ces guillemets sur « eus » sont-ils importants ? Comment le spectateur peut-il les percevoir ?",i:"Les guillemets ne s'entendent pas… sauf si l'acteur fait quelque chose.",m:"Les guillemets ne sont visibles qu'à l'écrit : l'acteur doit changer de ton. H2 focalise l'attention sur ce mot car il contient un drame potentiel : le conflit tapi dans le silence. Plus tard, H2 reprochera à H1 de parler « avec des guillemets », synonymes de mépris et d'ironie."},
      {q:"« On ne sait pas comment ils vous viennent… » : à quelle théorie de Sarraute cette négation renvoie-t-elle ?",i:"Des mots qui viennent d'avant la conscience…",m:"La négation totale rappelle l'idée des sous-conversations et des tropismes : des mots qui proviennent d'un pré-conscient."},
     ]},
    {mvt:1,l:"l. 7-9",t:"L'impatience",
     qs:[
      {q:"« Lesquels ? Quels mots ? Tu me fais languir… tu me taquines… » : dans quelle position est H1 ?",i:"Qui demande, qui refuse ?",m:"H1 est dans la position de celui qui demande, et il perd patience, comme le montrent les affirmations « tu me taquines », « tu me fais languir »."},
      {q:"« Mais si je te les dis… » : qu'a de particulier cette subordonnée de condition ? Quel effet ?",i:"Où est la suite de la phrase ?",m:"La subordonnée de condition est coupée : il manque la principale qui donnerait la conséquence. La phrase sonne comme une menace et souligne le poids des mots : une fois prononcés, ils peuvent être terribles."},
     ]},
    {mvt:1,l:"l. 10-12",t:"« ce rien »",
     repere:{c:"Clique sur le groupe où « rien » devient « quelque chose ».",f:"Mais justement, ce n'est rien... Et c'est à cause de [[ce rien]]…",e:"Le déterminant « ce » précise le « rien » : c'est bien quelque chose."},
     qs:[
      {q:"Que change le déterminant dans « ce rien » ?",i:"Peut-on mettre un déterminant devant un vrai « rien » ?",m:"Le déterminant précise que « ce rien » est bien quelque chose. On reste dans le flou, mais une précision apparaît : l'éloignement vient de quelque chose qui semble insignifiant, « un tout petit rien »."},
      {q:"La didascalie « soupire » et le « Oui » de H2 : qu'ont-ils de remarquable ?",i:"H2 dit-il souvent « oui » ?",m:"La didascalie traduit l'agacement de H2, sa fatigue, son renoncement. Et c'est la première fois qu'il répond « oui » : d'ordinaire, c'est H1 qui est du côté du oui, et lui du côté du non."},
     ]},
    {mvt:1,l:"l. 12-17",t:"Le défi",
     qs:[
      {q:"« Tu ne comprendras jamais… Personne… Vous l'êtes tous, du reste » : comment H2 se présente-t-il ?",i:"Regarde le passage de « tu » à « personne » et à « vous ».",m:"H2 met son ami sur le même plan que « personne » et « vous », le reste du monde : il s'affirme comme une personne singulière, qui sort du lot, mais surtout comme un incompris. La répétition de « du reste » est un tic de langage qui distingue sa parole."},
      {q:"« Alors, chiche » : que montre cette interjection ?",i:"Qu'est-ce qu'on dit quand on lance un défi ?",m:"Les deux personnages sont dans une joute verbale : avec cette interjection, H1 défie son ami."},
     ]},
    {mvt:2,l:"l. 18-20",t:"L'aveu",
     repere:{c:"Clique sur l'expression que H2 répète avant d'avouer.",f:"[[tu m'as dit]] il y a quelque temps... [[tu m'as dit]]... quand je me suis vanté",e:"La répétition (trois fois dans le passage) montre la difficulté d'avouer et fait encore monter le suspens."},
     qs:[
      {q:"Pourquoi H2 répète-t-il « tu m'as dit » ?",i:"Sait-il comment son aveu va être reçu ?",m:"Le problème de H2 réside bien dans ce que H1 lui a dit. La répétition souligne aussi sa difficulté à avouer, car il sait comment ce sera pris. Le suspens monte encore d'un cran."},
      {q:"« C'est bien… ça… » : pourquoi cette chute est-elle comique ?",i:"Compare la longueur de l'attente et la longueur de la phrase avouée.",m:"La chute est comique : ces trois mots semblent absolument insignifiants au regard du temps qu'il a fallu à H2 pour les dire."},
     ]},
    {mvt:2,l:"l. 21-24",t:"L'incompréhension",
     qs:[
      {q:"« j'ai dû mal entendre » / « Ce n'est pas vrai. Ça ne peut pas être ça… ce n'est pas possible… » : que montre cette suite de négations ?",i:"H1 réagit-il comme le public ?",m:"Comme le public et le lecteur, H1 est dérouté : il ne comprend pas du tout ce que H2 veut lui faire comprendre, cela lui semble même risible."},
      {q:"« Juste avec ce suspens… cet accent… » : que cherche à montrer H2 ?",i:"Regarde les deux déterminants démonstratifs.",m:"Avec les démonstratifs « ce », « cet », H2 se lance dans une démonstration sonore : ce ne sont pas les mots seuls qui comptent, mais la manière dont ils sont prononcés. L'intonation peut révéler les intentions profondes du locuteur."},
      {q:"« à quoi bon ? » : dans quelle position H2 se place-t-il ?",i:"Question rhétorique…",m:"Par cette question rhétorique, H2 se place une fois de plus en position de victime, d'incompris."},
     ]},
    {mvt:2,l:"l. 25-30",t:"La démonstration de H2",
     repere:{c:"Clique sur les mots par lesquels H2 décrit l'intonation de H1.",f:"un [[intervalle]] plus grand… Un [[étirement]]… et un [[suspens]] avant que « ça » arrive",e:"H2 décompose les trois mots instant par instant : c'est la démonstration du tropisme."},
     qs:[
      {q:"« Tu m'aurais fait part d'une réussite... quelle réussite d'ailleurs… » : de quelles deux façons peut-on entendre la fin ?",i:"Recherche sincère… ou petite pique ?",m:"Soit H1 cherche parmi les réussites de H2, soit c'est une ironie, comme s'il insinuait qu'il n'en a pas eu. C'est le cœur du problème : H2 reproche justement à H1 son mépris pour ses réussites. Le conditionnel et le vocabulaire de l'illusion (« si je rêve », « si je me trompe ») instaurent un léger doute."},
      {q:"« C'est biiien…… ça... » : comment H2 explique-t-il la blessure ? Que signifie « ce n'est pas sans importance » ?",i:"C'est une litote : dire moins pour suggérer plus.",m:"H2 explique instant par instant comment les trois mots montraient que son ami ne trouvait pas cela si « bien » : ils révèlent le mépris. « Ce n'est pas sans importance » est une litote : cela a beaucoup d'importance."},
     ]},
    {mvt:2,l:"l. 31-fin",t:"Ce « ça »",
     qs:[
      {q:"« ce « ça » précédé d'un suspens t'a poussé à rompre… » : que devient le pronom « ça » ? Qu'entend-on dans la voix de H1 ?",i:"Depuis l'exposition, les pronoms indéfinis sans référent sont partout…",m:"Le pronom indéfini « ça », précisé par le déterminant « ce », a enfin un objet. Pourtant, ce qui devrait être concret est une énigme de plus : comment « ça » peut-il conduire à se séparer d'un ami ? On sent la perplexité et l'ironie de H1, et l'on commence à comprendre ce qui, dans son ton, a pu irriter son ami."},
     ]},
   ],
   synthese:"Dans cette scène, le questionnement de H1 culmine en une chute comique : la révélation du fameux « C'est bien… ça… ». Mais derrière le dérisoire, Sarraute met en place sa théorie des tropismes et de la sous-conversation : le langage d'apparence simple et banal laisse apparaître une complexité cachée sous le ton, et pose la question de l'intention de la parole. H2 essaie d'éduquer son ami aux complexités de la parole en lui démontrant ce qui a pu le heurter dans ces trois mots d'apparence inoffensifs."},

  {id:4,numero:'EL 4',titre:"Le dénouement",auteur:'Nathalie Sarraute',
   problematique:"En quoi le dénouement de Pour un oui ou pour un non se présente-t-il comme une résolution ambiguë ?",
   mouvements:["l. 1 à 12 : D'accord pour ne pas être d'accord : la rupture comme solution","l. 13 à 29 : Le dénouement ravi : le jugement de la société","l. 30 à la fin : Une fin cyclique qui relance le duel"],
   passages:[
    {mvt:1,l:"l. 1-4",t:"Le cauchemar de H2",
     repere:{c:"Clique sur le champ lexical de l'enfermement.",f:"je suis dans un édifice [[fermé de tous côtés]]... partout des [[compartiments]], des [[cloisons]]",e:"La métaphore de l'édifice décrit un cauchemar : le personnage est piégé, comme chez Kafka."},
     qs:[
      {q:"« puisque nous en sommes là… » : quelle proposition, et à quelle réplique de la scène d'exposition répond-elle ?",i:"Souviens-toi : « Nous n'en sommes tout de même pas là… »",m:"C'est une subordonnée circonstancielle de cause. Elle répond au « nous n'en sommes tout de même pas là… » de la scène d'exposition : le « là » est désormais explicité, c'est la rupture de l'amitié, le moment où les choses sont dites sans détour."},
      {q:"« c'est comme de la claustrophobie… » : à quoi répond cette comparaison ?",i:"Juste avant, H1 a décrit ce qu'il ressent chez H2 : des sables…",m:"C'est le début de la description d'un cauchemar : pour justifier la rupture, il faut en arriver à un point de non-retour. H1 vient de décrire les « sables mouvants » où il se sent piégé ; la claustrophobie répond à cette métaphore, c'est la même sensation de piège."},
     ]},
    {mvt:1,l:"l. 6-8",t:"Une question de vie ou de mort",
     qs:[
      {q:"« Du mal à reprendre vie… inerte » / « cette pulsation, un pouls qui se remet à battre » : quels champs lexicaux s'opposent ? Quel sens prend la rupture ?",i:"La relation d'un côté… la vie de l'autre.",m:"Le champ lexical de la mort s'oppose en antithèse à celui de la vie et du cœur. On retrouve le manichéisme de la pièce : dans la relation, c'est la mort ; la vie est ailleurs (noir/blanc, oui/non). La rupture devient une question de vie ou de mort."},
     ]},
    {mvt:1,l:"l. 8-10",t:"Un accord dans le silence",
     qs:[
      {q:"« alors tu vois » / « Oui. Je vois. » : quel procédé ? Qu'a ce moment de rare ?",i:"H1 reprend les mots de H2…",m:"C'est une anadiplose : un des rares moments du texte où les personnages sont d'accord. H1 répond par l'affirmative : ils se comprennent enfin."},
      {q:"Que représente la didascalie « Un silence » ?",i:"Que décident-ils sans le dire ?",m:"C'est le moment de la prise de conscience : la décision de rupture est actée dans le silence."},
      {q:"« À quoi bon s'acharner ? » : à quoi fait écho cette question rhétorique ? Que résume « s'acharner » ?",i:"Le « à quoi bon » était déjà prononcé plus tôt dans la pièce…",m:"Elle répond au « à quoi bon » déjà présent au début. « S'acharner » résume ce qu'ils ont fait pendant toute la pièce : une lutte vaine contre l'incommunicabilité. Mais le découragement s'est déplacé : ils sont d'accord pour abandonner, donc pour rompre."},
     ]},
    {mvt:1,l:"l. 11-13",t:"La « meilleure solution »",
     repere:{c:"Clique sur les deux comparatifs et le superlatif.",f:"Ce serait tellement [[plus sain]]… Pour chacun de nous... [[plus salutaire]]… [[La meilleure]] solution…",e:"Gradation : deux comparatifs puis un superlatif. L'accord monte crescendo."},
     qs:[
      {q:"Comment lire cette suite de stichomythies « plus sain / plus salutaire / la meilleure solution » ?",i:"On dirait presque une seule phrase dite à deux voix… Et que signifient « sain » et « salutaire » ?",m:"La suite de stichomythies peut se lire comme une seule phrase poursuivie de concert : elle symbolise leur accord. « Sain » renvoie à la santé (la relation est mauvaise pour eux), « salutaire » au salut, à la survie. Le superlatif monte crescendo, et le mot « solution » renvoie au dénouement : on croit que la pièce va finir ainsi."},
     ]},
    {mvt:2,l:"l. 13-15",t:"Le retournement",
     qs:[
      {q:"« Mais tu sais bien comment nous sommes » : quel retournement ? Que montre le « nous » ?",i:"La conjonction s'oppose à « la meilleure solution »…",m:"La conjonction « mais » opère un retournement de situation. Le « nous » et le « tu sais bien comment nous sommes » sont les marques d'une complicité retrouvée… dans la rupture."},
      {q:"« Même toi, tu n'as pas osé le prendre sur toi. » / « J'ai besoin qu'on m'autorise. » : que remarques-tu sur les pronoms « le » et « on » ?",i:"Peut-on dire à quoi renvoie « le » ? Qui est « on » ?",m:"Le référent de « le » reste flou : on comprend que H2 n'a pas osé rompre, il s'est juste éloigné. Quant au « on » indéfini, qui est-ce ? La réplique semble étonnamment enfantine."},
     ]},
    {mvt:2,l:"l. 15-18",t:"Une boucle plutôt qu'une issue",
     qs:[
      {q:"« si on introduisait une demande… à nous deux, cette fois… » : H1 propose-t-il vraiment une solution ?",i:"Une demande… comme celle que H2 a déjà faite, devant les voisins ?",m:"L'hypothèse au conditionnel n'est pas une vraie résolution : c'est un retour en arrière, vers la scène de jugement déjà vue avec les voisins. H1 propose une sorte de théâtre dans le théâtre, où ils rejoueraient la scène en « équipe ». Sa solution est une boucle dramatique, pas une issue. Il manque d'ailleurs les compléments : l'objet de la demande reste ambigu."},
      {q:"« Non... à quoi bon ? » : à quel théâtre cette réplique fait-elle penser ?",i:"Vladimir et Estragon attendent quelqu'un qui ne vient jamais…",m:"La répétition et la négation rappellent les personnages du théâtre de l'Absurde, comme Vladimir et Estragon dans En attendant Godot, qui prennent conscience de la vanité de l'existence. Comme toujours, H2 est du côté du négatif."},
     ]},
    {mvt:2,l:"l. 18-22",t:"Le procès imaginaire",
     repere:{c:"Clique sur les métaphores de la pièce que la « société » ne comprend pas.",f:"Quelles [[taupes]] ? Quelles [[pelouses]] ? Quels [[sables mouvants]] ? Quels [[camps ennemis]] ?",e:"Hors de leur contexte, les métaphores de H1 et H2 deviennent absurdes pour les juges."},
     qs:[
      {q:"H2 imagine les paroles des juges. Quel procédé ? Que montre cette suite de questions ?",i:"On donne la parole à un « ils » absent… Et que deviennent les métaphores hors contexte ?",m:"C'est une prosopopée de la société. Les questions rhétoriques montrent l'incompréhension et soulignent l'absurdité des métaphores quand on n'a pas le contexte : Sarraute démontre la complexité du langage. Les guillemets deviennent la frontière entre la société et les personnages. Le vocabulaire administratif (« leurs dossiers ») installe une enquête."},
      {q:"« rien d'autre nulle part que les signes d'une amitié parfaite… » : quel nouveau sens prend le « rien » ?",i:"Double négation + adjectif mélioratif.",m:"La double négation (« rien », « nulle part ») et l'adjectif mélioratif « parfaite » préfigurent les préjugés de la société. Le « rien » prend encore un autre sens : il redevient le « nul et non avenu », l'absence de quelque chose."},
     ]},
    {mvt:2,l:"l. 23-29",t:"La condamnation",
     qs:[
      {q:"« déboutés tous les deux » / « quelle honte » : comment la société juge-t-elle leur décision ?",i:"« Débouté » est un mot du vocabulaire juridique.",m:"« Débouté » signifie : dont la demande en justice est rejetée. Les deux « aucun(e) » montrent que la résolution n'est décidément pas possible, et l'exclamation « quelle honte » stigmatise H1 et H2, qui s'écartent de la norme sociale."},
      {q:"« On sait quelles peines encourent ceux qui ont l'outrecuidance… » : quel champ lexical ? Que suggère le mot « outrecuidance » ?",i:"Pense à l'hubris des héros antiques.",m:"Le champ lexical de l'accusation installe une menace : H2 poursuit son anticipation dystopique, ils sont déclarés « coupables ». « Outrecuidance » renvoie à l'hubris antique : ils osent défier les normes sociales, ils doivent être punis."},
      {q:"« ils peuvent rompre pour un oui ou pour un non » : quel est l'intérêt de cette phrase ?",i:"Où as-tu déjà lu cette expression ?",m:"C'est l'illumination : l'explication du titre de la pièce. Elle aurait pu s'arrêter là, sur cette pirouette finale."},
     ]},
    {mvt:3,l:"l. 30-32",t:"Une expression qui reprend vie",
     qs:[
      {q:"« Pour un oui... ou pour un non ? » + « Un silence » : que font les personnages de l'expression figée ?",i:"Ils s'arrêtent sur chaque mot, comme pour l'entendre vraiment.",m:"Ils la délexicalisent : en s'y arrêtant longuement, ils la rendent vivante et en mesurent tous les sens. Ils refusent de réduire leur dispute à quelque chose de dérisoire. Si leur amitié est morte, quelque chose de nouveau les unit : un certain sens de l'écoute. Le silence suggère le doute : la machine à recherche se relance."},
      {q:"« Ce n'est pourtant pas la même chose… » : quelle réflexion cette réplique engage-t-elle ?",i:"Oui et non : même fonction… mais même sens ?",m:"Elle engage une réflexion presque grammaticale sur les deux adverbes, équivalents par leur fonction, opposés par leur contenu. Les personnages reviennent au plus simple du langage : le oui et le non, le duel ultime."},
     ]},
    {mvt:3,l:"l. 33-fin",t:"« Oui. » / « Non ! »",
     qs:[
      {q:"Comment interpréter les deux exclamations finales ? Qui sort vainqueur du duel ?",i:"Peuvent-ils tomber d'accord, même sur la rupture ? Pense à Beckett.",m:"Il est impossible de déterminer un vainqueur : les exclamations relancent le duel et montrent qu'ils ne peuvent pas tomber d'accord, même sur la rupture. C'est le langage qui sort vainqueur : il reste cryptique, insondable, inopérant. On peut y voir la marque du tragique, et une fin cyclique proche du théâtre de l'Absurde (Fin de partie, En attendant Godot)."},
     ]},
   ],
   synthese:"Le dénouement semble d'abord trouver une solution : H1 et H2 se mettent d'accord pour ne pas être d'accord, la rupture apparaît comme « la meilleure solution ». Mais ce dénouement est ravi par le jugement de la société, qui les condamnerait comme ceux qui rompent « pour un oui ou pour un non ». Enfin, en délexicalisant l'expression du titre, les personnages relancent le duel : « Oui. » / « Non ! ». La résolution est donc ambiguë : aucun vainqueur, une fin cyclique, et un langage qui reste, jusqu'au bout, plus fort que les personnages."},
];

function parseFragment(f){
  const out=[];
  f.split(/(\[\[.*?\]\])/).forEach(part=>{
    if(!part)return;
    if(part.startsWith('[[')) out.push({t:part.slice(2,-2),target:true});
    else part.split(/\s+/).filter(Boolean).forEach(w=>out.push({t:w,target:false}));
  });
  return out.map((tok,k)=>({...tok,k}));
}

function Repere({r}){
  const toks=parseFragment(r.f);
  const [sel,setSel]=useState([]);
  const [checked,setChecked]=useState(false);
  const toggle=k=>{if(checked)return;setSel(s=>s.includes(k)?s.filter(x=>x!==k):[...s,k]);};
  const nbT=toks.filter(t=>t.target).length;
  const found=toks.filter(t=>t.target&&sel.includes(t.k)).length;
  const wrong=toks.filter(t=>!t.target&&sel.includes(t.k)).length;
  return(
    <div style={{background:'var(--sky)',border:'2px solid var(--ink)',borderRadius:16,padding:'14px 16px',marginBottom:16}}>
      <span className="kicker">🔎 Repérage</span>
      <p style={{fontWeight:600,fontSize:14.5,margin:'10px 0'}}>{r.c}</p>
      <p style={{fontFamily:'var(--serif)',fontSize:18,lineHeight:2.1,background:'#fff',border:'2px solid var(--ink)',borderRadius:12,padding:'8px 12px'}}>
        {toks.map(tok=>{
          const on=sel.includes(tok.k);
          let bg=on?'var(--yellow)':'transparent',deco='none',bd='transparent';
          if(checked){
            if(tok.target&&on){bg='var(--mint)';}
            else if(tok.target){bg='transparent';bd='var(--plum)';}
            else if(on){bg='#ffd0c6';deco='line-through';}
          }
          return(
            <React.Fragment key={tok.k}>
              <button onClick={()=>toggle(tok.k)} disabled={checked} style={{font:'inherit',background:bg,border:`2px dashed ${bd}`,borderRadius:6,padding:'0 3px',textDecoration:deco,cursor:checked?'default':'pointer',color:'inherit'}}>{tok.t}</button>{' '}
            </React.Fragment>
          );
        })}
      </p>
      {!checked
        ?<button onClick={()=>setChecked(true)} disabled={!sel.length} style={{...s.btn,marginTop:10,opacity:sel.length?1:0.5}}>Vérifier</button>
        :<div className="fade" style={{marginTop:10}}>
          <p style={{fontWeight:700}}>{found===nbT&&!wrong?'✓ Parfait !':`${found}/${nbT} trouvé${found>1?'s':''}${wrong?` · ${wrong} en trop`:''}`}{found<nbT&&<span style={{fontWeight:400,fontSize:13}}> (les mots manqués sont encadrés)</span>}</p>
          <p style={{fontSize:14,marginTop:4,lineHeight:1.55}}>{r.e}</p>
          <button onClick={()=>{setSel([]);setChecked(false);}} style={{...s.btn,marginTop:8,fontSize:12}}>↺ Recommencer</button>
        </div>}
    </div>
  );
}

function QuestionAtelier({q,n,ev,onEval}){
  const [rep,setRep]=useState('');
  const [hint,setHint]=useState(false);
  const [model,setModel]=useState(false);
  const EVALS=[[2,'✅ Je l\'avais','var(--mint)'],[1,'½ En partie','var(--yellow)'],[0,'❌ Pas du tout','#ffd0c6']];
  return(
    <div style={{borderTop:'2px dashed rgba(22,18,29,0.15)',paddingTop:16,marginTop:16}}>
      <p style={{fontWeight:700,fontSize:15.5,lineHeight:1.45}}><span style={{display:'inline-grid',placeItems:'center',width:26,height:26,borderRadius:'50%',background:'var(--ink)',color:'#fff',fontSize:13,marginRight:8}}>{n}</span>{q.q}</p>
      <textarea value={rep} onChange={e=>setRep(e.target.value)} placeholder="Ta réponse, en une ou deux phrases : nomme le procédé, puis explique l'effet…" style={{minHeight:90,marginTop:10}}/>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8,alignItems:'center'}}>
        <button onClick={()=>setHint(h=>!h)} style={{...s.btn,fontSize:12}}>💡 {hint?'Masquer l\'indice':'Indice'}</button>
        <button onClick={()=>setModel(true)} disabled={model||rep.trim().length<10} style={{...s.btn,fontSize:12,background:'var(--violet)',color:'#fff',opacity:model||rep.trim().length<10?0.5:1}}>👁 Voir la réponse modèle</button>
        {!model&&rep.trim().length<10&&<button onClick={()=>setModel(true)} style={{background:'none',border:'none',textDecoration:'underline',fontSize:12,color:'var(--muted)',padding:0}}>je sèche, montre-moi</button>}
      </div>
      {hint&&<p className="fade" style={{marginTop:10,padding:'8px 12px',background:'#fffaf0',borderLeft:'3px solid var(--coral)',borderRadius:'0 8px 8px 0',fontSize:14}}>💡 {q.i}</p>}
      {model&&(
        <div className="fade" style={{marginTop:12,padding:'12px 14px',background:'var(--mint)',border:'2px solid var(--ink)',borderRadius:14}}>
          <span className="kicker">Réponse modèle</span>
          <p style={{fontSize:14.5,lineHeight:1.6,marginTop:8}}>{q.m}</p>
          <p style={{fontSize:12.5,fontWeight:700,marginTop:12}}>Compare avec ta réponse. Tu l'avais ?</p>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
            {EVALS.map(([v,l,c])=>(
              <button key={v} onClick={()=>onEval(v)} style={{...s.btn,fontSize:12,background:ev===v?c:'#fff',fontWeight:ev===v?800:600,outline:ev===v?'3px solid var(--ink)':'none'}}>{l}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function loadAtelier(){try{return JSON.parse(localStorage.getItem('atelier_el')||'{}');}catch(e){return {};}}
function saveAtelier(d){try{localStorage.setItem('atelier_el',JSON.stringify(d));}catch(e){}}

function AtelierEL(){
  const [elId,setElId]=useState(null);
  const [step,setStep]=useState(-1); // -1 intro, 0..n-1 passages, n synthèse
  const [store,setStore]=useState(loadAtelier);
  const [synth,setSynth]=useState('');
  const [showSynth,setShowSynth]=useState(false);
  const el=ATELIER_EL.find(e=>e.id===elId);
  const evals=(el&&store[el.id])||{};
  const setEval=(p,qi,v)=>{
    const next={...store,[el.id]:{...evals,[`${p}-${qi}`]:v}};
    setStore(next);saveAtelier(next);
  };
  const score=e=>{
    const d=store[e.id]||{};
    const tot=e.passages.reduce((a,p)=>a+p.qs.length,0);
    const pts=Object.values(d).reduce((a,v)=>a+v,0);
    return {tot,pct:Math.round(pts/(2*tot)*100),nb:Object.keys(d).length};
  };
  const go=st=>{setStep(st);window.scrollTo({top:0,behavior:'smooth'});};

  if(!el) return(
    <div>
      <div className="b" style={{background:'var(--lilac)',marginBottom:16}}>
        <span className="kicker">🧠 Atelier EL</span>
        <h3 style={{fontSize:'clamp(26px,4.5vw,36px)',margin:'10px 0 6px'}}>Explique le texte, passage par passage</h3>
        <p style={{fontSize:14.5,lineHeight:1.6,maxWidth:640}}>Comme à l'oral, tu avances dans l'ordre du texte. Pour chaque passage : un repérage sur quelques mots, puis des questions auxquelles tu réponds avec tes mots. Compare ensuite avec la réponse modèle et évalue-toi honnêtement.</p>
        <p style={{fontSize:13,marginTop:10,fontWeight:600}}>📄 Garde ton texte sous les yeux : les questions renvoient aux numéros de lignes.</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:14}}>
        {ATELIER_EL.map((e,k)=>{
          const sc=score(e);
          return(
            <button key={e.id} className="b" onClick={()=>{setElId(e.id);setStep(-1);setSynth('');setShowSynth(false);}} style={{background:['var(--yellow)','var(--pink)','var(--sky)','var(--mint)'][k%4],display:'flex',flexDirection:'column',gap:6}}>
              <span className="kicker" style={{alignSelf:'flex-start'}}>{e.numero}</span>
              <span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:22,lineHeight:1.1}}>{e.titre}</span>
              <span style={{fontSize:13}}>{e.auteur} · {e.passages.length} passages</span>
              <span style={{marginTop:6}}>
                <span style={{display:'block',height:10,border:'2px solid var(--ink)',borderRadius:999,background:'#fff',overflow:'hidden'}}><span style={{display:'block',height:'100%',width:`${sc.pct}%`,background:'var(--violet)'}}/></span>
                <span style={{fontSize:12,fontWeight:600}}>{sc.nb?`${sc.pct} % maîtrisé`:'Pas encore commencé'}</span>
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );

  const n=el.passages.length;
  const head=(
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12}}>
      <button onClick={()=>setElId(null)} style={{...s.btn,fontSize:12}}>← Tous les textes</button>
      <span className="chip" style={{background:'var(--yellow)'}}>{el.numero} · {el.titre}</span>
    </div>
  );
  const bar=(
    <div style={{display:'flex',gap:4,marginBottom:16}}>
      {el.passages.map((p,k)=>{
        const done=p.qs.every((_,qi)=>evals[`${k}-${qi}`]!==undefined);
        return <button key={k} onClick={()=>go(k)} title={`Passage ${k+1}`} style={{flex:1,height:12,border:'2px solid var(--ink)',borderRadius:999,padding:0,background:k===step?'var(--coral)':done?'var(--violet)':'#fff'}}/>;
      })}
      <button onClick={()=>go(n)} title="Synthèse" style={{width:28,height:12,border:'2px solid var(--ink)',borderRadius:999,padding:0,background:step===n?'var(--coral)':'var(--yellow)'}}/>
    </div>
  );

  if(step===-1) return(
    <div>
      {head}
      <div className="b" style={{background:'var(--surface)'}}>
        <span className="kicker" style={{background:'var(--lilac)'}}>Avant de commencer</span>
        <p style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--muted)',marginTop:16}}>Problématique</p>
        <p style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:'clamp(18px,2.6vw,22px)',lineHeight:1.45,marginTop:4}}>{el.problematique}</p>
        <p style={{fontSize:13,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--muted)',marginTop:16}}>Les mouvements</p>
        <ol style={{margin:'6px 0 0 20px',fontSize:15,lineHeight:1.7}}>{el.mouvements.map((m,k)=><li key={k}>{m}</li>)}</ol>
        <p style={{fontSize:13.5,marginTop:16,padding:'10px 12px',background:'var(--paper)',borderRadius:12,lineHeight:1.55}}>🎤 <strong>Astuce oral :</strong> avant d'écrire, dis ta réponse à voix haute, comme devant l'examinateur. Puis écris-la en une ou deux phrases.</p>
        <button onClick={()=>go(0)} style={{...s.btn,marginTop:16,padding:'12px 24px',fontSize:15,background:'var(--ink)',color:'#fff'}}>Commencer l'explication →</button>
      </div>
    </div>
  );

  if(step===n){
    const faibles=el.passages.map((p,k)=>({p,k,low:p.qs.some((_,qi)=>(evals[`${k}-${qi}`]??-1)<2)})).filter(x=>x.low);
    const sc=score(el);
    return(
      <div>
        {head}{bar}
        <div className="b" style={{background:'var(--yellow)'}}>
          <span className="kicker">✍️ Synthèse</span>
          <h3 style={{fontSize:24,margin:'10px 0 6px'}}>Réponds à la problématique en trois phrases</h3>
          <p style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:17,lineHeight:1.45}}>{el.problematique}</p>
          <textarea value={synth} onChange={e=>setSynth(e.target.value)} placeholder="Ainsi, … En effet, … Enfin, …" style={{minHeight:130,marginTop:12}}/>
          <button onClick={()=>setShowSynth(true)} disabled={synth.trim().length<20&&!showSynth} style={{...s.btn,marginTop:10,background:'var(--ink)',color:'#fff',opacity:synth.trim().length<20&&!showSynth?0.5:1}}>👁 Voir la conclusion du cours</button>
          {showSynth&&<div className="fade" style={{marginTop:12,padding:'12px 14px',background:'#fff',border:'2px solid var(--ink)',borderRadius:14,fontSize:14.5,lineHeight:1.6}}>{el.synthese}</div>}
        </div>
        <div className="b" style={{background:'var(--surface)',marginTop:16}}>
          <span className="kicker" style={{background:faibles.length?'var(--pink)':'var(--mint)'}}>{faibles.length?'À retravailler':'Bravo !'}</span>
          <p style={{fontWeight:700,fontSize:15,marginTop:10}}>Tu maîtrises {sc.pct} % de cette explication.</p>
          {faibles.length?(
            <ul style={{listStyle:'none',marginTop:10,display:'flex',flexDirection:'column',gap:8}}>
              {faibles.map(({p,k})=>(
                <li key={k}><button onClick={()=>go(k)} style={{...s.btn,width:'100%',textAlign:'left',boxShadow:'none'}}>Passage {k+1} · {p.l} · {p.t} →</button></li>
              ))}
            </ul>
          ):<p style={{fontSize:14,marginTop:6}}>Tu as tout réussi. Entraîne-toi maintenant à faire l'explication à voix haute, en 10 minutes, avec le Tirage !</p>}
          <button onClick={()=>{const nx={...store};delete nx[el.id];setStore(nx);saveAtelier(nx);go(-1);}} style={{background:'none',border:'none',textDecoration:'underline',fontSize:12,color:'var(--muted)',marginTop:14,padding:0}}>Remettre ma progression à zéro pour ce texte</button>
        </div>
      </div>
    );
  }

  const p=el.passages[step];
  return(
    <div>
      {head}{bar}
      <div className="b" key={`${el.id}-${step}`} style={{background:'var(--surface)'}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          <span className="kicker" style={{background:'var(--lilac)'}}>Mouvement {p.mvt}</span>
          <span className="kicker">{p.l}</span>
          <span className="kicker" style={{background:'var(--paper)'}}>Passage {step+1}/{n}</span>
        </div>
        <h3 style={{fontSize:'clamp(22px,3.6vw,28px)',lineHeight:1.15,marginBottom:6}}>{p.t}</h3>
        <p style={{fontSize:13.5,color:'var(--muted)',marginBottom:16}}>📄 Relis les {p.l.replace('l.','lignes')} de ton texte.</p>
        {p.repere&&<Repere r={p.repere}/>}
        {p.qs.map((q,qi)=><QuestionAtelier key={qi} q={q} n={qi+1} ev={evals[`${step}-${qi}`]} onEval={v=>setEval(step,qi,v)}/>)}
        <div style={{display:'flex',justifyContent:'space-between',gap:8,marginTop:20,flexWrap:'wrap'}}>
          <button onClick={()=>go(step-1)} style={{...s.btn}}>{step===0?'← Problématique':'← Passage précédent'}</button>
          <button onClick={()=>go(step+1)} style={{...s.btn,background:'var(--ink)',color:'#fff'}}>{step+1>=n?'Synthèse →':'Passage suivant →'}</button>
        </div>
      </div>
    </div>
  );
}

function FichesAccordeon({blocs}){
  const [open,setOpen]=useState(0);
  return(
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      {blocs.map((bloc,i)=>(
        <div key={i} style={{...s.card,padding:0,overflow:'hidden'}}>
          <button onClick={()=>setOpen(open===i?-1:i)} style={{width:'100%',textAlign:'left',padding:'1rem 1.25rem',background:open===i?'var(--paper)':'none',border:'none',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
            <span style={{fontSize:15,fontWeight:700}}>{bloc.icon} {bloc.titre}</span>
            <span>{open===i?'▲':'▼'}</span>
          </button>
          {open===i&&(
            <div className="fade" style={{padding:'0 1.25rem 1.25rem',borderTop:'2px solid var(--ink)'}}>
              {bloc.table?(
                <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:12}}>
                  {bloc.table.map((row,j)=>(
                    <div key={j} style={{border:'2px solid var(--ink)',borderRadius:14,padding:'0.75rem 1rem',background:j%2?'#fff':'var(--paper)'}}>
                      <p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{row.cat}</p>
                      <ul style={{margin:'0 0 0 18px',fontSize:14,lineHeight:1.7}}>{row.items.map((it,k)=><li key={k}>{it}</li>)}</ul>
                    </div>
                  ))}
                </div>
              ):(
                bloc.contenu.map((sec,j)=>(
                  <div key={j} style={{marginTop:14}}>
                    <p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6,color:'var(--plum)'}}>{sec.sous}</p>
                    <ul style={{margin:'0 0 0 18px',fontSize:14,lineHeight:1.75}}>{sec.items.map((it,k)=><li key={k}>{it}</li>)}</ul>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function GrilleAutoEval({groupes}){
  const [coche,setCoche]=useState({});
  const total=groupes.reduce((a,g)=>a+g.items.length,0);
  const nb=Object.values(coche).filter(Boolean).length;
  return(
    <div className="b" style={{background:'var(--mint)',marginTop:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <span className="kicker">✅ Grille d'auto-évaluation</span>
        <span className="chip">{nb}/{total}</span>
      </div>
      <p style={{fontSize:14,margin:'10px 0 4px'}}>Avant de rendre ta copie, coche ce que tu as vérifié.</p>
      {groupes.map((g,gi)=>(
        <div key={gi} style={{marginTop:12}}>
          <p style={{fontSize:12,fontWeight:800,textTransform:'uppercase',letterSpacing:'0.06em'}}>{g.cat}</p>
          {g.items.map((it,k)=>{
            const id=`${gi}-${k}`;
            return(
              <label key={k} style={{display:'flex',gap:10,alignItems:'flex-start',fontSize:14,lineHeight:1.5,padding:'5px 0',cursor:'pointer'}}>
                <input type="checkbox" checked={!!coche[id]} onChange={e=>setCoche(c=>({...c,[id]:e.target.checked}))} style={{width:18,height:18,marginTop:2,accentColor:'#16121d',flexShrink:0}}/>
                <span style={{textDecoration:coche[id]?'line-through':'none',opacity:coche[id]?0.6:1}}>{it}</span>
              </label>
            );
          })}
        </div>
      ))}
      {nb===total&&<p className="pop" style={{fontWeight:800,marginTop:12}}>🎉 Tout est vérifié, ta copie est prête !</p>}
      <button onClick={()=>setCoche({})} style={{...s.btn,marginTop:12,fontSize:12}}>↺ Tout décocher</button>
    </div>
  );
}

function Methode(){
  const [tab,setTab]=useState('oral');
  const [quiz,setQuiz]=useState(false);
  const TABS=[['oral',"🎤 L'oral"],['commentaire','✍️ Le commentaire'],['dissertation','🧭 La dissertation']];
  const intro={
    oral:["L'oral du bac","30 minutes de préparation, 30 minutes d'épreuve : l'explication linéaire, la question de grammaire, puis l'entretien.",'var(--pink)'],
    commentaire:["Le commentaire de texte","Une épreuve de l'écrit (4 h) : analyser un texte inconnu en deux ou trois axes, à partir de ses procédés.",'var(--sky)'],
    dissertation:["La dissertation","Une épreuve de l'écrit (4 h) : une réflexion argumentée sur une œuvre du programme et son parcours.",'var(--yellow)'],
  }[tab];
  const quizData={oral:[QUIZ_METHODE,[['n1','Niveau 1'],['n2','Niveau 2'],['n3','Niveau 3']]],commentaire:[QUIZ_COMMENTAIRE,[['n1','Quiz']]],dissertation:[QUIZ_DISSERTATION,[['n1','Quiz']]]}[tab];
  return(
    <div>
      <div className="b" style={{background:intro[2],marginBottom:'1.25rem'}}>
        <span className="kicker">📐 Méthode</span>
        <h2 style={{fontSize:'clamp(26px,4.5vw,36px)',lineHeight:1.05,margin:'10px 0 6px'}}>{intro[0]}</h2>
        <p style={{fontSize:14.5,lineHeight:1.55,maxWidth:640}}>{intro[1]}</p>
      </div>
      <div style={s.tabbar}>
        {TABS.map(([k,l])=><button key={k} style={s.tab(tab===k)} onClick={()=>{setTab(k);setQuiz(false);}}>{l}</button>)}
      </div>
      {!quiz&&(
        <div key={tab}>
          <FichesAccordeon blocs={tab==='oral'?METHODE:tab==='commentaire'?METHODE_COMMENTAIRE:METHODE_DISSERTATION}/>
          {tab==='commentaire'&&<GrilleAutoEval groupes={GRILLE_COMMENTAIRE}/>}
        </div>
      )}
      <button onClick={()=>setQuiz(q=>!q)} style={{...s.btn,marginTop:16,padding:'12px 20px',fontSize:14,background:quiz?'#fff':'var(--ink)',color:quiz?'var(--ink)':'#fff'}}>{quiz?'← Revenir aux fiches':'🎯 Me tester sur cette méthode'}</button>
      {quiz&&<div className="fade" style={{marginTop:16}}><QuizGeneric key={tab} data={quizData[0]} niveaux={quizData[1]}/></div>}
    </div>
  );
}

function CartesFigures(){
  const [sens,setSens]=useState('nom');
  const [deck,setDeck]=useState(()=>[...FIGURES].sort(()=>Math.random()-0.5));
  const [i,setI]=useState(0);
  const [flip,setFlip]=useState(false);
  const [aRevoir,setARevoir]=useState([]);
  const [fini,setFini]=useState(false);
  const restart=(liste)=>{setDeck([...(liste||FIGURES)].sort(()=>Math.random()-0.5));setI(0);setFlip(false);setARevoir([]);setFini(false);};
  const next=ok=>{
    if(!ok)setARevoir(a=>[...a,deck[i]]);
    if(i+1>=deck.length)setFini(true);else{setI(i+1);setFlip(false);}
  };
  if(fini) return(
    <div className="b" style={{background:'var(--yellow)',textAlign:'center'}}>
      <p style={{fontSize:40}}>🎉</p>
      <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:28}}>{deck.length-aRevoir.length}/{deck.length} figures sues</p>
      {aRevoir.length>0&&<p style={{fontSize:14,marginTop:8}}>À revoir : {aRevoir.map(f=>f.nom).join(' · ')}</p>}
      <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap',marginTop:16}}>
        {aRevoir.length>0&&<button onClick={()=>restart(aRevoir)} style={{...s.btn,background:'var(--ink)',color:'#fff'}}>Revoir les {aRevoir.length} ratées</button>}
        <button onClick={()=>restart()} style={s.btn}>🔄 Tout recommencer</button>
      </div>
    </div>
  );
  const f=deck[i];
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12}}>
        <div style={{display:'flex',gap:6}}>
          <button onClick={()=>{setSens('nom');setFlip(false);}} style={s.tab(sens==='nom')}>Nom → définition</button>
          <button onClick={()=>{setSens('def');setFlip(false);}} style={s.tab(sens==='def')}>Exemple → nom</button>
        </div>
        <span className="chip">{i+1} / {deck.length}</span>
      </div>
      <button className="b" onClick={()=>setFlip(v=>!v)} style={{width:'100%',minHeight:230,background:flip?'var(--mint)':'var(--surface)',textAlign:'center',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',gap:10,cursor:'pointer'}}>
        <span className="kicker" style={{background:'var(--lilac)'}}>{f.fam}</span>
        {!flip?(
          sens==='nom'
            ?<span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:'clamp(28px,5vw,40px)'}}>{f.nom}</span>
            :<span style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:'clamp(19px,3vw,24px)',lineHeight:1.4,maxWidth:560}}>« {f.ex} »{f.src&&<span style={{display:'block',fontFamily:'var(--sans)',fontStyle:'normal',fontSize:13,marginTop:6}}>{f.src}</span>}</span>
        ):(
          <span className="fade" style={{maxWidth:560}}>
            <span style={{display:'block',fontFamily:'var(--display)',fontWeight:800,fontSize:24}}>{f.nom}</span>
            <span style={{display:'block',fontSize:15,lineHeight:1.55,marginTop:6}}>{f.def}</span>
            <span style={{display:'block',fontFamily:'var(--serif)',fontStyle:'italic',fontSize:16,marginTop:10}}>« {f.ex} »{f.src&&` (${f.src})`}</span>
            <span style={{display:'block',fontSize:13.5,marginTop:10}}><strong>Effet possible :</strong> {f.effet}</span>
          </span>
        )}
        {!flip&&<span style={{fontSize:12.5,opacity:0.6}}>Touche la carte pour la retourner</span>}
      </button>
      {flip&&(
        <div className="fade" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:14}}>
          <button onClick={()=>next(false)} style={{...s.btn,padding:'12px',fontSize:14,background:'#ffd0c6'}}>❌ À revoir</button>
          <button onClick={()=>next(true)} style={{...s.btn,padding:'12px',fontSize:14,background:'var(--mint)'}}>✅ Je savais</button>
        </div>
      )}
    </div>
  );
}

function QuizFigures(){
  const N=10;
  const make=()=>[...FIGURES].sort(()=>Math.random()-0.5).slice(0,N).map(f=>{
    const autres=FIGURES.filter(x=>x.nom!==f.nom).sort((a,b)=>(b.fam===f.fam)-(a.fam===f.fam)||Math.random()-0.5).slice(0,6).sort(()=>Math.random()-0.5).slice(0,3);
    return {f,opts:[f,...autres].sort(()=>Math.random()-0.5)};
  });
  const [qs,setQs]=useState(make);
  const [i,setI]=useState(0);
  const [ans,setAns]=useState(null);
  const [score,setScore]=useState(0);
  const [fini,setFini]=useState(false);
  const restart=()=>{setQs(make());setI(0);setAns(null);setScore(0);setFini(false);};
  if(fini){
    const stars=score>=9?3:score>=7?2:score>=5?1:0;
    return(
      <div className="b" style={{background:'var(--yellow)',textAlign:'center'}}>
        <Stars n={stars}/>
        <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:48,margin:'8px 0 4px'}}>{score}/{qs.length}</p>
        <p style={{fontWeight:600}}>{stars===3?'Tu reconnais les figures comme un pro !':stars>=1?'Bien ! Revois les cartes pour progresser.':'Passe par les cartes, puis retente ta chance.'}</p>
        <button onClick={restart} style={{...s.btn,marginTop:14,background:'var(--ink)',color:'#fff'}}>🔄 Rejouer</button>
      </div>
    );
  }
  const q=qs[i];
  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:12}}>
        <span className="chip">Question {i+1} / {qs.length}</span>
        <span className="chip" style={{background:'var(--yellow)'}}>Score : {score}</span>
      </div>
      <div className="b" style={{background:'var(--surface)',textAlign:'center',padding:'1.75rem 1.25rem'}}>
        <span className="kicker" style={{background:'var(--lilac)'}}>Quelle est cette figure ?</span>
        <p key={i} className="fade" style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:'clamp(19px,3.2vw,26px)',lineHeight:1.4,margin:'1rem auto 0',maxWidth:620}}>« {q.f.ex} »</p>
        {q.f.src&&<p style={{fontSize:13,marginTop:6}}>{q.f.src}</p>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:10,marginTop:14}}>
        {q.opts.map(o=>{
          let bg='#fff';
          if(ans){if(o.nom===q.f.nom)bg='var(--mint)';else if(o.nom===ans)bg='#ffd0c6';}
          return <button key={o.nom} onClick={()=>{if(ans)return;setAns(o.nom);if(o.nom===q.f.nom)setScore(x=>x+1);}} disabled={!!ans} style={{...s.btn,padding:'12px',fontSize:15,background:bg,borderRadius:14}}>{o.nom}</button>;
        })}
      </div>
      {ans&&(
        <div className={'b fade'+(ans===q.f.nom?'':' shake')} style={{marginTop:14,background:ans===q.f.nom?'var(--mint)':'#ffd9d1'}}>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:19}}>{ans===q.f.nom?'✓ Bien vu !':`✗ C'est : ${q.f.nom}`}</p>
          <p style={{fontSize:14.5,marginTop:6,lineHeight:1.55}}>{q.f.def}</p>
          <p style={{fontSize:14,marginTop:6}}><strong>Effet possible :</strong> {q.f.effet}</p>
          <button onClick={()=>{if(i+1>=qs.length)setFini(true);else{setI(i+1);setAns(null);}}} style={{...s.btn,marginTop:12,background:'var(--ink)',color:'#fff'}}>{i+1>=qs.length?'Voir mon score →':'Question suivante →'}</button>
        </div>
      )}
    </div>
  );
}

function MemoryFigures(){
  const NIV={facile:6,difficile:8};
  const [niv,setNiv]=useState(null);
  const [cards,setCards]=useState([]);
  const [up,setUp]=useState([]);
  const [found,setFound]=useState([]);
  const [moves,setMoves]=useState(0);
  const [last,setLast]=useState(null);
  const [t0,setT0]=useState(0);
  const [now,setNow]=useState(0);
  const [best,setBest]=useState(()=>{try{return JSON.parse(localStorage.getItem('memory_figures')||'{}');}catch(e){return {};}});
  const lock=useRef(false);
  const start=n=>{
    const figs=[...FIGURES].sort(()=>Math.random()-0.5).slice(0,NIV[n]);
    const deck=figs.flatMap(f=>[{f,kind:'nom'},{f,kind:'ex'}]).sort(()=>Math.random()-0.5).map((c,k)=>({...c,k}));
    setNiv(n);setCards(deck);setUp([]);setFound([]);setMoves(0);setLast(null);setT0(Date.now());setNow(Date.now());lock.current=false;
  };
  const fini=niv&&found.length===NIV[niv];
  useEffect(()=>{
    if(!niv||fini)return;
    const id=setInterval(()=>setNow(Date.now()),500);
    return()=>clearInterval(id);
  },[niv,fini]);
  useEffect(()=>{
    if(!fini)return;
    const prev=best[niv];
    if(!prev||moves<prev){const nb={...best,[niv]:moves};setBest(nb);try{localStorage.setItem('memory_figures',JSON.stringify(nb));}catch(e){}}
  },[fini]);
  const secs=Math.floor(((fini?now:now)-t0)/1000);
  const clock=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;
  const flip=c=>{
    if(lock.current||up.includes(c.k)||found.includes(c.f.nom))return;
    if(up.length===0){setUp([c.k]);return;}
    const a=cards[up[0]];
    setUp([up[0],c.k]);setMoves(m=>m+1);
    if(a.f.nom===c.f.nom){
      setTimeout(()=>{setFound(fd=>[...fd,c.f.nom]);setUp([]);setLast(c.f);},450);
    }else{
      lock.current=true;
      setTimeout(()=>{setUp([]);lock.current=false;},1100);
    }
  };

  if(!niv) return(
    <div className="b" style={{background:'var(--lilac)',textAlign:'center',padding:'2.25rem 1.25rem'}}>
      <div style={{fontSize:44}}>🧠</div>
      <h3 style={{fontSize:'clamp(28px,5vw,40px)',margin:'8px 0'}}>Le Memory des figures</h3>
      <p style={{maxWidth:480,margin:'0 auto',fontSize:15,lineHeight:1.6}}>Retourne les cartes deux par deux et associe chaque <strong>figure</strong> à son <strong>exemple</strong>. Le moins de coups possible !</p>
      <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap',marginTop:18}}>
        <button onClick={()=>start('facile')} style={{...s.btn,padding:'12px 20px',fontSize:14}}>Facile · 6 paires{best.facile?` (record : ${best.facile} coups)`:''}</button>
        <button onClick={()=>start('difficile')} style={{...s.btn,padding:'12px 20px',fontSize:14,background:'var(--ink)',color:'#fff'}}>Difficile · 8 paires{best.difficile?` (record : ${best.difficile})`:''}</button>
      </div>
    </div>
  );

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12}}>
        <span style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <span className="chip" style={{background:'var(--yellow)'}}>⏱ {clock}</span>
          <span className="chip">🔁 {moves} coup{moves>1?'s':''}</span>
          <span className="chip" style={{background:'var(--mint)'}}>✓ {found.length}/{NIV[niv]}</span>
        </span>
        <button onClick={()=>setNiv(null)} style={{...s.btn,fontSize:12}}>Changer de niveau</button>
      </div>
      {fini&&(
        <div className="b pop" style={{background:'var(--yellow)',textAlign:'center',marginBottom:14}}>
          <p style={{fontSize:36}}>🎉</p>
          <p style={{fontFamily:'var(--display)',fontWeight:800,fontSize:26}}>Toutes les paires en {moves} coups et {clock} !</p>
          <p style={{fontSize:14,marginTop:4}}>{best[niv]===moves?'🏆 Nouveau record (ou record égalé) !':`Ton record : ${best[niv]} coups.`} Le score parfait, c'est {NIV[niv]} coups.</p>
          <button onClick={()=>start(niv)} style={{...s.btn,marginTop:12,background:'var(--ink)',color:'#fff'}}>🔄 Rejouer</button>
        </div>
      )}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:10}}>
        {cards.map(c=>{
          const ok=found.includes(c.f.nom);
          const vis=ok||up.includes(c.k);
          const wrong=up.length===2&&up.includes(c.k)&&cards[up[0]].f.nom!==cards[up[1]].f.nom;
          return(
            <button key={c.k} onClick={()=>flip(c)} disabled={ok} className={wrong?'shake':''} aria-label={vis?(c.kind==='nom'?c.f.nom:c.f.ex):'Carte cachée'}
              style={{minHeight:130,border:'2px solid var(--ink)',borderRadius:16,padding:10,boxShadow:ok?'none':'3px 3px 0 var(--ink)',cursor:ok?'default':'pointer',
                background:ok?'var(--mint)':vis?(c.kind==='nom'?'var(--yellow)':'#fff'):'var(--violet)',color:vis?'var(--ink)':'#fff',opacity:ok?0.75:1,
                display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center'}}>
              {!vis
                ?<span style={{fontFamily:'var(--display)',fontWeight:800,fontSize:34}}>?</span>
                :c.kind==='nom'
                  ?<span className="fade" style={{fontFamily:'var(--display)',fontWeight:800,fontSize:17,lineHeight:1.15}}>{c.f.nom}</span>
                  :<span className="fade" style={{fontFamily:'var(--serif)',fontStyle:'italic',fontSize:13,lineHeight:1.35}}>« {c.f.ex} »</span>}
            </button>
          );
        })}
      </div>
      {last&&!fini&&(
        <div key={last.nom} className="b fade" style={{marginTop:14,background:'var(--mint)',padding:14}}>
          <p style={{fontWeight:800}}>✓ {last.nom}</p>
          <p style={{fontSize:13.5,marginTop:4,lineHeight:1.5}}>{last.def} <span style={{color:'var(--muted)'}}>Effet : {last.effet}</span></p>
        </div>
      )}
    </div>
  );
}
